<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://affandymurad.github.io/wiki/">
<title>Wikikategori telah pindah</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('wikikategoriTheme') || 'system';
    var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch(e){ /* localStorage unavailable */ }
})();
</script>
<style>
  :root{
    --bg:#f6f9fc; --surface:#ffffff; --ink:#0f1b2d; --muted:#51607a; --line:#dbe4ee;
    --brand:#0077b6; --brand-2:#00b4d8; --soft:#e8f3fa;
    --shadow:0 10px 30px rgba(15,27,45,.08);
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0b1220; --surface:#121b2e; --ink:#eaf1fb; --muted:#9fb0c9; --line:#243049; --soft:#14263d;
    --shadow:0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
    background:var(--bg);color:var(--ink);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .card{
    width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:32px 28px;box-shadow:var(--shadow);text-align:center;
  }
  .badge{display:inline-block;background:var(--soft);color:var(--brand);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;}
  h1{font-size:clamp(24px,5vw,30px);line-height:1.2;margin:16px 0 10px;letter-spacing:-.02em;}
  p{margin:0 0 8px;color:var(--muted);}
  .url{display:inline-block;margin:10px 0 22px;padding:8px 14px;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:700;overflow-wrap:anywhere;}
  .btn{
    display:inline-block;padding:12px 24px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 8px 20px rgba(0,119,182,.28);
  }
  .btn:hover{filter:brightness(1.06);}
  .en{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;}
  .en a{color:var(--brand);}
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Wikikategori</span>
    <h1>Halaman ini telah pindah</h1>
    <p>Wikikategori kini beralamat di:</p>
    <div class="url">affandymurad.github.io/wiki</div><br>
    <a class="btn" href="/wiki/">Buka alamat baru</a>
    <p class="en">This page has moved to <a href="/wiki/">affandymurad.github.io/wiki</a>. Please update your bookmarks.</p>
  </main>
</body>
</html>
