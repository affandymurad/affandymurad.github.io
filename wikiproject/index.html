<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images for WikiProjects</title>
<meta name="description" content="Find Wikipedia articles with no lead image in a WikiProject and match them with images from Wikimedia Commons.">
<style>
/* Satu file: HTML + CSS + JS. Tanpa library, font, atau ikon eksternal. */
:root {
  --bg: #f3f6fc; --surface: #ffffff; --ink: #0c1a36; --muted: #526080; --line: #dde4f1; --soft: #eaeff9;
  --brand: #2d4f9c; --brand-2: #5278d0; --brand-text: #2d4f9c; --on-brand: #ffffff; --danger: #c62839; --ok: #198754;
  --ring: color-mix(in srgb, var(--brand-2) 38%, transparent);
  --shadow: 0 1px 2px rgba(12, 26, 54, .04), 0 12px 32px rgba(33, 58, 122, .09);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #080f20; --surface: #0f1a33; --ink: #e8eefc; --muted: #9aaccc; --line: #213056; --soft: #15244a;
    --brand: #3f66bf; --brand-2: #6d93e8; --brand-text: #8fb1f2; --danger: #f87171; --ok: #4ade80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .38);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--brand-text); text-underline-offset: 3px; }
.wrap { width: min(1100px, 100% - 32px); margin: 0 auto; padding: 24px 0 56px; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; margin-bottom: 20px; }
.top h1 { margin: 0; }
.top .sub { grid-column: 1 / -1; }
h1 { font-size: clamp(22px, 4vw, 30px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -.02em; }
.sub { margin: 0; color: var(--muted); font-size: 15px; max-width: 46em; }
.switch { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 80px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; cursor: pointer; background: var(--surface); color: var(--muted); font: 600 12.5px/1 inherit; }
.switch span { position: relative; z-index: 1; display: grid; place-items: center; }
.switch i { position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: 28px; border-radius: 999px; background: var(--brand); transition: transform .22s; }
.switch[aria-checked="false"] span:first-of-type, .switch[aria-checked="true"] span:last-of-type { color: #fff; }
.switch[aria-checked="true"] i { transform: translateX(100%); }
.switch:disabled { opacity: .5; cursor: not-allowed; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }   /* tanpa overflow:hidden agar dropdown tidak terpotong */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; }
.bgrp { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.acts { flex-wrap: nowrap; }
.lbl { font-size: 13px; color: var(--muted); }
.push { margin-left: auto; }
.n { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; font-size: 12px; font-weight: 800; color: var(--on-brand); background: linear-gradient(140deg, var(--brand), var(--brand-2)); }
button, input, select { font: inherit; }
input[type="text"] { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); color: var(--ink); font-size: 14px; min-width: 0; }
input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover:not(:disabled) { border-color: var(--brand-2); background: var(--soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover:not(:disabled) { background: var(--brand-2); }
.chip { padding: 5px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--on-brand); background: var(--brand); border-color: var(--brand); }
.combo { position: relative; width: 240px; }
.combo input { width: 100%; padding-right: 34px; }
.chev { position: absolute; right: 2px; top: 2px; bottom: 2px; width: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
.chev:hover { background: var(--line); }
.lb { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: max(100%, 340px); max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.lbsearch { padding: 8px; border-bottom: 1px solid var(--line); }
.lbsearch input { width: 100%; padding-right: 12px; }
.lbmeta { padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
#plistitems { position: relative; max-height: 280px; overflow: auto; }
#proj[readonly] { cursor: pointer; caret-color: transparent; user-select: none; text-overflow: ellipsis; }
#proj[readonly]::selection { background: transparent; }
.nodata { padding: 48px 20px; text-align: center; color: var(--muted); border-radius: 0 0 18px 18px; }
.nodata[hidden] { display: none; }
.nodata b { display: block; margin-bottom: 6px; color: var(--ink); font-size: 16px; }
.nodata p { margin: 0 auto; max-width: 440px; font-size: 14px; line-height: 1.5; }
.chip:disabled, .chev:disabled { opacity: .5; cursor: not-allowed; }
.opt { display: block; width: 100%; padding: 7px 12px; border: 0; background: transparent; color: var(--ink); text-align: left; font-size: 14px; cursor: pointer; overflow-wrap: anywhere; }
.opt:hover, .opt.act { background: var(--soft); }
.opt[aria-selected="true"] { color: var(--brand-text); font-weight: 700; box-shadow: inset 3px 0 0 var(--brand); }

.prog { height: 4px; background: var(--soft); }
.prog div { height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .25s; }
.stat { padding: 8px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); min-height: 36px; }
.stat.err { color: var(--danger); }

.cols { display: grid; grid-template-columns: 320px minmax(0, 1fr); overflow: hidden; border-radius: 0 0 18px 18px; }
.left { border-right: 1px solid var(--line); min-width: 0; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } .left { border-right: 0; border-bottom: 1px solid var(--line); } .combo { width: 100%; } }
.ph { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.note { padding: 8px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.flt { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.flt input { width: 100%; }
.fpchk { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; line-height: 1.4; }
.fpchk input { width: auto; margin-top: 2px; accent-color: var(--brand); flex: none; }
.tg.fp { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 16px; font-size: 13px; color: var(--muted); }
.pager:empty { display: none; }
.pager select, .pager input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--ink); font-size: 13px; }
.pager input { width: 62px; }
.pg-size { display: inline-flex; align-items: center; gap: 6px; }
.pg-nav { display: inline-flex; align-items: center; gap: 6px; }
.btn.pg { padding: 4px 10px; min-width: 34px; }
.pg-info { display: inline-flex; align-items: center; gap: 6px; }
.it { display: block; width: 100%; padding: 9px 16px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.it:hover { background: var(--soft); }
.it[aria-current="true"] { background: color-mix(in srgb, var(--brand-2) 16%, var(--surface)); box-shadow: inset 3px 0 0 var(--brand); }
.it b { display: block; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.it small { color: var(--muted); font-size: 12.5px; }
.tg { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--soft); border: 1px solid var(--line); color: var(--muted); }
.tg.top { color: var(--brand-text); border-color: color-mix(in srgb, var(--brand-2) 40%, transparent); }
.empty { padding: 24px 16px; color: var(--muted); font-size: 14px; }

.right { min-width: 0; }
.rhead { padding: 12px 16px 0; }
.rhead h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.rinfo { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.search { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
.search input { flex: 1 1 200px; }
.cat { padding: 8px 16px 0; font-size: 13px; color: var(--muted); }
.cat button { margin-left: 6px; }
.rstat { padding: 8px 16px 0; font-size: 13px; color: var(--muted); min-height: 28px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; padding: 8px 16px 14px; align-items: stretch; }
.tl { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; text-align: left; cursor: pointer; color: var(--ink); }
.tl[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
.th { position: relative; flex: none; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: var(--soft); border-bottom: 1px solid var(--line); }
.th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.tb { display: flex; flex-direction: column; flex: 1; gap: 6px; padding: 9px 10px 10px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.tb b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; color: var(--ink); font-weight: 600; font-size: 12.5px; }
.tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.src { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--soft); color: var(--brand-text); }
.lic { overflow-wrap: anywhere; }
.dim { margin-top: auto; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 16px 16px; }
.sel { padding: 0 16px 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.help { margin-top: 18px; padding: 0; }
.help summary { padding: 14px 18px; font-weight: 700; font-size: 16px; cursor: pointer; }
.helpbody { padding: 0 18px 18px; }
.hintro { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.hitem { background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.hitem h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14.5px; }
.hitem p { margin: 0; font-size: 13.5px; color: var(--muted); }
.help b { color: var(--ink); }
.help code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface); padding: 1px 6px; border-radius: 6px; color: var(--ink); }
.hsteps-t { margin: 18px 0 8px; font-size: 14.5px; }
.hsteps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; }
.hsteps li { margin: 3px 0; }
footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1 data-i18n="title"></h1>
    <button id="lang" class="switch" type="button" role="switch" aria-checked="false"><i></i><span>EN</span><span>ID</span></button>
    <p class="sub" data-i18n="sub"></p>
  </div>

  <div class="card">
    <div class="bar">
      <div class="bgrp">
      <span class="n">1</span>
      <label class="lbl" for="proj" data-i18n="wikiproject"></label>
      <div class="combo" id="combo">
        <input id="proj" type="text" aria-haspopup="listbox" aria-expanded="false" aria-controls="plistitems" value="" readonly data-i18n-ph="projPh" autocomplete="off" spellcheck="false">
        <button id="projBtn" class="chev" type="button" tabindex="-1" aria-label="Show all WikiProjects">&#9662;</button>
        <div id="plistbox" class="lb" hidden>
          <div class="lbsearch"><input id="projQ" type="text" role="combobox" aria-expanded="true" aria-controls="plistitems" aria-autocomplete="list" data-i18n-ph="projSearchPh" autocomplete="off" spellcheck="false"></div>
          <div class="lbmeta" id="plistmeta"></div>
          <div id="plistitems" role="listbox"></div>
        </div>
      </div>
      <span class="lbl" data-i18n="importance"></span>
      <button class="chip" type="button" data-imp="Top" aria-pressed="true" data-i18n="impTop"></button>
      <button class="chip" type="button" data-imp="High" aria-pressed="true" data-i18n="impHigh"></button>
      <button class="chip" type="button" data-imp="Mid" aria-pressed="false" data-i18n="impMid"></button>
      <button class="chip" type="button" data-imp="Low" aria-pressed="false" data-i18n="impLow"></button>
      <button class="chip" type="button" data-imp="Unrated" aria-pressed="false" data-i18n="unrated"></button>
      <span class="lbl" id="wikiHost"></span>
      </div>
      <div class="bgrp acts">
      <button id="bLoad" class="btn primary" type="button" data-i18n="load"></button>
      <button id="bRefresh" class="btn" type="button" data-i18n="refresh"></button>
      <button id="bStop" class="btn" type="button" data-i18n="stop" disabled></button>
      </div>
    </div>
    <div class="prog"><div id="bar"></div></div>
    <div class="stat" id="stat" role="status"></div>

    <div class="nodata" id="nodata" role="status" hidden>
      <b data-i18n="noDataT"></b>
      <p data-i18n="noDataD"></p>
    </div>

    <div class="cols" id="cols">
      <section class="left" aria-label="Articles">
        <div class="ph"><span class="n">2</span><span data-i18n="leftTitle"></span><span class="lbl push" id="cnt"></span></div>
        <div class="note" data-i18n="heuristic"></div>
        <div class="flt"><input id="flt" type="text" data-i18n-ph="filterPh" aria-label="Filter">
          <label class="fpchk" id="fpWrap" hidden><input id="fpChk" type="checkbox"><span id="fpTxt"></span></label></div>
        <div id="list"></div>
        <div class="pager" id="lpager"></div>
      </section>

      <section class="right" aria-label="Images">
        <div class="ph"><span class="n">3</span><span data-i18n="rightTitle"></span></div>
        <div id="rEmpty" class="empty" data-i18n="pickArticle"></div>
        <div id="rBody" hidden>
          <div class="rhead">
            <h2><a id="rTitle" href="#" target="_blank" rel="noopener"></a></h2>
            <p class="rinfo" id="rMeta"></p>
            <p class="rinfo" id="rFiles"></p>
          </div>
          <div class="search">
            <input id="q" type="text" data-i18n-ph="searchPh" aria-label="Search Commons">
            <button id="bSearch" class="btn" type="button" data-i18n="search"></button>
            <button id="bCat" class="btn" type="button" data-i18n="category"></button>
          </div>
          <div class="cat" id="catHint" hidden></div>
          <div class="rstat" id="rStat" role="status"></div>
          <div class="grid" id="grid"></div>
          <div class="pager" id="rpager"></div>
          <div class="sel" id="sel"></div>
          <div class="actions">
            <button id="bCopy" class="btn" type="button" disabled data-i18n="copyWikitext"></button>
            <a id="bEdit" class="btn" href="#" target="_blank" rel="noopener" data-i18n="openEdit"></a>
            <a id="bCommons" class="btn" href="#" target="_blank" rel="noopener" hidden data-i18n="viewCommons"></a>
            <span class="lbl" id="rMsg" role="status"></span>
          </div>
        </div>
      </section>
    </div>
  </div>
  <details class="card help" id="help">
    <summary data-i18n="helpTitle"></summary>
    <div class="helpbody">
      <p class="hintro" data-i18n-html="helpIntro"></p>
      <div class="hgrid">
        <div class="hitem"><h3><span class="n">1</span><span data-i18n="hProjT"></span></h3><p data-i18n-html="hProj"></p></div>
        <div class="hitem"><h3><span class="n">1</span><span data-i18n="hImpT"></span></h3><p data-i18n-html="hImp"></p></div>
        <div class="hitem"><h3><span class="n">1</span><span data-i18n="hLoadT"></span></h3><p data-i18n-html="hLoad"></p></div>
        <div class="hitem"><h3><span class="n">1</span><span data-i18n="hRefT"></span></h3><p data-i18n-html="hRef"></p></div>
        <div class="hitem"><h3><span class="n">2</span><span data-i18n="h2T"></span></h3><p data-i18n-html="h2"></p></div>
        <div class="hitem"><h3><span class="n">3</span><span data-i18n="h3T"></span></h3><p data-i18n-html="h3"></p></div>
      </div>
      <h3 class="hsteps-t" data-i18n="hStepsT"></h3>
      <ol class="hsteps">
        <li data-i18n-html="hS1"></li>
        <li data-i18n-html="hS2"></li>
        <li data-i18n-html="hS3"></li>
        <li data-i18n-html="hS4"></li>
      </ol>
    </div>
  </details>
  <footer>
    <span data-i18n="dataNote"></span> ·
    <a href="https://meta.wikimedia.org/wiki/User:Affandy_Murad" target="_blank" rel="noopener" data-i18n="credit"></a> ·
    <span data-i18n-html="protoNote"></span>
  </footer>
</main>

<script>
// Bahasa antarmuka = Wikipedia yang dibaca: EN memakai en.wikipedia.org, ID memakai id.wikipedia.org
const WIKI = {
  en: { api: 'https://en.wikipedia.org/w/api.php', host: 'en.wikipedia.org' },
  id: { api: 'https://id.wikipedia.org/w/api.php', host: 'id.wikipedia.org' },
};
let WP = WIKI.en.api;
const COMMONS = 'https://commons.wikimedia.org/w/api.php';
const WD = 'https://www.wikidata.org/w/api.php';
const BATCH = 50;            // judul per request (batas pageimages)
const PARALLEL = 3;
const MAX_RAW = 200000;      // batas halaman proyek yang dibaca dari browser
const MAX_OFFSET = 10000;    // batas offset pencarian Commons
const CACHE_MS = 24 * 3600 * 1000;
const ARTICLE_CLASSES = new Set(['FA', 'A', 'GA', 'B', 'C', 'Start', 'Stub']);
const RANK = { Top: 0, High: 1, Mid: 2, Low: 3, Unrated: 4 };
const ICON = /(Commons-logo|Ambox|Question_book|Wiki(?:books|quote|source|tionary|news|versity|data|media)|Edit-clear|Symbol_|Flag_of|Portal-|Crystal|Padlock|OOjs|Nuvola|Folder|Increase2|Decrease2|P_vip|Text_document|Searchtool|Speaker_Icon|Gnome|Information_icon|Disambig|Mergefrom|Mergeto|Lock-|Stub|Cscr|Red_pog|Blue_pog|Green_pog|Yellow_pog|Antu)/i;
const $ = (id) => document.getElementById(id);

// ---------- bahasa ----------
const I18N = {
  en: {
    title: 'Images for WikiProjects',
    sub: 'Find English Wikipedia articles with no lead image in a WikiProject, then match them with images from Wikimedia Commons.',
    wikiproject: 'WikiProject', importance: 'Importance', unrated: 'Unrated',
    impTop: 'Top', impHigh: 'High', impMid: 'Mid', impLow: 'Low', classWord: 'class',
    load: 'Load articles', refresh: 'Refresh data', stop: 'Stop',
    leftTitle: 'Articles without lead image', filterPh: 'Filter by title',
    perPage: 'Per page', first: 'First page', prev: 'Previous page', next: 'Next page', last: 'Last page',
    pageLabel: 'Page', ofN: (n) => `of ${n.toLocaleString()}`, pageN: (p) => `Page ${p}`,
    rangeFmt: (a, b, n) => `${a.toLocaleString()}–${b.toLocaleString()} of ${n.toLocaleString()}`,
    projCount: (n, total) => (n === total ? `${total.toLocaleString()} WikiProjects` : `${n.toLocaleString()} of ${total.toLocaleString()} WikiProjects`),
    projPh: 'Select a WikiProject', noDataT: 'No data yet', noDataD: 'Choose a WikiProject and importance levels above, then click “Load articles”. The article list and image candidates will appear here.', pickProject: 'Choose a WikiProject first.',
    projNone: 'No matching WikiProject', projAll: 'Show all WikiProjects', projSearchPh: 'Search WikiProjects…',
    filtersChanged: 'Filters changed. Click “Load articles” to refresh the list.',
    heuristic: 'Based on the lead image MediaWiki detects (PageImages). An article may still use other files.',
    rightTitle: 'Images from Commons', pickArticle: 'Pick an article on the left.',
    searchPh: 'Search term or category name', search: 'Search', category: 'Category',
    searching: 'Searching Commons…', noResults: 'No images found. Try another term or a category.', imgFail: 'Could not load images.',
    srcWikidata: 'Wikidata', srcSearch: 'Search', srcCategory: 'Category',
    otherFiles: (n) => (n ? `This article already uses ${n} other files (icons not counted).` : 'This article uses no files other than icons.'),
    catHint: 'Commons category from Wikidata:',
    copyWikitext: 'Copy wikitext', openEdit: 'Open edit page', viewCommons: 'View on Commons',
    copied: 'Copied', copyFail: 'Copy failed', pickImage: 'Pick an image to copy its wikitext.', picked: (n, l) => `Selected: ${n}${l ? ' · ' + l : ''}`,
    projLoading: 'Loading the WikiProject list…', projFail: 'Could not load the WikiProject list (you can still type a name).',
    reading: (n) => `Reading project… ${n.toLocaleString()} articles`, cached: (d) => `Using data saved ${d}`,

let lang = 'en';
try { const l = localStorage.getItem('wpi-lang'); if (l === 'en' || l === 'id') lang = l; } catch {}

// ---------- util ----------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function api(base, params, signal) {
  const res = await fetch(base + '?' + new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', ...params }), { signal });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error.info || data.error.code);
  return data;
}
async function apiRetry(base, params, signal) {
  try { return await api(base, params, signal); }
  catch (e) { if (signal?.aborted) throw e; await sleep(700); return api(base, params, signal); }
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const wikiUrl = (title) => 'https://' + WIKI[lang].host + '/wiki/' + encodeURIComponent(title.replace(/ /g, '_')).replace(/%2F/g, '/').replace(/%3A/g, ':');

// cache IndexedDB (gagal = diam-diam tanpa cache)
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('wpi', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.open(); return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch { return undefined; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch {} },
};

// ---------- paginasi (dipakai panel 2 dan 3) ----------
// st: {page, size, sizes, total|null, hasNext}; onChange({size,page}) atau onChange({page}); opts: {jump, range}
function renderPager(host, st, onChange, opts = {}) {
  const pages = st.total == null ? null : Math.max(1, Math.ceil(st.total / st.size));
  const sig = JSON.stringify([st.page, st.size, st.total, st.hasNext, pages, !!opts.jump, !!opts.range, lang]);
  if (host.dataset.sig === sig && host.firstChild) return;   // jangan bangun ulang jika tidak berubah (menjaga fokus)
  host.dataset.sig = sig;
  host.textContent = '';

  const size = el('label', 'pg-size'); size.append(t('perPage'));
  const sel = document.createElement('select');
  for (const n of st.sizes) { const o = el('option', '', String(n)); o.value = String(n); o.selected = n === st.size; sel.append(o); }
  sel.onchange = () => onChange({ size: +sel.value, page: 0 });
  size.append(sel);
  if (opts.range && st.total != null) {
    const from = st.total ? st.page * st.size + 1 : 0, to = Math.min(st.total, (st.page + 1) * st.size);
    size.append(el('span', '', t('rangeFmt', from, to, st.total)));
  }

  const nav = el('div', 'pg-nav');
  const btn = (label, aria, disabled, page) => { const b = el('button', 'btn pg', label); b.type = 'button'; b.setAttribute('aria-label', aria); b.disabled = disabled; b.onclick = () => onChange({ page }); return b; };
  const atStart = st.page <= 0, atEnd = !st.hasNext;
  nav.append(btn('«', t('first'), atStart, 0), btn('‹', t('prev'), atStart, st.page - 1));
  const info = el('span', 'pg-info');
  if (opts.jump && pages != null) {
    const input = document.createElement('input');
    input.type = 'number'; input.min = '1'; input.max = String(pages); input.value = String(st.page + 1); input.setAttribute('aria-label', t('pageLabel'));
    const go = () => { const v = Math.min(pages, Math.max(1, Math.floor(+input.value) || 1)); onChange({ page: v - 1 }); };
    input.onchange = go;
    info.append(t('pageLabel'), input, t('ofN', pages));
  } else info.textContent = pages != null ? `${t('pageN', st.page + 1)} ${t('ofN', pages)}` : t('pageN', st.page + 1);
  nav.append(info, btn('›', t('next'), atEnd, st.page + 1));
  if (opts.jump && pages != null) nav.append(btn('»', t('last'), atEnd, pages - 1));
  host.append(size, nav);
}

// ---------- Wikipedia bahasa Indonesia: ProyekWiki berbasis kategori ----------
// id.wikipedia.org tidak memakai PageAssessments. Penilaian ada di kategori, mis. "Artikel Medis sangat penting"
// (anggotanya halaman pembicaraan) dan "Artikel Medis kelas C" (kelas). Daftar proyek = kategori "Artikel X menurut kepentingan".
const ID_IMP_TERMS = [['sangat penting', 'Top'], ['penting', 'High'], ['cukup penting', 'Mid'], ['kurang penting', 'Low'], ['NA', ''], ['belum dinilai', '']];
const ID_SKIP_CLASS = new Set(['daftar', 'kategori', 'portal', 'proyek', 'templat', 'berkas', 'disambig', 'dab', 'pengalihan', 'NA', 'draf', 'buku', 'file']);
let idCats = null;   // Map: nama kategori -> jumlah anggota

async function getIdCats(signal) {
  if (idCats) return idCats;
  const entry = await idb.get('idcats');
  if (entry && Date.now() - entry.t < CACHE_MS) return (idCats = new Map(entry.list));
  const list = []; let cont = {};
  for (;;) {
    const d = await apiRetry(WIKI.id.api, { action: 'query', list: 'allcategories', acprefix: 'Artikel ', aclimit: '500', acprop: 'size', ...cont }, signal);
    for (const c of d.query.allcategories) list.push([c.category, c.pages]);
    if (!d.continue) break;
    cont = d.continue;
    await sleep(60);
  }
  idb.set('idcats', { t: Date.now(), list });
  return (idCats = new Map(list));
}
// jumlah artikel bernilai suatu proyek; wanted (Set kunci Top/High/...) membatasi ke level yang dipilih
const idImpTotal = (cats, p, wanted) => ID_IMP_TERMS.reduce((n, [term, key]) => n + (!wanted || wanted.has(impOf(key)) ? (cats.get(`Artikel ${p} ${term}`) || 0) : 0), 0);
const BIG_READ = 20000;      // membaca >20 ribu anggota kategori: minta konfirmasi dulu
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function idProjects(cats) {
  const names = [];
  for (const name of cats.keys()) {
    const m = name.match(/^Artikel (.+) menurut kepentingan$/);
    if (m && idImpTotal(cats, m[1]) > 0) names.push(m[1]);     // hanya proyek yang punya artikel bernilai
  }
  return names;
}
async function categoryMembers(cat, signal, onPage) {
  const out = []; let cont = {};
  for (;;) {
    const d = await apiRetry(WIKI.id.api, { action: 'query', list: 'categorymembers', cmtitle: 'Category:' + cat, cmnamespace: '1', cmlimit: '500', cmprop: 'title', ...cont }, signal);
    for (const m of d.query.categorymembers) out.push(m.title.replace(/^[^:]+:/, ''));   // "Pembicaraan:X" -> "X"
    onPage?.(d.query.categorymembers.length);
    if (!d.continue) break;
    cont = d.continue;
    await sleep(60);
  }
  return out;
}
// Hanya level kepentingan yang dipilih (wanted) yang dibaca. Kategori gabungan "Artikel X kelas C penting" memberi kelas dan
// kepentingan sekaligus; jika proyek tidak punya kategori gabungan, dipakai kategori kepentingan saja (kelas "-").
async function enumerateId(project, wanted, signal) {
  const cats = await getIdCats(signal);
  const prefix = `Artikel ${project}`;
  const rows = new Map();
  let fetched = 0;
  const bump = (n) => { fetched += n; setStatus(() => t('reading', fetched)); };   // kabar tiap halaman anggota kategori
  for (const [term, key] of ID_IMP_TERMS) {
    if (!wanted.has(impOf(key))) continue;
    const re = new RegExp(`^${escRe(prefix)} (?:kelas (\\S+)|belum dinilai) ${escRe(term)}$`);
    const sources = [];
    for (const [name, size] of cats) { const m = size && name.match(re); if (m) sources.push([name, m[1] || '-']); }
    if (!sources.length && cats.get(`${prefix} ${term}`)) sources.push([`${prefix} ${term}`, '-']);
    for (const [name, cls] of sources) {
      if (ID_SKIP_CLASS.has(cls)) continue;
      for (const title of await categoryMembers(name, signal, bump)) if (!rows.has(title)) rows.set(title, [title, cls, key]);
    }
  }
  return [...rows.values()];
}

async function loadProjects() {
  const my = ++projToken, forLang = lang;

  try {

    if (forLang === 'id') list = idProjects(await getIdCats());
    else list = (await api(WIKI.en.api, { action: 'query', list: 'projects' })).query.projects;
    if (my !== projToken) return;      // bahasa berganti selagi memuat
    projects = list.slice().sort((a, b) => a.localeCompare(b));
    setStatus(() => '');

// Gulir HANYA di dalam daftar. scrollIntoView() juga menggulir semua induknya (termasuk kartu) sehingga layout bergeser.
function scrollOpt(opt, center) {
  const box = $('plistitems'), top = opt.offsetTop, bottom = top + opt.offsetHeight;
  if (center) box.scrollTop = top - (box.clientHeight - opt.offsetHeight) / 2;
  else if (top < box.scrollTop) box.scrollTop = top;
  else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight;

function comboMove(d) {

// ---------- memuat artikel ----------
function selectedImps() { return new Set([...document.querySelectorAll('[data-imp][aria-pressed="true"]')].map((b) => b.dataset.imp)); }
function impOf(v) { return RANK[v] != null && v !== 'Unrated' ? v : 'Unrated'; }

async function enumerate(project, signal) {
  const rows = []; let raw = 0, cont = {};
  for (;;) {
    const d = await apiRetry(WP, { action: 'query', list: 'projectpages', wppprojects: project, wppassessments: '1', wpplimit: '500', ...cont }, signal);
    const part = Object.values(d.query?.projects || {})[0] || [];
    raw += part.length;
    for (const r of part) if (r.ns === 0 && ARTICLE_CLASSES.has(r.assessment?.class)) rows.push([r.title, r.assessment.class, r.assessment.importance || '']);
    setStatus(() => t('reading', rows.length));
    if (raw > MAX_RAW) throw Object.assign(new Error('too big'), { tooBig: true });
    if (!d.continue) break;
    cont = d.continue;
    await sleep(80);
  }
  return rows;
}

async function checkImages(list, signal) {
  const batches = [];
  for (let i = 0; i < list.length; i += BATCH) batches.push(list.slice(i, i + BATCH));
  let next = 0, done = 0;
  const byTitle = new Map(list.map((i) => [i.title, i]));
  const worker = async () => {
    while (next < batches.length && !signal.aborted) {
      const batch = batches[next++];
      try {
        const d = await apiRetry(WP, { action: 'query', prop: 'pageimages', piprop: 'name', pilimit: String(BATCH), pilicense: 'any', titles: batch.map((b) => b.title).join('|') }, signal);
        for (const p of d.query.pages) { const it = byTitle.get(p.title); if (it) it.img = !!p.pageimage; }
      } catch (e) { if (signal.aborted) return; }
      done += batch.length;
      setStatus(() => t('checking', done, list.length));
      $('bar').style.width = (done / list.length) * 100 + '%';
      renderList();
    }
  };
  await Promise.all(Array.from({ length: PARALLEL }, worker));
}

async function load(force) {
  if (running) return;
  const project = $('proj').value.trim();
  if (!project) { setStatus(() => t('pickProject'), true); return; }
  const imps = selectedImps();
  if (!imps.size) { setStatus(() => t('pickImp'), true); return; }
  if (projects.length && !projects.includes(project)) { setStatus(() => t('unknownProject'), true); return; }
  saveState();

  running = true; ctrl = new AbortController();
  items = []; cur = null; lp.page = 0; $('bar').style.width = '0';
  setBusy(true); renderList(); renderRight();
  setStatus(() => t('reading', 0));      // hapus pesan lama dan beri kabar segera
  try {
    // ID: hanya level kepentingan yang dipilih yang dibaca, jadi cache per proyek + level. EN: seluruh proyek.
    const key = lang === 'id' ? `enum:id:${project}:${[...imps].sort().join(',')}` : `enum:en:${project}`;
    let rows, entry = force ? undefined : await idb.get(key);
    if (entry && Date.now() - entry.t < CACHE_MS) {
      rows = entry.rows;
      const when = new Date(entry.t).toLocaleString(lang === 'id' ? 'id-ID' : 'en-US', { dateStyle: 'medium', timeStyle: 'short' });
      setStatus(() => t('cached', when));
      await sleep(250);
    } else {
      if (lang === 'id') {
        const total = idImpTotal(await getIdCats(ctrl.signal), project, imps);
        if (total > MAX_RAW) throw Object.assign(new Error('too big'), { tooBig: true });
        if (total > BIG_READ && !confirm(t('bigRead', total, Math.ceil(total / 500)))) { setStatus(() => t('stopped')); return; }
        rows = await enumerateId(project, imps, ctrl.signal);
      } else rows = await enumerate(project, ctrl.signal);
      idb.set(key, { t: Date.now(), rows });
    }
    items = rows.filter((r) => imps.has(impOf(r[2]))).map((r) => ({ title: r[0], cls: r[1], imp: impOf(r[2]), img: undefined }));
    if (!items.length) { setStatus(() => t('noArticles')); return; }
    const reqs = Math.ceil(items.length / BATCH);
    if (items.length > 2000 && !confirm(t('big', items.length, reqs))) { items = []; setStatus(() => t('stopped')); return; }
    renderList();
    await checkImages(items, ctrl.signal);
    if (!ctrl.signal.aborted) await checkLead(items, ctrl.signal);
    if (ctrl.signal.aborted) setStatus(() => t('stopped'));
    else { const c = items.filter((i) => i.img === false), fp = c.filter((i) => i.lead === 'photo').length, tot = items.length; setStatus(() => t('done2', c.length - fp, fp, tot)); }
  } catch (e) {
    if (ctrl?.signal.aborted) setStatus(() => t('stopped'));
    else if (e.tooBig) setStatus(() => t('tooBig', MAX_RAW), true);
    else { console.error(e); setStatus(() => t('loadFail'), true); }
  } finally {
    // selalu dijalankan, termasuk saat ada return di atas; tanpa ini UI tertahan dalam keadaan sibuk
    running = false; ctrl = null; setBusy(false); renderList();
  }
}

// Tahap 2: artikel yang "tanpa gambar utama" menurut PageImages diperiksa ulang lewat bagian pembuka (section 0).
// PageImages bisa melewatkan foto yang sempit/kecil; ikon dan SVG tidak dihitung sebagai foto.
const isPhotoFile = (n) => /\.(jpe?g|png|gif|webp|tiff?|jfif)$/i.test(n);
async function checkLead(list, signal) {
  const cands = list.filter((i) => i.img === false);
  let done = 0;
  const upd = () => { setStatus(() => t('checkingPhoto', done, cands.length)); $('bar').style.width = (cands.length ? done / cands.length * 100 : 100) + '%'; renderList(); };
  let next = 0;
  const run = async () => {
    while (next < cands.length && !signal.aborted) {
      const it = cands[next++], key = `lead:${lang}:${it.title}`;
      let v;
      const c = await idb.get(key);
      if (c && Date.now() - c.t < CACHE_MS) v = c.v;
      else {
        try {
          const d = await apiRetry(WP, { action: 'parse', page: it.title, prop: 'images', section: '0', redirects: '1' }, signal);
          v = (d.parse.images || []).some(isPhotoFile) ? 'photo' : 'none';
          idb.set(key, { t: Date.now(), v });
        } catch (e) { if (signal.aborted) return; }
      }
      if (v) it.lead = v;
      done++;
      if (done % 5 === 0 || done === cands.length) upd();
    }
  };
  upd();
  await Promise.all(Array.from({ length: PARALLEL }, run));
}

function renderRight() {

// teks dinamis di panel kanan disimpan sebagai state agar ikut berganti bahasa
function renderRightText() {

function tileFrom(p, source) {
  const ii = p.imageinfo?.[0];
  if (!ii || !/^image\/(jpeg|png|gif|svg\+xml|webp|tiff)$/.test(ii.mime)) return null;
  const lic = (ii.extmetadata?.LicenseShortName?.value || '').replace(/<[^>]*>/g, '');
  return { name: p.title.replace(/^File:/, ''), thumb: ii.thumburl || ii.url, page: ii.descriptionurl, w: ii.width, h: ii.height, lic, source, idx: p.index ?? 1e9 };
}
const IMGPROPS = { prop: 'imageinfo', iiprop: 'url|size|mime|extmetadata', iiurlwidth: '300', iiextmetadatafilter: 'LicenseShortName' };

function drawTiles() {
  const grid = $('grid'); grid.textContent = '';
  for (const tl of tiles) {
    const b = el('button', 'tl'); b.type = 'button';
    b.setAttribute('aria-pressed', String(pick === tl));
    const th = el('span', 'th'); const img = document.createElement('img');
    img.src = tl.thumb; img.alt = tl.name; img.loading = 'lazy'; th.append(img);
    const tb = el('span', 'tb');
    const name = el('b', '', tl.name); name.title = tl.name;
    const meta = el('span', 'tmeta');
    meta.append(el('span', 'src', t(tl.source === 'wikidata' ? 'srcWikidata' : tl.source === 'category' ? 'srcCategory' : 'srcSearch')));
    if (tl.lic) meta.append(el('span', 'lic', tl.lic));
    tb.append(name, meta);
    if (tl.w) tb.append(el('span', 'dim', `${tl.w}×${tl.h}`));
    b.append(th, tb);
    b.onclick = () => { pick = tl; drawTiles(); updatePick(); };
    grid.append(b);
  }
}
function updatePick() {

function renderRPager() {

  renderPager(host, { page: rp.page, size: rp.size, sizes: SIZES_R, total: rp.total, hasNext }, rpChange, { jump: rp.kind === 'search' && pages != null });
}

// memuat SATU halaman hasil dari Commons (paginasi di sisi server: hanya item halaman ini yang diminta)
async function loadPage() {
  sctrl?.abort(); sctrl = new AbortController();
  const signal = sctrl.signal, { kind, q, size, page } = rp;
  if (!q) return;
  rStatKey = 'searching'; renderRightText(); tiles = []; pick = null; drawTiles(); updatePick(); renderRPager();
  try {
    let params, totalReq = null;
    if (kind === 'category') {
      const title = 'Category:' + q.replace(/^Category:/i, '');
      params = { action: 'query', generator: 'categorymembers', gcmtitle: title, gcmtype: 'file', gcmlimit: String(size), ...IMGPROPS, ...(rp.tokens[page] || {}) };
      if (rp.total == null) totalReq = api(COMMONS, { action: 'query', prop: 'categoryinfo', titles: title }, signal).then((d) => d.query.pages[0]?.categoryinfo?.files ?? 0).catch(() => null);
    } else {
      const sq = q + ' filetype:bitmap|drawing';   // hanya gambar (tanpa PDF, audio, video)
      params = { action: 'query', generator: 'search', gsrsearch: sq, gsrnamespace: '6', gsrlimit: String(size), gsroffset: String(page * size), ...IMGPROPS };
      if (rp.total == null) totalReq = api(COMMONS, { action: 'query', list: 'search', srsearch: sq, srnamespace: '6', srlimit: '1', srinfo: 'totalhits' }, signal).then((d) => { const n = d.query.searchinfo?.totalhits; return n == null ? null : Math.min(n, MAX_OFFSET); }).catch(() => null);
    }
    const [d, total] = await Promise.all([apiRetry(COMMONS, params, signal), totalReq]);
    if (signal.aborted) return;
    if (total != null) rp.total = total;
    if (kind === 'category') rp.tokens[page + 1] = d.continue || null;
    const found = (d.query?.pages || []).map((p) => tileFrom(p, kind === 'category' ? 'category' : 'search')).filter(Boolean).sort((a, b) => a.idx - b.idx);
    const head = page === 0 && wdTile ? [wdTile] : [];       // gambar Wikidata hanya di halaman 1
    tiles = [...head, ...found.filter((x) => !head.length || x.name !== wdTile.name)];
    rStatKey = tiles.length ? '' : 'noResults'; renderRightText();
    drawTiles(); updatePick(); renderRPager();
  } catch (e) { if (!signal.aborted) { rStatKey = 'imgFail'; renderRightText(); } }
}

async function openArticle(it) {
  rctrl?.abort(); sctrl?.abort(); rctrl = new AbortController();
  const signal = rctrl.signal;
  renderRight();
  if (matchMedia('(max-width: 760px)').matches) $('rBody').closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const a = $('rTitle'); a.textContent = it.title; a.href = wikiUrl(it.title);
  $('rMeta').textContent = `${it.imp === 'Unrated' ? '' : impLabel(it.imp) + ' · '}${t('classWord')} ${it.cls}`;
  filesN = null; catName = null; rStatKey = ''; renderRightText();
  $('bEdit').href = 'https://' + WIKI[lang].host + '/w/index.php?title=' + encodeURIComponent(it.title.replace(/ /g, '_')) + '&action=edit';
  $('q').value = it.title; $('rMsg').textContent = '';
  tiles = []; pick = null; wdTile = null; rp.q = ''; rp.total = null; drawTiles(); updatePick(); renderRPager();

  // berapa berkas lain (bukan ikon) yang dipakai artikel ini
  (async () => {
    try {
      let n = 0, cont = {};
      do {
        const d = await api(WP, { action: 'query', prop: 'images', imlimit: '500', titles: it.title, ...cont }, signal);
        n += (d.query.pages[0].images || []).filter((i) => !ICON.test(i.title)).length; cont = d.continue || null;
      } while (cont);
      if (!signal.aborted) { filesN = n; renderRightText(); }
    } catch {}
  })();

  // petunjuk Wikidata: gambar P18 dan kategori Commons P373
  try {
    const pp = await api(WP, { action: 'query', prop: 'pageprops', ppprop: 'wikibase_item', titles: it.title }, signal);
    const qid = pp.query.pages[0]?.pageprops?.wikibase_item;
    if (qid) {
      const e = await api(WD, { action: 'wbgetentities', ids: qid, props: 'claims' }, signal);
      const claims = e.entities?.[qid]?.claims || {};
      const image = claims.P18?.[0]?.mainsnak?.datavalue?.value, cat = claims.P373?.[0]?.mainsnak?.datavalue?.value;
      if (cat) { catName = cat; renderRightText(); }
      if (image) {
        const c = await api(COMMONS, { action: 'query', titles: 'File:' + image, ...IMGPROPS }, signal);
        wdTile = tileFrom(c.query.pages[0], 'wikidata');
      }
    }
  } catch (e) { if (signal.aborted) return; }
  if (signal.aborted) return;
  await runSearch('search');
}

// combobox WikiProject
// kotak utama hanya menampilkan pilihan; kotak pencarian ada di dalam dropdown
const toggleCombo = () => { if (running || !projects.length) return; if (combo.open) comboClose(true); else comboOpen(); };
$('proj').addEventListener('click', toggleCombo);
$('projBtn').addEventListener('click', toggleCombo);
$('proj').addEventListener('keydown', (e) => {
  if (!$('proj').readOnly) { if (e.key === 'Enter') load(false); return; }   // cadangan jika daftar proyek gagal dimuat: ketik manual
  if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); if (!combo.open) toggleCombo(); }
});
$('projQ').addEventListener('input', () => { combo.active = -1; comboRender(); if (combo.shown.length) comboMove(1); });
$('projQ').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); comboMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); comboMove(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (combo.active >= 0) comboPick(combo.shown[combo.active]); }
  else if (e.key === 'Escape') { e.preventDefault(); comboClose(true); }
  else if (e.key === 'Tab') comboClose();
});
document.addEventListener('click', (e) => { if (combo.open && !$('combo').contains(e.target)) comboClose(); });
$('bSearch').onclick = () => runSearch('search');
$('bCat').onclick = () => runSearch('category');
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch('search'); });
$('bCopy').onclick = async () => {
  if (!pick) return;
  const text = `[[File:${pick.name}|thumb|]]`;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    // cadangan untuk browser/iframe yang memblokir Clipboard API
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
  }
  // jika semua gagal, tampilkan teksnya supaya bisa disalin manual
  $('rMsg').textContent = ok ? t('copied') : t('copyFail') + ': ' + text;
  if (ok) setTimeout(() => { $('rMsg').textContent = ''; }, 2000);
};
$('lang').onclick = () => {
  if (running) return;
  saveState();                                   // simpan pilihan bahasa lama
  lang = lang === 'en' ? 'id' : 'en';
  try { localStorage.setItem('wpi-lang', lang); } catch {}
  WP = WIKI[lang].api;                           // ganti Wikipedia yang dibaca
  resetAll();
  restoreState();                                // proyek dan importance milik bahasa baru
  applyLang();
  loadProjects();
};

function applyLang() {
  document.documentElement.lang = lang; document.title = t('title');
  for (const e of document.querySelectorAll('[data-i18n]')) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll('[data-i18n-ph]')) e.placeholder = t(e.dataset.i18nPh);
  for (const e of document.querySelectorAll('[data-i18n-html]')) e.innerHTML = t(e.dataset.i18nHtml);   // teks statis tepercaya (berisi <b>, <code>)
  $('lang').setAttribute('aria-checked', String(lang === 'id'));
  $('lang').setAttribute('aria-label', lang === 'id' ? 'Ganti bahasa' : 'Switch language');
  $('stat').textContent = statusFn();
  $('projBtn').setAttribute('aria-label', t('projAll'));
  $('wikiHost').textContent = WIKI[lang].host;
  if (combo.open) comboRender();
  renderList(); drawTiles(); updatePick(); renderRightText(); renderRPager();
}

// ---------- mulai ----------
restoreState();
applyLang();
renderRight();
loadProjects();
</script>
</body>
</html>
