<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikilacak</title>
<script>try{var p=JSON.parse(localStorage.getItem("wikilacak.prefs.v1"));if(p&&(p.theme==="light"||p.theme==="dark"))document.documentElement.setAttribute("data-theme",p.theme)}catch(e){}</script>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e6e8ee; --soft:#f7f8fb;
  --primary:#1f6feb; --on-primary:#fff; --primary-soft:#e8f1ff;
  --green:#15803d; --green-soft:#e6f6ec; --red:#dc2626;
  --new-row:#f1f6ff; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);
  --pulse:rgba(31,111,235,.5); --radius:14px;
}
/* tema: Sistem = ikuti perangkat, Terang/Gelap = pilihan manual */
:root{color-scheme:light}
:root[data-theme="dark"]{
    --bg:#0d1117; --card:#151a22; --ink:#e6edf3; --muted:#8b95a3; --line:#262d38; --soft:#1a212b;
    --primary:#58a6ff; --on-primary:#06101f; --primary-soft:#12284a;
    --green:#4ac26b; --green-soft:#12301d; --red:#ff7b72; --new-row:#132238; --shadow:none;
    --pulse:rgba(88,166,255,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --card:#151a22; --ink:#e6edf3; --muted:#8b95a3; --line:#262d38; --soft:#1a212b;
    --primary:#58a6ff; --on-primary:#06101f; --primary-soft:#12284a;
    --green:#4ac26b; --green-soft:#12301d; --red:#ff7b72; --new-row:#132238; --shadow:none;
    --pulse:rgba(88,166,255,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- navbar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.chips{display:flex;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{background:var(--soft);color:var(--ink)}
.chip[aria-selected="true"]{background:var(--primary-soft);color:var(--primary)}
.tools{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.select-wrap{position:relative;display:inline-flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding-block:0;padding-inline:10px 8px;gap:6px;color:var(--muted);max-width:100%}
.wmark.ico{display:inline-flex;align-items:center;margin-top:0;color:var(--muted)}
.wmark{font-family:"Linux Libertine","Libertine",Georgia,"Times New Roman",serif;font-weight:700;font-size:20px;line-height:1;color:var(--ink);letter-spacing:-.04em;margin-top:-2px}
.select-wrap select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);font-weight:600;padding:0;padding-inline-end:18px;height:100%;cursor:pointer;max-width:100%}
.select-wrap select:focus-visible{outline:none}
.select-wrap:focus-within{outline:2px solid var(--primary);outline-offset:2px}
.select-wrap::after{content:"";position:absolute;inset-inline-end:11px;top:13px;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.select-wrap option{color:#111;background:#fff}
.icon-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;color:var(--muted);white-space:nowrap}
.icon-btn[aria-pressed="true"]{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.progress{height:2px}
.progress i{display:block;height:100%;width:0;background:var(--primary);transition:width .25s linear}

/* ---------- pilihan proyek ---------- */
.projects{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pchip img{width:20px;height:20px;object-fit:contain;flex:none}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.pchip:hover{background:var(--soft);color:var(--ink)}
.pchip[aria-checked="true"]{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.tw{display:flex;align-items:center;gap:10px;min-width:0}
.tx{min-width:0}
.fthumb{flex:none;width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.ftype{display:inline-block;margin-inline-start:6px;padding:1px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;vertical-align:1px}
.qd{margin-inline-start:6px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.qd b{color:var(--ink);font-weight:600}

/* ---------- kartu ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:19px;letter-spacing:-.01em}
.count{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.status.err{color:var(--red)}
.live{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live.on{background:#22c55e;animation:ping 2s infinite}
.live.err{background:var(--red)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%,100%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.toolbar-left{display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.search{position:relative;flex:1 1 200px;max-width:320px;min-width:160px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:38px;padding:0;padding-inline:36px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.toolbar-right{margin-inline-start:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.field{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600}
.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.interval{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.interval input{width:68px;height:38px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{flex:none}
.btn.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 20px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--soft)}
.fchip{display:inline-flex;padding:2px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
.legend{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px}
.legend .dot{opacity:1!important;animation:none!important}

/* ---------- tabel ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
table.has-wp{min-width:1040px}
thead th{padding:10px 14px;text-align:start;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{transition:background .8s}
tr.row.is-new{background:var(--new-row)}
th.c-dot,td.c-dot{width:30px;padding-inline-end:0}
.num{text-align:end}
.c-title{width:24%;min-width:200px}
.c-user{width:17%;min-width:150px}
.c-wp{width:15%;min-width:150px}
table:not(.has-wp) .c-wp{display:none}
.wp{display:inline-flex;align-items:baseline;gap:5px;margin:0 5px 5px 0;padding:1px 9px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink);font-size:12px;line-height:1.6;white-space:nowrap;cursor:default}
a.wp{text-decoration:none}
a.wp:hover{border-color:var(--primary);color:var(--primary)}
.wp.more{color:var(--muted);cursor:pointer}
.wp-more{display:inline}
.wp-more>summary{list-style:none}
.wp-more>summary::-webkit-details-marker{display:none}
.wp-more:not([open])>a.wp,.wp-more:not([open])>span.wp{display:none}
.wp-none{color:var(--muted)}
.c-type{width:92px}
.c-size{width:120px}
.c-time{width:112px;white-space:nowrap}
.dot{display:block;width:9px;height:9px;border-radius:50%;background:var(--primary);transition:opacity .6s}
tr.row:not(.is-new) .dot{opacity:0}
tr.row.is-new .dot{animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pulse)}100%{box-shadow:0 0 0 9px transparent}}

.ttl{font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.ttl:hover{color:var(--primary);text-decoration:underline}
.sub{margin-top:2px;font-size:12px;color:var(--muted)}
.sub a{color:var(--muted);text-decoration:none}
.sub a:hover{color:var(--primary);text-decoration:underline}
.sep{margin:0 5px;opacity:.5}
.u{display:flex;align-items:center;gap:9px;min-width:0}
.av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.un{min-width:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.un a,.un span.n{font-weight:600;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un a:hover{color:var(--primary);text-decoration:underline}
.badge{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.new{color:var(--green);background:var(--green-soft);border-color:transparent}
.delta{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta::before{font-size:9px;margin-inline-end:6px;vertical-align:1px}
.delta.up{color:var(--green)}.delta.up::before{content:"▲"}
.delta.down{color:var(--red)}.delta.down::before{content:"▼"}
.delta.zero{color:var(--muted)}.delta.zero::before{content:"●"}
.cmt{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cmt:empty{display:none}
.tg{display:inline-block;margin:4px 0 0;margin-inline-end:5px;padding:1px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--muted);font-size:11px}
.c-time b{display:block;font-weight:600}
.c-time small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.skel{height:44px;margin:10px 20px;border-radius:10px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pg{min-width:34px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-weight:600;color:var(--ink)}
.pg:hover:not(:disabled){background:var(--soft)}
.pg[aria-current="page"],.pg[aria-current="page"]:hover{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.pg:disabled{opacity:.4;cursor:default}
.gap{color:var(--muted);padding:0 2px}
.note{margin:14px 4px 0;color:var(--muted);font-size:12.5px;text-align:center}

/* ---------- jendela pengguna aktif ---------- */
.head-right{display:flex;align-items:center;gap:12px;min-width:0}
.head-right .status{min-width:0}
.icon-btn.keep-link,a.icon-btn{text-decoration:none}
.icon-btn span.keep{display:inline!important}
a.icon-btn:hover{color:var(--ink);background:var(--soft)}
.modal{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(440px,calc(100vw - 24px));max-height:min(780px,calc(100dvh - 24px));box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal[open]{display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal::backdrop{background:rgba(8,12,20,.55)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.side-head{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-head h2{margin:0;font-size:17px;letter-spacing:-.01em}
.x-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted)}
.x-btn:hover{background:var(--soft);color:var(--ink)}
.modal .seg{display:flex}
.modal .seg button{flex:1;padding:7px 8px;font-size:13px}
.ulist{list-style:none;margin:0;padding:6px 8px;overflow-y:auto;flex:1 1 auto;min-height:0}
.urow{display:grid;grid-template-columns:18px 28px minmax(0,1fr) auto;align-items:center;gap:4px 9px;padding:8px;border-radius:10px}
.urow:hover{background:var(--soft)}
.urow .nm:hover{color:var(--primary);text-decoration:underline}
.urow .rk{color:var(--muted);font-size:12px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.urow .nm{text-decoration:none;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.urow .ct{font-weight:700;font-variant-numeric:tabular-nums}
.urow .ubar{grid-column:3 / 5;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.urow .ubar i{display:block;height:100%;border-radius:99px;background:var(--primary);opacity:.8}
.side-foot{border-top:1px solid var(--line);flex:none}
.side-foot .pager{justify-content:center;padding:10px 12px 0}
.side-foot .pager:empty{display:none}
.side-note{margin:0;padding:10px 16px 14px;color:var(--muted);font-size:12px}
.side-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.foot-l{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.perpage{height:32px;font-size:13px}
.wp-opt{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.wp-opt[hidden],.wp-sel[hidden]{display:none}
.wp-prog{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wp-prog.busy{color:var(--primary)}
.wp-prog[hidden]{display:none}
.wp-sel{height:38px;width:170px;flex:0 0 auto}
.wp-sel select{max-width:100%;text-overflow:ellipsis}
.wp-opt input{accent-color:var(--primary);margin:0;cursor:pointer}
.wp-opt:has(input:checked){color:var(--primary);background:var(--primary-soft);border-color:transparent}
.perpage span{white-space:nowrap}
@media (max-width:480px){
  .modal{margin:auto auto 0;width:100vw;max-width:100vw;border-radius:18px 18px 0 0;border-bottom:0}
  .modal[open]{animation:sheet .22s ease-out}
}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}

/* ---------- toast (bar bawah) ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);display:flex;align-items:center;gap:12px;padding:9px 10px 9px 16px;background:#111827;color:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100vw - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;border-radius:8px;padding:6px 12px;background:var(--primary);color:var(--on-primary);font-weight:600}

/* ---------- responsif ---------- */
@media (max-width:1100px){
  .c-title{width:28%}
  .legend{margin-inline-start:0}
}
@media (max-width:860px){
  .topbar-inner{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "chips chips"}
  .brand{grid-area:brand}
  .tools{grid-area:tools}
  .chips{grid-area:chips;justify-content:flex-start;overflow-x:auto}
  .icon-btn span{display:none}
  .icon-btn{padding:0 10px}
  .card-head,.toolbar,.filters,.card-foot{padding-inline:14px}
  .head-right{width:100%}
  .toolbar-left{flex-basis:100%}
  .wp-sel{flex:1 1 0;width:auto;min-width:0}
  .wp-sel select{width:100%}
  .search{max-width:none;flex-basis:100%}
  .toolbar-right{margin-inline-start:0;width:100%;justify-content:space-between}
  table,thead,tbody,tr,td{display:block;min-width:0}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tr.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"title type" "wp wp" "user time" "cmt size";gap:6px 12px;padding:12px 14px;padding-inline-start:32px;position:relative;border-bottom:1px solid var(--line)}
  tbody td{padding:0;border:0}
  td.c-dot{position:absolute;inset-inline-start:14px;top:18px;width:auto}
  .c-title{grid-area:title;width:auto;min-width:0}
  .c-user{grid-area:user;width:auto;min-width:0}
  .c-wp{grid-area:wp;width:auto;min-width:0}
  td.c-wp:not(:has(.wp)){display:none}
  table.has-wp{min-width:0}
  .c-type{grid-area:type;width:auto;justify-self:end}
  .c-size{grid-area:size;width:auto;text-align:end;align-self:start}
  .c-time{grid-area:time;width:auto;text-align:end}
  .c-cmt{grid-area:cmt;min-width:0}
}
@media (max-width:480px){
  .topbar-inner{grid-template-columns:auto minmax(0,1fr);padding-inline:10px}
  .brand span{display:none}
  .tools{min-width:0;gap:6px}
  .select-wrap select{text-overflow:ellipsis}
  .tools .select-wrap{min-width:0;flex:0 1 auto}
  .wrap{padding:10px}
  .lbl{display:none}
  .seg button{padding:6px 10px}
  .btn.primary span{display:none}
  .btn.primary{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--primary)"/><path d="M5 15h4l2.5-6 4 11 2.5-5H23" stroke="var(--on-primary)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Wikilacak</span>
    </div>

    <nav class="chips" role="tablist" aria-label="Jenis data">
      <button class="chip" role="tab" data-tab="changes" aria-selected="true">

async function fetchJson(url, signal) {
  const r = await fetch(url, { signal, headers:{ 'Api-User-Agent':'Wikilacak/1.0 (pelacak pribadi, file HTML lokal)' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();

function norm(x) {
  const user = x.userhidden ? t('hiddenU') : (x.user || t('unknownU'));
  const comment = x.commenthidden ? t('hiddenC') : cleanComment(x.comment || '');
  const tags = x.tags || [];
  return {

    user, hiddenUser:!!x.userhidden, anon:!!x.anon, temp:!!x.temp,

const byNewest = (a, b) => b.ts < a.ts ? -1 : b.ts > a.ts ? 1 : b.id - a.id;

async function fetchNewer(signal) {
  const base = store.items.length ? store.items[0].ms : Date.now() - 3600e3;
  const start = new Date(base - OVERLAP_MS).toISOString().replace(/\.\d+Z$/, 'Z');
  let out = [], cont = null, guard = 0;
  do {
    const j = await fetchJson(apiUrl({ rcdir:'newer', rcstart:start, ...(cont || {}) }), signal);
    out = out.concat(j.query.recentchanges);
    cont = j.continue || null;
  } while (cont && ++guard < 4);
  const seen = new Set();
  return out.map(norm).filter(x => !store.ids.has(x.id) && !seen.has(x.id) && seen.add(x.id));
}

/* ================= refresh ================= */
async function refresh(opts = {}) {
  clearTimeout(timer); nextAt = 0;
  if (ctl) ctl.abort();
  const c = new AbortController(); ctl = c;
  const my = ++seq;
  const to = setTimeout(() => c.abort(), 25000);
  loading = true; setBusy(true); updateStatus();
  try {
    const baseline = opts.baseline || !store || (Date.now() - lastOk > STALE_MS);
    if (baseline) {
      const j = await fetchJson(apiUrl(), c.signal);
      if (my !== seq) return;
      const items = j.query.recentchanges.map(norm);
      store = { items, ids:new Set(items.map(x => x.id)) };
    } else {
      const added = await fetchNewer(c.signal);
      if (my !== seq) return;
      if (added.length) {
        const until = Date.now() + NEW_MS;
        added.forEach(x => { x.newUntil = until; store.ids.add(x.id); });
        store.items = added.concat(store.items).sort(byNewest).slice(0, MAX_ITEMS);
        announce(added.length);
      }
    }
    error = null; lastOk = Date.now();
  } catch (e) {
    if (my !== seq) return;
    error = e.name === 'AbortError' ? t('eTimeout')
          : (e instanceof TypeError || /Failed to fetch|NetworkError/i.test(e.message || '')) ? t('eOffline')
          : (e.message || '?');
  } finally {
    clearTimeout(to);
    if (my === seq) { loading = false; setBusy(false); schedule(); render(); updateStatus(); }
  }
}
function schedule() {
  clearTimeout(timer); nextAt = 0;
  if (prefs.mode === 'off') return;
  const ms = prefs.mode === 'auto' ? AUTO_MS : prefs.interval * 1000;
  startedAt = Date.now(); nextAt = startedAt + ms;
  timer = setTimeout(() => refresh(), ms);
}
function resetData() {
  if (ctl) ctl.abort();
  seq++; store = null; error = null; page = 1; unseen = 0; wpFilter = ''; updateTitle();
  render(); refresh({ baseline:true });
}

let ac = null;
function audio() {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}
function note(c, at, f, d) {
  [[1, .32], [2.01, .08]].forEach(([mul, vol]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f * mul;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + .015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.connect(g).connect(c.destination);
    o.start(at); o.stop(at + d + .05);
  });
}
function playDing() {
  const c = audio();
  if (!c || c.state !== 'running') return false;
  const at = c.currentTime;
  note(c, at, 988, .9);        // ting
  note(c, at + .32, 740, 1.3); // tong
  return true;
}
const unlock = () => {
  if (!prefs.sound) return;
  const c = audio();
  if (c && c.state === 'running') { removeEventListener('pointerdown', unlock); removeEventListener('keydown', unlock); }
};
addEventListener('pointerdown', unlock, { passive:true });
addEventListener('keydown', unlock);

const FILE_KINDS = {
  jpg:'kPhoto', jpeg:'kPhoto', jpe:'kPhoto', jfif:'kPhoto',
  png:'kImage', gif:'kImage', webp:'kImage', bmp:'kImage', tif:'kImage', tiff:'kImage', xcf:'kImage', apng:'kImage',
  svg:'kVector',
  pdf:'kDoc', djvu:'kDoc',
  webm:'kVideo', ogv:'kVideo', mp4:'kVideo', mpg:'kVideo', mpeg:'kVideo',
  ogg:'kAudio', oga:'kAudio', opus:'kAudio', mp3:'kAudio', wav:'kAudio', flac:'kAudio', mid:'kAudio', midi:'kAudio',
  stl:'kModel'
};
const isFileRow = x => !!PROJECTS[prefs.project].files && x.ns === 6;
function fileInfo(x) {
  const name = x.title.replace(/^[^:]+:/, '');
  const m = name.match(/\.([A-Za-z0-9]+)$/);
  const ext = m ? m[1].toLowerCase() : '';
  return { name, ext, kind:FILE_KINDS[ext] || 'kFile' };
}

/* ---- Wikidata / Abstract Wikipedia: keterangan di sebelah nilai Q ---- */
const entCache = new Map();   // "bahasa|Q123" -> { l:label, d:deskripsi } atau null bila tidak ada
const entPending = new Set();
const entId = x => PROJECTS[prefs.project].entity ? ((x.title.match(/(?:^|:)([QP]\d+)$/) || [])[1] || '') : '';
let entTimer = null;
function ensureLabels(slice) {
  const lang = prefs.wiki;
  const ids = [...new Set(slice.map(entId).filter(id => id && !entCache.has(lang + '|' + id) && !entPending.has(lang + '|' + id)))];
  for (let i = 0; i < ids.length; i += 50) {
    const chunk = ids.slice(i, i + 50);
    chunk.forEach(id => entPending.add(lang + '|' + id));
    const p = new URLSearchParams({ action:'wbgetentities', format:'json', formatversion:'2', origin:'*', props:'labels|descriptions',
      languages:lang, languagefallback:'1', ids:chunk.join('|') });
    fetch(`https://www.wikidata.org/w/api.php?${p}`).then(r => r.json()).then(j => {
      chunk.forEach(id => {
        const e = j.entities && j.entities[id];
        entCache.set(lang + '|' + id, e && !e.missing ? { l:(e.labels && e.labels[lang] && e.labels[lang].value) || '', d:(e.descriptions && e.descriptions[lang] && e.descriptions[lang].value) || '' } : null);
      });
    }).catch(() => {}).finally(() => {
      chunk.forEach(id => entPending.delete(lang + '|' + id));
      clearTimeout(entTimer);
      entTimer = setTimeout(() => {
        if (store && lang === prefs.wiki) {
          store.items.forEach(x => {   // label ikut dicari lewat kotak pencarian
            const id = entId(x), c = id && entCache.get(lang + '|' + id);
            if (c && !x.labHay) { x.hay += ' ' + (c.l + ' ' + c.d).toLowerCase(); x.labHay = true; }
          });
          render();
        }
      }, 150);
    });
  }
}
/* ---- WikiProject ----
   Wikipedia dengan ekstensi PageAssessments (Inggris, Prancis, Arab): nama proyek, kelas, dan kepentingan langsung dari API.
   Wikipedia lain: nama proyek dibaca dari templat atau kategori banner di halaman pembicaraan; hanya bahasa di WP_TALK yang diaktifkan. */
const WP_MAX_CHIPS = 3;
const WP_PA_PAGE = {   // halaman proyek untuk wiki ber-PageAssessments (Project: = ruang nama proyek, berlaku di semua wiki)
  en:n => `Project:WikiProject ${n}`, fr:n => `Projet:${n}`, ar:n => `Project:مشروع ويكي ${n}`
};
const WP_TALK = {      // src: tpl = templat (ruang nama 10), cat = kategori; re mengambil nama proyek (grup 1), page/fb = tujuan tautan & cadangan
  id:{ src:'tpl', res:[/^[^:]+:ProyekWiki ([^/]+)$/], page:n => `Project:ProyekWiki ${n}`, skip:/shell|banner|meta/i },
  es:{ src:'cat', res:[/^[^:]+:Wikiproyecto:(.+)\/Artículos$/], page:n => `Wikiproyecto:${n}` },
  ko:{ src:'cat', res:[/^[^:]+:(.+) 프로젝트 문서$/], page:n => `위키프로젝트:${n}` },
  th:{ src:'tpl', res:[/^[^:]+:บทความ(.+)$/], page:n => `Project:โครงการวิกิ${n}`, skip:/ระดับ|ที่|\//  },
  zh:{ src:'tpl', res:[/^[^:]+:([^/]+)專題$/, /^[^:]+:WikiProject ([^/]+)$/], page:n => `WikiProject:${n}`, skip:/banner shell/i },
  ru:{ src:'cat', res:[/^[^:]+:Статьи проекта (.+)$/], page:n => `Проект:${n}`, skip:/(уровня|важности)$/ },   // varian "… уровня" / "… важности" dibuang, tinggal kategori dasar
  he:{ src:'cat', res:[/^[^:]+:ערכים שנכתבו במסגרת מיזם (.+)$/], page:n => [`Project:מיזם ${n}`, `Project:מיזמי ויקיפדיה/${n}`] },
  ta:{ src:'cat', res:[/^[^:]+:விக்கித்திட்டம் (.+) கட்டுரைகள்$/], page:n => `Project:விக்கித்திட்டம் ${n}` }
};
const wpTalk = () => prefs.project === 'wikipedia' ? WP_TALK[prefs.wiki] : null;
const wpSupport = new Map();  // host -> true | false | 'pending' (khusus wiki ber-PageAssessments)
const wpCache = new Map();    // "host|judul" -> [{n, c, i, href}] atau null bila tidak ada
const wpPending = new Set();
const wpLinks = new Map();    // "host|kandidat" -> judul resmi bila halamannya ada, '' bila tidak
const WP_PA = new Set(['en','fr','ar']);   // wiki ber-PageAssessments yang ada datanya
const wpSupported = () => prefs.project === 'wikipedia' && (!!WP_TALK[prefs.wiki] || WP_PA.has(prefs.wiki));
const wpOn = () => prefs.wp && wpSupported() && (!!WP_TALK[prefs.wiki] || wpSupport.get(host()) === true);
let wpTimer = null, wpBusy = 0;
const wpWaiters = [];
const wpSlot = async () => { if (wpBusy >= 3) await new Promise(r => wpWaiters.push(r)); wpBusy++; };
const wpFree = () => { wpBusy--; const r = wpWaiters.shift(); if (r) r(); };
const wpRender = h => { clearTimeout(wpTimer); wpTimer = setTimeout(() => { if (store && h === host()) render(); }, 150); };
const wpApi = async (h, params) => {   // POST: judul beraksara Tamil/Ibrani/Thai membuat URL GET terlalu panjang (HTTP 414)
  const r = await fetch(`https://${h}/w/api.php?origin=*`, { method:'POST', body:new URLSearchParams({ action:'query', format:'json', formatversion:'2', ...params }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
};
/* ikuti kelanjutan sampai 6 kali; templat bisa ratusan per halaman pembicaraan */
async function wpPages(h, params) {
  const pages = [], norm = new Map();
  let cont = {};
  for (let n = 0; n < 6; n++) {
    const j = await wpApi(h, { ...params, ...cont });
    (j.query && j.query.normalized || []).forEach(e => norm.set(e.from, e.to));
    pages.push(...((j.query && j.query.pages) || []));
    if (!j.continue) break;
    cont = j.continue;
  }
  return { pages, norm };
}
/* tautan hanya dipasang bila halaman tujuannya ada; kalau tidak, pakai cadangan */
async function wpResolveLinks(h, entries) {
  const want = [...new Set(entries.flatMap(e => e.cand).filter(c => !wpLinks.has(h + '|' + c)))];
  for (let i = 0; i < want.length; i += 50) {
    const chunk = want.slice(i, i + 50);
    const { pages, norm } = await wpPages(h, { titles:chunk.join('|') });
    const exists = new Map(pages.map(pg => [pg.title, !pg.missing && !pg.invalid]));
    chunk.forEach(c => { const to = norm.get(c) || c; wpLinks.set(h + '|' + c, exists.get(to) ? to : ''); });
  }
  entries.forEach(e => { const c = e.cand.find(c => wpLinks.get(h + '|' + c)); e.href = c ? wpLinks.get(h + '|' + c) : ''; delete e.cand; });
}
async function wpFetchChunk(h, chunk, cfg) {
  const out = new Map(chunk.map(x => [x.title, []]));
  if (!cfg) {   // PageAssessments
    const { pages } = await wpPages(h, { prop:'pageassessments', palimit:'max', titles:chunk.map(x => x.title).join('|') });
    for (const pg of pages) {
      const a = pg.pageassessments;
      if (!a || !out.has(pg.title)) continue;
      for (const k in a) if (!/^project-independent assessment$/i.test(k)) {
        const f = WP_PA_PAGE[prefs.wiki];
        out.get(pg.title).push({ n:k, c:a[k].class || '', i:a[k].importance || '', cand:f ? [f(k)] : [] });
      }
    }
  } else {      // banner di halaman pembicaraan (awalan "Talk:" berlaku di semua wiki)
    const { pages, norm } = await wpPages(h, cfg.src === 'tpl'
      ? { prop:'templates', tllimit:'max', tlnamespace:'10', titles:chunk.map(x => 'Talk:' + x.title).join('|') }
      : { prop:'categories', cllimit:'max', titles:chunk.map(x => 'Talk:' + x.title).join('|') });
    const byTalk = new Map(pages.map(pg => [pg.title, pg]));
    for (const x of chunk) {
      const pg = byTalk.get(norm.get('Talk:' + x.title) || 'Talk:' + x.title);
      const names = ((pg && (pg.templates || pg.categories)) || []).map(o => o.title);
      const seen = new Set();
      for (const ti of names) for (const re of cfg.res) {
        const m = ti.match(re);
        if (!m || (cfg.skip && cfg.skip.test(m[1])) || seen.has(m[1])) continue;
        seen.add(m[1]);
        out.get(x.title).push({ n:m[1], c:'', i:'', cand:[].concat(cfg.page(m[1]), ti) });
      }
    }
  }
  await wpResolveLinks(h, [...out.values()].flat());
  return out;
}
function ensureWp(slice) {
  if (!prefs.wp || !wpSupported()) return;
  const h = host(), cfg = wpTalk(), st = wpSupport.get(h);
  if (!cfg) {
    if (st === undefined) {
      wpSupport.set(h, 'pending');
      wpApi(h, { meta:'siteinfo', siprop:'extensions' }).then(j => wpSupport.set(h, j.query.extensions.some(e => e.name === 'PageAssessments')))
        .catch(() => wpSupport.delete(h)).finally(() => wpRender(h));
      return;
    }
    if (st !== true) return;
  }
  const rows = [], seen = new Set();
  for (const x of slice) {
    const k = h + '|' + x.title;
    if (seen.has(k) || wpCache.has(k) || wpPending.has(k)) continue;
    seen.add(k);
    if (cfg && x.ns !== 0) { wpCache.set(k, null); continue; }   // banner hanya ada di halaman pembicaraan artikel
    rows.push({ title:x.title });
  }
  const size = cfg && cfg.src === 'tpl' ? 10 : 50;
  for (let i = 0; i < rows.length; i += size) {
    const chunk = rows.slice(i, i + size);
    chunk.forEach(x => wpPending.add(h + '|' + x.title));
    (async () => {
      await wpSlot();
      try { (await wpFetchChunk(h, chunk, cfg)).forEach((v, ti) => wpCache.set(h + '|' + ti, v.length ? v : null)); }
      catch {} finally { wpFree(); }
    })().finally(() => { chunk.forEach(x => wpPending.delete(h + '|' + x.title)); wpRender(h); });
  }
}
let wpSelSig = '';
function renderWpSel() {
  const on = wpOn(); $('wpSelWrap').hidden = !on; $('wpProg').hidden = !on;
  if (!on) { wpSelSig = ''; return; }
  const h = host(), cnt = new Map();
  let done = 0;
  for (const x of store.items) if (wpCache.has(h + '|' + x.title)) done++;
  $('wpProg').textContent = fmt(done) + '/' + fmt(store.items.length);
  $('wpProg').classList.toggle('busy', done < store.items.length);
  for (const x of store.items) for (const a of new Set((wpCache.get(h + '|' + x.title) || []).map(a => a.n))) cnt.set(a, (cnt.get(a) || 0) + 1);
  if (wpFilter && !cnt.has(wpFilter)) cnt.set(wpFilter, 0);
  const names = [...cnt].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], prefs.wiki));
  const sig = prefs.wiki + '|' + wpFilter + '|' + names.map(n => n.join(':')).join('|');
  if (sig === wpSelSig) return;
  wpSelSig = sig;
  $('wpSel').innerHTML = `<option value="">${esc(t('thWp'))}</option>` + names.map(([n, c]) => `<option value="${esc(n)}">${esc(n)} (${fmt(c)})</option>`).join('');
  $('wpSel').value = wpFilter;
}
function wpHtml(x) {
  if (!wpOn()) return '';
  const c = wpCache.get(host() + '|' + x.title);
  if (c === undefined) return '<span class="wp-none">…</span>';
  if (!c) return '<span class="wp-none">–</span>';
  const tip = a => a.n;
  const chip = a => {
    const inner = `${esc(a.n)}`;
    return a.href
      ? `<a class="wp" href="${esc('https://' + host() + wikiPath(a.href))}" target="_blank" rel="noopener noreferrer" title="${esc(tip(a))}">${inner}</a>`
      : `<span class="wp" title="${esc(tip(a))}">${inner}</span>`;
  };
  const rest = c.slice(WP_MAX_CHIPS);
  return c.slice(0, WP_MAX_CHIPS).map(chip).join('') + (rest.length ? `<details class="wp-more"><summary class="wp more" title="${esc(rest.map(tip).join('\n'))}">+${rest.length}</summary>${rest.map(chip).join('')}</details>` : '');
}

function entHtml(x) {
  const id = entId(x), c = id && entCache.get(prefs.wiki + '|' + id);
  if (!c || (!c.l && !c.d)) return '';
  return ` <span class="qd">${c.l ? `<b>${esc(c.l)}</b>` : ''}${c.l && c.d ? ' · ' : ''}${esc(c.d)}</span>`;
}

function rowHtml(x, now) {
  const h = 'https://' + host();
  const pageUrl = h + wikiPath(x.title);
  const hist = `${h}/w/index.php?title=${encodeURIComponent(x.title.replace(/ /g,'_'))}&action=history`;
  const diff = x.type === 'edit' && x.old ? `${h}/w/index.php?diff=${x.revid}&oldid=${x.old}` : '';
  const ext = 'target="_blank" rel="noopener noreferrer"';
  const sub = [diff && `<a href="${esc(diff)}" ${ext}>${esc(t('diff'))}</a>`, `<a href="${esc(hist)}" ${ext}>${esc(t('hist'))}</a>`]
    .filter(Boolean).join('<span class="sep">·</span>');

  const initial = (x.anon || x.temp || x.hiddenUser) ? '?' : ([...x.user][0] || '?').toUpperCase();
  const uname = encodeURIComponent(x.user.replace(/ /g,'_'));
  const contribUrl = `${h}/wiki/Special:Contributions/${uname}`;
  const talkUrl = `${h}/wiki/User_talk:${uname}`;
  const userUrl = x.anon ? contribUrl : `${h}/wiki/User:${uname}`;
  const userEl = x.hiddenUser
    ? `<span class="n">${esc(x.user)}</span>`
    : `<a href="${esc(userUrl)}" ${ext}>${esc(x.user)}</a>`;
  const userSub = x.hiddenUser ? '' : `<div class="sub"><a href="${esc(talkUrl)}" ${ext}>${esc(t('talk'))}</a><span class="sep">·</span><a href="${esc(contribUrl)}" ${ext}>${esc(t('contribs'))}</a></div>`;
  const badge = x.anon ? `<span class="badge">${esc(t('anon'))}</span>` : x.temp ? `<span class="badge">${esc(t('temp'))}</span>` : '';

  const tg = [];
  if (x.minor) tg.push([t('minor'), t('minorT')]);
  if (x.redirect) tg.push([t('redir'), t('redirT')]);
  x.tags.forEach(n => tg.push([tagLabel(n), n]));
  const tagHtml = tg.map(([l, title]) => `<span class="tg" title="${esc(title)}">${esc(l)}</span>`).join('');

  const cls = x.size > 0 ? 'up' : x.size < 0 ? 'down' : 'zero';
  const sizeTxt = (x.size > 0 ? '+' : x.size < 0 ? '−' : '') + fmt(Math.abs(x.size));
  const isNew = x.newUntil > now;
  const pill = x.type === 'new'
    ? `<span class="pill new"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>${esc(t('tNew'))}</span>`
    : `<span class="pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>${esc(t('tEdit'))}</span>`;

  return `<tr class="row${isNew ? ' is-new' : ''}" data-until="${x.newUntil}">
    <td class="c-dot"><i class="dot"></i></td>
    <td class="c-title">${titleCell(x, pageUrl, ext, sub)}</td>
    <td class="c-wp">${wpHtml(x)}</td>
    <td class="c-user"><div class="u"><span class="av" style="background:hsl(${hue(x.user)} 52% 46%)">${esc(initial)}</span><div class="un">${userEl}${userSub}${badge}</div></div></td>
    <td class="c-type">${pill}</td>
    <td class="c-size num"><span class="delta ${cls}" dir="ltr">${sizeTxt}</span></td>
    <td class="c-cmt"><div class="cmt">${esc(x.comment)}</div>${tagHtml}</td>
    <td class="c-time"><b data-ts="${x.ms}">${esc(rel(x.ms))}</b><small>${esc(absTime(x.ms))}</small></td>
  </tr>`;
}

function titleCell(x, pageUrl, ext, sub) {
  const link = `<a class="ttl" href="${esc(pageUrl)}" ${ext}>${esc(x.title)}</a>`;
  if (isFileRow(x)) {
    const f = fileInfo(x);
    const thumb = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(f.name)}?width=96`;
    const type = f.ext ? `<span class="ftype" dir="ltr" title="${esc(f.ext.toUpperCase())}">${esc(f.ext.toUpperCase())} (${esc(t(f.kind))})</span>` : '';
    return `<div class="tw"><img class="fthumb" src="${esc(thumb)}" alt="" loading="lazy" decoding="async">`
      + `<div class="tx">${link}${type}<div class="sub">${sub}</div></div></div>`;
  }
  return `${link}${entHtml(x)}<div class="sub">${sub}</div>`;
}

function pagerHtml(pages, cur = page) {
  if (pages <= 1) return '';
  const [P, N] = isRtl() ? ['›', '‹'] : ['‹', '›'];
  const nums = [...new Set([1, pages, cur - 1, cur, cur + 1])].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  let out = `<button class="pg" data-page="${cur - 1}" ${cur <= 1 ? 'disabled' : ''} aria-label="${esc(t('prev'))}">${P}</button>`;
  let prev = 0;
  for (const n of nums) {
    if (n - prev > 1) out += '<span class="gap">…</span>';
    out += `<button class="pg" data-page="${n}" ${n === cur ? 'aria-current="page"' : ''}>${esc(fmt(n))}</button>`;
    prev = n;
  }
  return out + `<button class="pg" data-page="${cur + 1}" ${cur >= pages ? 'disabled' : ''} aria-label="${esc(t('next'))}">${N}</button>`;
}

function render() {
  const tab = TABS[prefs.tab];
  $('title').textContent = t(tab.title);
  $('filterChips').innerHTML = tabFilters().map(f => `<span class="fchip">${esc(t(f))}</span>`).join(' ');
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-selected', String(c.dataset.tab === prefs.tab)));

  if (!store) {
    $('count').textContent = '–';
    wpSelSig = ''; $('wpSelWrap').hidden = true; $('wpProg').hidden = true;
    $('wpSel').innerHTML = `<option value="">${esc(t('thWp'))}</option>`;
    $('rows').innerHTML = error
      ? emptyHtml(t('emptyFail'), t('emptyFailHint', { e:error }))
      : '<tr><td colspan="8">' + '<div class="skel"></div>'.repeat(7) + '</td></tr>';
    $('range').textContent = ''; $('pager').innerHTML = '';
    renderUsers(Date.now());
    syncUrl();
    return;
  }
  const now = Date.now();
  const list = filtered(), total = list.length;
  const pages = Math.max(1, Math.ceil(total / prefs.perPage));
  page = Math.min(Math.max(1, page), pages);
  const from = (page - 1) * prefs.perPage;
  const slice = list.slice(from, from + prefs.perPage);

  $('count').textContent = fmt(store.items.length);
  ensureLabels(slice);
  ensureWp(slice);
  if (wpOn()) ensureWp(store.items);   // seluruh daftar, agar dropdown memuat semua WikiProject yang terdeteksi
  renderWpSel();
  $('tbl').classList.toggle('has-wp', wpOn());
  $('rows').innerHTML = slice.length
    ? slice.map(x => rowHtml(x, now)).join('')
    : ((query.trim() || wpFilter) ? emptyHtml(t('noRes'), t('noResHint', { q:query.trim() || wpFilter })) : emptyHtml(t('noEnt'), t('noEntHint')));
  $('range').textContent = total
    ? t('showing', { a:fmt(from + 1), b:fmt(from + slice.length), n:fmt(total) }) + ((query.trim() || wpFilter) ? ' ' + t('filteredFrom', { m:fmt(store.items.length) }) : '')
    : t('zero');
  $('pager').innerHTML = pagerHtml(pages);
  renderUsers(now);
  syncUrl();
}

/* ================= panel suntingan terbanyak (dari 500 data terbaru, maksimal 50 pengguna) ================= */
function topUsers() {
  if (!store) return { list: [], sample: 0 };
  const sample = store.items.slice(0, USERS_SAMPLE);
  const map = new Map();
  for (const x of sample) {
    if (x.hiddenUser) continue;
    let u = map.get(x.user);
    if (!u) map.set(x.user, u = { user:x.user, n:0, last:x.ms, anon:x.anon, temp:x.temp });
    u.n++; if (x.ms > u.last) u.last = x.ms;
  }
  const list = [...map.values()].filter(u => u.n >= USERS_MIN)
    .sort((a, b) => b.n - a.n || b.last - a.last || (a.user < b.user ? -1 : 1)).slice(0, USERS_ROWS);
  return { list, sample: sample.length };
}
let usersSig = '', upage = 1;
function renderUsers() {
  if (!$('usersDlg').open) return;
  const { list, sample } = topUsers();
  const h = 'https://' + host();
  const max = list.length ? list[0].n : 1;
  const upages = Math.max(1, Math.ceil(list.length / USERS_PER_PAGE));
  upage = clamp(upage, 1, upages);
  syncUrl();
  const off = (upage - 1) * USERS_PER_PAGE;
  const html = !store ? '' : list.length ? list.slice(off, off + USERS_PER_PAGE).map((u, j) => {
    const i = off + j;
    const uname = encodeURIComponent(u.user.replace(/ /g, '_'));
    const url = `${h}/wiki/User_talk:${uname}`;
    const initial = (u.anon || u.temp) ? '?' : ([...u.user][0] || '?').toUpperCase();
    return `<li class="urow"><span class="rk">${esc(fmt(i + 1))}</span><span class="av" style="background:hsl(${hue(u.user)} 52% 46%)">${esc(initial)}</span>`
      + `<a class="nm" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(u.user)}">${esc(u.user)}</a>`
      + `<span class="ct" title="${esc(t('usersEntries', { n:fmt(u.n) }))}">${esc(fmt(u.n))}</span>`
      + `<span class="ubar" aria-hidden="true"><i style="width:${Math.max(6, Math.round(u.n / max * 100))}%"></i></span></li>`;
  }).join('') : '';
  const empty = store && !list.length ? `<div class="side-empty">${esc(t('usersEmpty'))}</div>` : '';
  const note = store ? t('usersBasis', { n:fmt(sample) }) : '';
  const sig = prefs.project + '|' + prefs.wiki + '|' + upage + '|' + html + empty + note;
  if (sig === usersSig) return;
  usersSig = sig;
  $('ulist').innerHTML = html + empty;
  $('upager').innerHTML = pagerHtml(upages, upage);
  $('ulist').scrollTop = 0;
  $('usersNote').textContent = note;
}

function updateStatus(now = Date.now()) {
  const left = nextAt ? Math.max(0, Math.ceil((nextAt - now) / 1000)) : 0;
  let text = '';
  if (!store && loading) text = t('loading');
  else if (error) text = t('failed', { e:error }) + (nextAt ? ' · ' + t('retry', { t:secs(left) }) : '');
  else if (loading) text = t('refreshing');
  else if (store) text = t('updated', { t:clock(lastOk) }) + ' · ' + (prefs.mode === 'off' ? t('autoOff') : t('nextIn', { t:secs(left) }));
  if ($('statusTxt').textContent !== text) $('statusTxt').textContent = text;
  $('status').classList.toggle('err', !!error);
  $('live').className = 'live' + (error ? ' err' : prefs.mode !== 'off' ? ' on' : '');
  const pct = (!nextAt || loading || prefs.mode === 'off') ? 0 : Math.min(100, (now - startedAt) / (nextAt - startedAt) * 100);
  $('bar').style.width = pct + '%';
}
const setBusy = b => $('refreshBtn').classList.toggle('busy', b);

/* ================= kontrol & teks antarmuka ================= */
const BELL = '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>';
function applyTheme() {
  const r = document.documentElement;
  if (prefs.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', prefs.theme);
}
function applyI18n() {
  const de = document.documentElement;
  de.lang = prefs.wiki; de.dir = isRtl() ? 'rtl' : 'ltr';
  const v = { t:secs(AUTO_MS / 1000) };
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n, v); });
  document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = t(e.dataset.i18nTitle, v); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria, v)); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh, v); });
  $('legendTxt').textContent = t('legend', { t:secs(NEW_MS / 1000) });
  $('perPage').innerHTML = PER_PAGE_OPTIONS.map(n => `<option value="${n}">${esc(fmt(n))}</option>`).join('');
  $('theme').innerHTML = [['system','themeSystem'],['light','themeLight'],['dark','themeDark']].map(([v, k]) => `<option value="${v}">${esc(t(k))}</option>`).join('');
}
const TRANSLATE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>';
function syncLangLabel() {
  const wp = prefs.project === 'wikipedia', txt = t(wp ? 'langEdition' : 'langUi');
  const wrap = $('wiki').closest('label');
  wrap.title = txt; $('wiki').setAttribute('aria-label', txt);
  const mark = wrap.querySelector('.wmark');
  if (wp) { mark.textContent = 'W'; mark.classList.remove('ico'); } else { mark.innerHTML = TRANSLATE_ICON; mark.classList.add('ico'); }
}
function syncControls() {
  $('wiki').value = prefs.wiki;
  syncLangLabel();
  document.querySelectorAll('#projects button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.project === prefs.project)));
  $('theme').value = prefs.theme;
  $('perPage').value = String(prefs.perPage);
  $('interval').value = prefs.interval;
  $('secWord').textContent = secWord(prefs.interval);
  $('intervalWrap').hidden = prefs.mode !== 'interval';
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === prefs.mode)));
  $('wpOpt').hidden = !wpSupported();
  $('wpChk').checked = !!prefs.wp;
  $('wpOptTxt').textContent = t('thWp');
  $('soundBtn').setAttribute('aria-pressed', String(prefs.sound));
  $('soundTxt').textContent = prefs.sound ? t('soundOn') : t('soundOff');
  $('soundIcon').innerHTML = BELL + (prefs.sound ? '' : '<path d="M2 2l20 20"/>');
}

$('wiki').innerHTML = Object.entries(LANGS).map(([code, l]) => `<option value="${code}" lang="${code}">${esc(l.name)}</option>`).join('');

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  if (c.dataset.tab === prefs.tab) return;
  prefs.tab = c.dataset.tab; savePrefs(); resetData();
}));
document.querySelectorAll('#projects button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.project === prefs.project) return;
  prefs.project = b.dataset.project; savePrefs(); query = ''; $('q').value = '';
  syncControls(); resetData(); loadTagNames();
}));
// thumbnail Commons yang gagal dimuat (mis. audio, berkas dihapus) disembunyikan
$('rows').addEventListener('error', e => { if (e.target.classList && e.target.classList.contains('fthumb')) e.target.style.visibility = 'hidden'; }, true);
$('perPage').addEventListener('change', e => { prefs.perPage = +e.target.value; savePrefs(); page = 1; render(); });
const dlg = $('usersDlg');
function openUsers(p) {
  usersSig = ''; upage = p > 1 ? p : 1;
  if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  renderUsers(); $('usersBtn').setAttribute('aria-expanded', 'true');
}
function closeUsers() {
  if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
  $('usersBtn').setAttribute('aria-expanded', 'false');
}
$('usersBtn').addEventListener('click', () => openUsers());
$('usersClose').addEventListener('click', closeUsers);
dlg.addEventListener('click', e => { if (e.target === dlg) closeUsers(); });
$('upager').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]');
  if (!b || b.disabled) return;
  upage = +b.dataset.page; renderUsers();
});
dlg.addEventListener('close', () => { $('usersBtn').setAttribute('aria-expanded', 'false'); syncUrl(); });
$('theme').addEventListener('change', e => { prefs.theme = e.target.value; savePrefs(); applyTheme(); });
$('wiki').addEventListener('change', e => {
  prefs.wiki = e.target.value; savePrefs();
  setLocale(); applyI18n(); syncControls();
  resetData(); loadTagNames();
});

$('wpChk').addEventListener('change', e => { prefs.wp = e.target.checked; if (!prefs.wp) wpFilter = ''; savePrefs(); page = 1; render(); });
$('wpSel').addEventListener('change', e => { wpFilter = e.target.value; page = 1; wpSelSig = ''; render(); });
$('soundBtn').addEventListener('click', () => {
  prefs.sound = !prefs.sound; savePrefs(); syncControls();
  if (prefs.sound) { const c = audio(); if (c) c.resume().then(playDing).catch(() => {}); }
});

document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => {
  prefs.mode = b.dataset.mode; savePrefs(); syncControls();
  if (!loading) schedule();
  updateStatus();
}));
function applyInterval() {
  prefs.interval = clamp(parseInt($('interval').value, 10) || prefs.interval, MIN_INTERVAL, MAX_INTERVAL);
  $('interval').value = prefs.interval; $('secWord').textContent = secWord(prefs.interval); savePrefs();
  if (prefs.mode === 'interval' && !loading) schedule();
}
let ivTimer;
$('interval').addEventListener('change', applyInterval);
$('interval').addEventListener('input', () => { clearTimeout(ivTimer); ivTimer = setTimeout(applyInterval, 700); });
$('refreshBtn').addEventListener('click', () => refresh());

let qTimer;
$('q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = e.target.value; page = 1; render(); }, 120);
});
$('pager').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]');
  if (!b || b.disabled) return;
  page = +b.dataset.page; render(); scrollTo({ top:0 });
});
$('toastBtn').addEventListener('click', () => {
  page = 1; render(); scrollTo({ top:0, behavior:'smooth' }); $('toast').classList.remove('show');
});

/* ================= ticker: dot 10 detik, waktu relatif, hitung mundur ================= */
let tickN = 0;
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('tr.is-new').forEach(tr => { if (+tr.dataset.until <= now) tr.classList.remove('is-new'); });
  if (++tickN % 4 === 0) document.querySelectorAll('[data-ts]').forEach(b => { b.textContent = rel(+b.dataset.ts); });
  if (tickN % 20 === 0) renderUsers(now);
  updateStatus(now);
}, 250);

/* ================= URL Query =================
   project (wikipedia|commons|wikidata|abstract), tab (changes|newpages), refresh (auto|interval|off) + interval (detik),
   lang (bahasa Wikipedia/antarmuka), sound (1|0), wp=1 (kolom WikiProyek), page, perpage (20|50|100|250|500), users=1 (buka Suntingan terbanyak) + upage.
   Parameter yang ada menimpa setelan tersimpan; setiap perubahan kontrol memperbarui URL. */
function syncUrl() {
  const p = new URLSearchParams();
  p.set('project', prefs.project); p.set('tab', prefs.tab); p.set('refresh', prefs.mode);
  if (prefs.mode === 'interval') p.set('interval', String(prefs.interval));
  p.set('lang', prefs.wiki); p.set('sound', prefs.sound ? '1' : '0');
  if (prefs.wp) p.set('wp', '1');
  if (page > 1) p.set('page', String(page));
  if (prefs.perPage !== 20) p.set('perpage', String(prefs.perPage));
  if ($('usersDlg').open) { p.set('users', '1'); if (upage > 1) p.set('upage', String(upage)); }
  const url = location.pathname + '?' + p.toString() + location.hash;
  if (url === lastUrl) return;
  lastUrl = url;
  try { history.replaceState(null, '', url); } catch {}
}
function readUrl() {
  const p = new URLSearchParams(location.search);
  if (PROJECTS[p.get('project')]) prefs.project = p.get('project');
  if (TABS[p.get('tab')]) prefs.tab = p.get('tab');
  const rf = p.get('refresh');
  if (['auto','interval','off'].includes(rf)) prefs.mode = rf;
  if (p.has('interval')) {
    prefs.interval = clamp(parseInt(p.get('interval'), 10) || prefs.interval, MIN_INTERVAL, MAX_INTERVAL);
    if (!rf) prefs.mode = 'interval';
  }
  if (LANGS[p.get('lang')]) prefs.wiki = p.get('lang');
  if (p.has('sound')) prefs.sound = ['1','true','on','yes'].includes(p.get('sound').toLowerCase());
  if (p.has('wp')) prefs.wp = ['1','true','on','yes'].includes(p.get('wp').toLowerCase());
  const pp = parseInt(p.get('perpage'), 10);
  if (PER_PAGE_OPTIONS.includes(pp)) prefs.perPage = pp;
  const pg = parseInt(p.get('page'), 10);
  if (pg >= 1) page = pg;
  return { users: p.get('users') === '1', upage: parseInt(p.get('upage'), 10) || 1 };
}

/* ================= mulai ================= */
const fromUrl = readUrl();
setLocale();
applyTheme();
applyI18n();
syncControls();
render();
refresh({ baseline:true });
loadTagNames();
if (fromUrl.users) openUsers(fromUrl.upage);
syncUrl();
})();
</script>
