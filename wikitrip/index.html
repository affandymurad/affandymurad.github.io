<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikitrip — Trip Planner · Wikivoyage + Wikidata</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#f3f6fc; --surface:#fff; --ink:#0c1a36; --muted:#526080; --line:#dde4f1; --brand:#2d4f9c; --brand-2:#5278d0; --soft:#eaeff9;
  --zebra:#f6f8fd; --ok:#198754; --danger:#c62f3d; --warn-bg:#fff3e0; --warn-ink:#92400e; --accent:#ff7a1a;
  --radius:18px; --shadow:0 1px 2px rgba(12,26,54,.04),0 10px 28px rgba(33,58,122,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080f20; --surface:#0f1a33; --ink:#e8eefc; --muted:#9aaccc; --line:#213056; --brand:#7c9cf0; --brand-2:#5278d0; --soft:#15244a;
  --zebra:#12203f; --ok:#4ac26b; --danger:#ff7b72; --warn-bg:#33270f; --warn-ink:#f6c27a; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:16px 0 10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff}
.brand h1{margin:0;font-size:21px;line-height:1.1}.brand small{color:var(--muted);display:block;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
label.f{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
@media (prefers-color-scheme:dark){.btn.pri{color:#0b1530}}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 0}
.err{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13.5px}

/* tombol penulis: portofolio + Meta-Wiki, satu kelompok */
.me{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.me a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;color:var(--ink);text-decoration:none;font-weight:600;white-space:nowrap}
.me a+a{border-inline-start:1px solid var(--line);color:var(--muted);padding-inline:11px}
.me a:hover{background:var(--soft);color:var(--brand)}
.me a:focus-visible{outline:2px solid var(--brand-2);outline-offset:-2px}
.me svg{flex:none}
@media (max-width:520px){.me a{padding:7px 10px;font-size:13.5px}}

/* language slide switch */
.lang{display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.lang input{position:absolute;opacity:0;width:0;height:0}
.lang .track{position:relative;display:grid;grid-template-columns:1fr 1fr;width:92px;height:36px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:13px;text-align:center;line-height:34px}
.lang .track span{position:relative;z-index:1;transition:color .2s}
.lang .knob{position:absolute;top:2px;left:2px;width:44px;height:30px;border-radius:999px;background:var(--brand);transition:transform .22s ease;z-index:0}
.lang input:checked ~ .track .knob{transform:translateX(42px)}
.lang .track .a{color:#fff}.lang .track .b{color:var(--muted)}
.lang input:checked ~ .track .a{color:var(--muted)}.lang input:checked ~ .track .b{color:#fff}
@media (prefers-color-scheme:dark){.lang .track .a{color:#0b1530}.lang input:checked ~ .track .b{color:#0b1530}}
.lang input:focus-visible ~ .track{outline:2px solid var(--brand-2);outline-offset:2px}

/* toggle switch (road) */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.sw input{position:absolute;opacity:0}
.sw i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked + i{background:var(--brand)}.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--brand-2);outline-offset:2px}

/* guide */
.guide{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0}
@media (prefers-color-scheme:dark){.guide{color:#0b1530}}
.guide h2{margin:0 0 4px;font-size:18px}.guide p{margin:0;opacity:.92}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.step b{display:flex;align-items:center;gap:8px}.step .n{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:13px;flex:none}
.step span.d{display:block;font-size:13.5px;margin-top:4px;opacity:.95}
.guide ul{margin:6px 0 0;padding-inline-start:20px;font-size:13.5px}
.guide details summary{cursor:pointer;font-weight:700;margin-top:4px}
.guide .btn{background:#fff;color:var(--brand);border-color:#fff}

/* search */
.sbox{position:relative}
.add{display:flex;gap:8px}.add input{flex:1;padding:11px 14px;font-size:16px;border-radius:12px}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:50;max-height:340px;overflow:auto}
.ac button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 14px;cursor:pointer}
.ac button:last-child{border-bottom:0}.ac button:hover,.ac button.on{background:var(--soft)}
.ac b{display:block}.ac small{color:var(--muted)}.ac .src{float:inline-end;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip:hover{background:var(--surface);border-color:var(--brand-2)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0b1530}}.chip[disabled]{opacity:.5}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:60;min-width:210px}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}.menu p{margin:4px 12px 6px;color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper .btn{padding:4px 10px}.stepper output{min-width:26px;text-align:center;font-weight:700}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
#map{height:460px;border-radius:var(--radius);border:1px solid var(--line);position:sticky;top:12px;overflow:hidden}
@media (min-width:640px){#map{height:500px}}
@media (min-width:1100px){#map{height:620px}}
@media (max-width:900px){#map{position:relative;order:-1}}
.lbtn{font:700 12px/29px Arial,sans-serif;color:#333}.lbtn.on{background:#2d4f9c!important;color:#fff}.lbtn+.lbtn{border-top:1px solid #ddd}
.empty{text-align:center;padding:26px 14px}.empty .big{font-size:38px}.empty h3{margin:6px 0 4px}.empty p{margin:0;color:var(--muted)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.day>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 14px;border-inline-start:5px solid var(--c,#8a93a3);background:var(--soft);cursor:pointer}
.day h2{margin:0;font-size:15px}.day header span{color:var(--muted);font-size:13px}
ol.lst{list-style:none;margin:0;padding:6px;min-height:46px}
ol.lst:empty::before{content:attr(data-empty);display:block;color:var(--muted);font-size:13px;padding:12px 10px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
ol.lst.over{background:color-mix(in srgb,var(--brand-2) 10%,transparent)}
li.it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;padding:9px 8px;border-radius:12px;align-items:start}
li.it:nth-child(even){background:var(--zebra)}
li.it.drag{opacity:.4}li.it.hl{outline:2px solid var(--brand-2)}
.no{width:26px;height:26px;border-radius:50%;background:var(--c,#8a93a3);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;margin-top:1px;cursor:grab}
.ti{font-weight:650;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}.ti:hover{text-decoration:underline}
.sub{display:block;color:var(--muted);font-size:12.5px}
.nt{font-size:13.5px;white-space:pre-wrap;margin-top:3px;background:color-mix(in srgb,var(--brand-2) 8%,transparent);border-radius:8px;padding:4px 8px}
li.it textarea{width:100%;margin-top:4px;min-height:60px;resize:vertical}
.dist{grid-column:2/-1;color:var(--muted);font-size:12.5px;padding-top:2px}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acts select{padding:4px 6px;font-size:12.5px;max-width:112px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1}
.ib:hover{background:var(--soft)}.ib.x:hover{color:var(--danger)}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 12px/22px Arial;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:12px;font-size:14px;display:none;z-index:2000;max-width:92vw;align-items:center;gap:12px}
#msg.on{display:flex}#msg button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
.sg{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}.sg div{flex:1;min-width:0}.sg b{display:block;overflow-wrap:anywhere}.sg small{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px}
.maplibregl-map{font:inherit}
[hidden]{display:none!important}
.gh{margin:14px 0 6px;font-size:15px}
.gflow{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0;margin:6px 0}
.gflow li{counter-increment:s;position:relative;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px 10px 46px}
.gflow li::before{content:counter(s);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.gflow b{display:block}.gflow span{display:block;font-size:13.5px;margin-top:2px;opacity:.95}
.gfeat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.fc dl{margin:6px 0 0}.fc dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;opacity:.8;margin-top:8px}.fc dd{margin:2px 0 0;font-size:13.5px}
@media (max-width:900px){.gflow,.gfeat{grid-template-columns:1fr}}
.flow{padding:12px 16px}
.fsteps{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:0}
.fsteps li{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 6px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:12.5px;font-weight:600;color:var(--muted)}
.fsteps li span{width:20px;height:20px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11.5px}
.fsteps li.done{color:var(--ok)}.fsteps li.act{background:var(--brand);border-color:var(--brand);color:#fff}.fsteps li.act span{color:var(--brand)}
@media (prefers-color-scheme:dark){.fsteps li.act{color:#0b1530}.fsteps li.act span{color:#0b1530}}
#fhint{font-size:14px}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
    <div><h1>Wikitrip</h1><small data-i="tagline"></small></div>
  </div>
  <div class="me">
    <a href="https://affandymurad.github.io/" target="_blank" rel="noopener" data-it="meT" aria-label="Affandy Murad"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Affandy Murad</a>
    <a href="https://meta.wikimedia.org/wiki/User:Affandy_Murad" target="_blank" rel="noopener" data-it="metaT" aria-label="Meta-Wiki"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Meta</a>
  </div>
  <button class="btn" id="helpBtn">❓ <span data-i="howto"></span></button>
  <label class="lang" title="Bahasa / Language">
    <input type="checkbox" id="lang" role="switch" aria-label="Bahasa / Language">
    <span class="track"><span class="a">ID</span><span class="b">EN</span><i class="knob"></i></span>
  </label>
</header>

<!-- PANDUAN -->
<section class="card guide" id="guide" hidden>
  <div class="row"><h2 style="margin-inline-end:auto" data-i="gTitle"></h2><button class="btn sm" id="guideX" data-i="gotIt"></button></div>
  <p data-i="gSub"></p>
  <h3 class="gh" data-i="gFlowT"></h3>
  <ol class="gflow">
    <li><b data-i="f1t"></b><span data-i="f1d"></span></li>
    <li><b data-i="f2t"></b><span data-i="f2d"></span></li>
    <li><b data-i="f3t"></b><span data-i="f3d"></span></li>
    <li><b data-i="f4t"></b><span data-i="f4d"></span></li>
    <li><b data-i="f5t"></b><span data-i="f5d"></span></li>
    <li><b data-i="f6t"></b><span data-i="f6d"></span></li>
    <li><b data-i="f7t"></b><span data-i="f7d"></span></li>
  </ol>
  <h3 class="gh" data-i="gFeatT"></h3>
  <div class="gfeat">
    <div class="fc"><b data-i="c1t"></b><dl><dt data-i="lWhen"></dt><dd data-i="c1w"></dd><dt data-i="lHow"></dt><dd data-i="c1h"></dd><dt data-i="lNeed"></dt><dd data-i="c1n"></dd></dl></div>
    <div class="fc"><b data-i="c2t"></b><dl><dt data-i="lWhen"></dt><dd data-i="c2w"></dd><dt data-i="lHow"></dt><dd data-i="c2h"></dd><dt data-i="lNeed"></dt><dd data-i="c2n"></dd></dl></div>
    <div class="fc"><b data-i="c3t"></b><dl><dt data-i="lWhen"></dt><dd data-i="c3w"></dd><dt data-i="lHow"></dt><dd data-i="c3h"></dd><dt data-i="lNeed"></dt><dd data-i="c3n"></dd></dl></div>
  </div>
  <details>
    <summary data-i="tipsT"></summary>
    <ul>
      <li data-i="tip1"></li><li data-i="tip2"></li><li data-i="tip3"></li><li data-i="tip4"></li><li data-i="tip5"></li><li data-i="tip6"></li><li data-i="tip7"></li>
    </ul>
  </details>
</section>

<!-- CARI -->
<section class="card">
  <div class="sbox">
    <form class="add" id="addForm" autocomplete="off">
      <input type="text" id="addIn" data-ip="addPh" aria-label="Search" aria-autocomplete="list" autocomplete="off">
      <button class="btn pri" id="addBtn" data-i="add"></button>
    </form>
    <div class="ac" id="ac" hidden></div>
  </div>
  <div class="err" id="addErr" hidden></div>
  <div class="chips"><span class="hint" style="margin:0" data-i="quick"></span><span id="chips" class="row" style="gap:6px"></span></div>
  <div class="chips" id="cityRow" hidden><span class="hint" style="margin:0" data-i="pickCity"></span><span id="cities" class="row" style="gap:6px"></span></div>
  <p class="hint" data-i="addHint"></p>
</section>

<!-- PENGATURAN PERJALANAN -->
<section class="card">
  <div class="row">
    <label class="f"><span data-i="trip"></span> <select id="trip"></select></label>
    <button class="btn sm" id="tNew" data-i="tNew"></button>
    <button class="btn sm" id="tRen" data-i="tRen"></button>
    <button class="btn sm" id="tDel" data-i="tDel"></button>
    <label class="f"><span data-i="start"></span> <input type="date" id="start"></label>
    <span class="f" style="display:flex;align-items:center;gap:6px"><span data-i="length"></span>
      <span class="stepper"><button class="btn" id="dm" aria-label="−">−</button><output id="days">1</output><button class="btn" id="dp" aria-label="+">+</button></span>
      <span data-i="daysU"></span></span>
    <label class="sw"><input type="checkbox" id="road"><i></i><span data-i="road"></span></label><span class="hint" id="roadSt" style="margin:0" role="status"></span>
  </div>
</section>

<!-- ALUR LANGKAH -->
<section class="card flow" id="flow" aria-live="polite">
  <ol class="fsteps" id="fsteps"></ol>
  <div class="row"><span id="fhint" style="margin-inline-end:auto"></span><button class="btn pri sm" id="fgo"></button></div>
</section>

<!-- AKSI -->
<section class="bar" style="margin-bottom:12px">
  <button class="btn" id="recP">✨ <span data-i="recP"></span></button>
  <button class="btn" id="auto">⚡ <span data-i="auto"></span></button>
  <button class="btn" id="recR">🧭 <span data-i="recR"></span></button>
  <button class="btn" id="undo" disabled>↶ <span data-i="undo"></span></button>
  <span style="margin-inline-start:auto"></span>
  <button class="btn pri" id="pdf" data-i="pdf"></button>
  <div class="menuwrap">
    <button class="btn" id="more" aria-haspopup="true" aria-expanded="false"><span data-i="more"></span> ▾</button>
    <div class="menu" id="menu" hidden>
      <button id="exJson" data-i="exJson"></button>
      <button id="imJson" data-i="imJson"></button>
      <button id="exGpx" data-i="exGpx"></button>
      <button id="share" data-i="share"></button>
      <button id="reset" data-i="reset" style="color:var(--danger)"></button>
      <p data-i="saveHint"></p>
    </div>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</section>

<section class="card" id="nb" hidden>
  <div class="row"><b id="nbT" style="margin-inline-end:auto"></b><button class="btn sm" id="nbX" data-i="close"></button></div>
  <div id="nbList"></div>
</section>

<div class="grid">
  <div id="days-box"></div>
  <div id="map" aria-label="Map"></div>
</div>
<footer data-i="footer"></footer>
</div>
<div id="msg" role="status"></div>

$('#nbX').onclick = () => { $('#nb').hidden = true; };
$('#start').onchange = e => { if (e.target.value) mutate(() => { cur().start = e.target.value; }); };
function setDays(n) { n = Math.min(30, Math.max(1, n)); mutate(() => { const t = cur(); t.days = n; t.items.forEach(i => { if (i.day > n) i.day = 0; }); }); }
$('#dm').onclick = () => setDays(cur().days - 1);
$('#dp').onclick = () => setDays(cur().days + 1);
$('#lang').onchange = e => { lang = e.target.checked ? 'en' : 'id'; try { localStorage.setItem(LS_LANG, lang); } catch {} hideAc(); applyI18n(); drawChips(); if (!$('#nb').hidden) $('#nb').hidden = true; render(); };
$('#helpBtn').onclick = () => { const g = $('#guide'); g.hidden = !g.hidden; if (!g.hidden) g.scrollIntoView({ behavior:'smooth', block:'nearest' }); };
$('#guideX').onclick = () => { $('#guide').hidden = true; try { localStorage.setItem(LS_GUIDE, '1'); } catch {} };

const box = $('#days-box');
box.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) {
    const h = e.target.closest('[data-focus]');
    if (h && map) { const d = +h.dataset.focus, pts = dayItems(cur(), d).map(i => [i.lon, i.lat]); if (pts.length) fitPts(pts); }
    return;
  }
  const id = b.dataset.id, a = b.dataset.act;
  if (a === 'up') nudge(id, -1); else if (a === 'dn') nudge(id, 1); else if (a === 'rm') removeItem(id);
  else if (a === 'nb') { const it = cur().items.find(x => x.id === id); if (it) suggest([it], tr('nbTitleOne', it.title)); }
  else if (a === 'nt') { editing = editing === id ? null : id; render(); }
});
box.addEventListener('change', e => { const s = e.target.closest('select[data-mv]'); if (s && s.value !== '') moveItem(s.dataset.mv, +s.value, null); });
box.addEventListener('focusout', e => {
  const ta = e.target.closest('textarea[data-note]'); if (!ta) return;
  const it = cur().items.find(x => x.id === ta.dataset.note); editing = null;
  if (it && it.note !== ta.value.trim()) mutate(() => { it.note = ta.value.trim(); }); else render();
});
let dragId = null;
box.addEventListener('dragstart', e => { const li = e.target.closest('li.it'); if (!li) return; dragId = li.dataset.id; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
box.addEventListener('dragend', () => { dragId = null; box.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
box.addEventListener('dragover', e => { const ol = e.target.closest('ol.lst'); if (ol && dragId) { e.preventDefault(); box.querySelectorAll('.over').forEach(x => x.classList.remove('over')); ol.classList.add('over'); } });
box.addEventListener('drop', e => {
  const ol = e.target.closest('ol.lst'); if (!ol || !dragId) return; e.preventDefault();
  const after = [...ol.querySelectorAll('li.it:not(.drag)')].find(li => e.clientY < li.getBoundingClientRect().top + li.offsetHeight / 2);
  moveItem(dragId, +ol.dataset.day, after ? after.dataset.id : null);
});

/* ---------- simpan / muat / bagikan ---------- */
function download(name, mime, data) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type:mime })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const fileBase = () => cur().name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'wikitrip';
$('#exJson').onclick = () => download(`wikitrip-${fileBase()}.json`, 'application/json', JSON.stringify({ wikitrip:1, trips:db.trips }, null, 1));
$('#exGpx').onclick = () => {
  const t = cur(), x = s => esc(s);
  const w = t.items.map(i => `<wpt lat="${i.lat}" lon="${i.lon}"><name>${x(i.title)}</name>${i.note ? `<desc>${x(i.note)}</desc>` : ''}<type>${i.day ? tr('gpxDay', i.day) : tr('gpxWl')}</type></wpt>`).join('\n');
  download(`wikitrip-${fileBase()}.gpx`, 'application/gpx+xml', `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Wikitrip" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${x(t.name)}</name></metadata>\n${w}\n</gpx>`);
};
$('#imJson').onclick = () => $('#file').click();
const num = v => (v === '' || v == null ? NaN : +v);
function normTrip(o, name) {
  const items = (o.items || o.places || o.pois || []).map(i => ({
    id:uid(), title:String(i.title || i.name || i.label || '').trim(), lat:num(i.lat ?? i.latitude), lon:num(i.lon ?? i.lng ?? i.longitude),
    q:i.q || i.wikidata || '', src:i.src || i.url || '', inst:i.inst || '', note:String(i.note || i.notes || ''), day:Math.max(0, parseInt(i.day, 10) || 0)
  })).filter(i => i.title && isFinite(i.lat) && isFinite(i.lon));
  const days = Math.min(30, Math.max(1, o.days || Math.max(1, ...items.map(i => i.day))));
  items.forEach(i => { i.src = i.src || (i.q ? 'https://www.wikidata.org/wiki/' + i.q : 'https://www.openstreetmap.org/?mlat=' + i.lat + '&mlon=' + i.lon); if (i.day > days) i.day = 0; });
  return { id:uid(), name:String(o.name || name || tr('imported')), start:/^\d{4}-\d{2}-\d{2}$/.test(o.start) ? o.start : todayISO(), days, items };
}
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const list = j.wikitrip ? j.trips : [j.trip || j];
    const trips = list.map(x => normTrip(x)).filter(t => t.items.length);
    if (!trips.length) throw new Error(tr('eNoTour'));
    mutate(() => { db.trips.push(...trips); db.cur = trips[0].id; fitMap = true; });
    toast(tr('toastLoaded', trips.length));
  } catch (err) { toast(tr('toastLoadFail', err.message)); }
  $('#menu').hidden = true;
};
const b64 = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
$('#share').onclick = async () => {
  const t = cur(), c = { n:t.name, s:t.start, d:t.days, i:t.items.map(i => [i.title, +i.lat.toFixed(5), +i.lon.toFixed(5), i.q, i.src, i.inst, i.note, i.day]) };
  const url = location.origin + location.pathname + '#t=' + b64(JSON.stringify(c));
  $('#menu').hidden = true;
  try { await navigator.clipboard.writeText(url); toast(url.length > 6000 ? tr('toastLinkLong') : tr('toastLink')); } catch { prompt(tr('copyPrompt'), url); }
};
function importHash() {
  if (!location.hash.startsWith('#t=')) return;
  try {
    const c = JSON.parse(unb64(location.hash.slice(3)));
    const t = normTrip({ name:c.n, start:c.s, days:c.d, items:c.i.map(a => ({ title:a[0], lat:a[1], lon:a[2], q:a[3], src:a[4], inst:a[5], note:a[6], day:a[7] })) });
    if (confirm(tr('confirmImport', t.name, t.items.length))) { db.trips.push(t); db.cur = t.id; save(); }
  } catch { toast(tr('toastBadLink')); }
  setQuery(() => {}, '');   // buang #t=… dari URL, parameter lain tetap
}

/* ---------- PDF ---------- */
const C = { brand:[45, 79, 156], ink:[12, 26, 54], muted:[82, 96, 128], line:[221, 228, 241], soft:[234, 239, 249], zebra:[246, 248, 253], white:[255, 255, 255] };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const NONLATIN = /[^\u0000-ɏḀ-ỿ -⁯]/;
async function loadFonts(doc) {
  try {
    const get = async u => { const r = await fetch(u); if (!r.ok) throw 0; const b = new Uint8Array(await r.arrayBuffer()); let s = ''; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(s); };
    const [n, b] = await Promise.all([get('../wikirekap/pdf-fonts/Roboto-Regular.ttf'), get('../wikirekap/pdf-fonts/Roboto-Bold.ttf')]);
    doc.addFileToVFS('R.ttf', n); doc.addFont('R.ttf', 'Roboto', 'normal'); doc.addFileToVFS('RB.ttf', b); doc.addFont('RB.ttf', 'Roboto', 'bold'); return 'Roboto';
  } catch { return 'helvetica'; }
}
function canvasText(doc, cell, lines, bg) {
  const k = doc.internal.scaleFactor, fontMm = cell.styles.fontSize / k, lineMm = fontMm * 1.2, px = 8;
  const pl = cell.padding('left'), pt = cell.padding('top'), w = cell.width - pl - cell.padding('right');
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * px)); cv.height = Math.max(1, Math.round(lines.length * lineMm * px));
  const x = cv.getContext('2d'); x.fillStyle = `rgb(${bg.join(',')})`; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = `rgb(${C.ink.join(',')})`; x.font = `${cell.styles.fontStyle === 'bold' ? '700 ' : ''}${fontMm * px}px "Noto Sans","Segoe UI","Hiragino Sans","Yu Gothic",sans-serif`; x.textBaseline = 'middle';
  lines.forEach((l, i) => { const m = x.measureText(l).width; x.save(); x.translate(0, (i + .5) * lineMm * px); if (m > cv.width) x.scale(cv.width / m, 1); x.fillText(l, 0, 0); x.restore(); });
  doc.addImage(cv.toDataURL('image/png'), 'PNG', cell.x + pl, cell.y + pt, w, lines.length * lineMm);
}
async function exportPDF() {
  if (!window.jspdf) { toast(tr('pdfLib')); return; }
  const t = cur(); if (!t.items.length) { toast(tr('pdfNone')); return; }
  const btn = $('#pdf'); btn.disabled = true; btn.textContent = tr('pdfMaking');
  try {
    const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' }), font = await loadFonts(doc);
    const W = doc.internal.pageSize.width, H = doc.internal.pageSize.height, M = 14;
    const fill = c => doc.setFillColor(...c), txt = c => doc.setTextColor(...c), fnt = (s, z) => { doc.setFont(font, s); doc.setFontSize(z); };
    const clean = s => NONLATIN.test(s) && font === 'helvetica' ? '?' : s;
    fill(C.brand); doc.rect(0, 0, W, 34, 'F'); txt(C.white); fnt('bold', 20); doc.text(clean(t.name), M, 16, { maxWidth:W - 2 * M });
    fnt('normal', 10); const a = fmtDate(dayDate(t, 1), true), b = fmtDate(dayDate(t, t.days), true);
    doc.text(tr('pdfSub', a + (t.days > 1 ? ' – ' + b : ''), t.days, t.items.length), M, 25);
    let y = 44;
    const total = [...Array(t.days).keys()].reduce((s, d) => s + legs(dayItems(t, d + 1)).reduce((p, q) => p + q, 0), 0);
    fnt('normal', 9); txt(C.muted); doc.text(`${db.road ? tr('pdfRoad') : tr('pdfLine')}: ${nf(total)} km`, M, y - 4);
    for (let d = 0; d <= t.days; d++) {
      const list = dayItems(t, d); if (!list.length) continue;
      const col = hex(colorOf(d)), lg = legs(list);
      if (y > H - 50) { doc.addPage(); y = 20; }
      fill(C.soft); doc.roundedRect(M, y, W - 2 * M, 9, 2, 2, 'F'); fill(col); doc.rect(M, y, 2.2, 9, 'F');
      fnt('bold', 11); txt(C.ink); doc.text(clean(d ? tr('dayT', d, fmtDate(dayDate(t, d), true)) : tr('pdfWl')), M + 5, y + 6);
      fnt('normal', 9); txt(C.muted); doc.text(d && list.length > 1 ? `${approx(list)}${nf(lg.reduce((p, q) => p + q, 0))} km` : '', W - M - 2, y + 6, { align:'right' });
      doc.autoTable({
        startY:y + 11, margin:{ left:M, right:M, top:20, bottom:18 }, theme:'plain',
        head:[tr('pdfH')],
        body:list.map((it, k) => [d ? String(k + 1) : '•', it.title + (it.inst ? '\n' + it.inst : ''), it.note || '', d && k < list.length - 1 ? legTxt(list, k) : '']),
        styles:{ font, fontSize:9.5, textColor:C.ink, cellPadding:2.4, lineColor:C.line, lineWidth:0, valign:'top' },
        headStyles:{ fillColor:col, textColor:C.white, fontStyle:'bold', fontSize:9 },
        alternateRowStyles:{ fillColor:C.zebra },
        columnStyles:{ 0:{ cellWidth:11, halign:'center' }, 1:{ cellWidth:68 }, 2:{ cellWidth:'auto' }, 3:{ cellWidth:26, textColor:C.muted } },
        didParseCell(h) { if (font === 'Roboto' && h.section === 'body') { const s = (h.cell.raw || '') + ''; if (NONLATIN.test(s)) h.cell.nonlatin = true; } },
        willDrawCell(h) { if (h.cell.nonlatin && h.section === 'body') { h.cell.nl = h.cell.text.slice(); h.cell.text = ['']; } },
        didDrawCell(h) {
          if (h.section !== 'body') return;
          if (h.cell.nonlatin && h.cell.nl) canvasText(doc, h.cell, h.cell.nl, h.row.index % 2 ? C.zebra : C.white);
          if (h.column.index === 1) { const it = list[h.row.index]; if (it && it.src) doc.link(h.cell.x, h.cell.y, h.cell.width, h.cell.height, { url:it.src }); }
        }
      });
      y = doc.lastAutoTable.finalY + 8;
    }
    const n = doc.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      doc.setPage(p); fnt('normal', 8); txt(C.muted); doc.setDrawColor(...C.line); doc.line(M, H - 13, W - M, H - 13);
      doc.text(tr('pdfFoot'), M, H - 8);
      doc.text(tr('pdfPage', p, n), W - M, H - 8, { align:'right' });
    }
    doc.save(`wikitrip-${fileBase()}.pdf`);
  } catch (e) { console.error(e); toast(tr('pdfFail', e.message || e)); }
  finally { btn.disabled = false; btn.textContent = tr('pdf'); }
}
$('#pdf').onclick = exportPDF;

window.addEventListener('error', e => { console.error(e.message, e.filename, e.lineno); if (!e.filename && /script error/i.test(e.message || '')) toast('Script error (cross-origin): a CDN script failed — check connection / WebGL'); });
/* ---------- mulai ---------- */
applyI18n(); drawChips(); importHash();
try { if (!localStorage.getItem(LS_GUIDE)) $('#guide').hidden = false; } catch { $('#guide').hidden = false; }
render();
})();
