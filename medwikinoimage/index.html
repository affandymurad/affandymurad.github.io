<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedWiki No Image</title>
<meta name="description" content="Find MDWiki articles that have no image, right from your browser.">
<script>
// apply saved theme before first paint to avoid a flash
try { const saved = localStorage.getItem('mwni-theme'); if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved; } catch {}
</script>
<style>
/* MedWiki No Image: same "light navy" design language as Wikirekap */
:root {
  --bg: #f3f6fc; --surface: #ffffff; --ink: #0c1a36; --muted: #526080; --line: #dde4f1; --soft: #eaeff9;
  --brand: #2d4f9c; --brand-2: #5278d0; --brand-text: #2d4f9c;
  --ok: #198754; --ok-bg: #d9efe4; --warn: #b45309; --warn-bg: #fff3e0; --warn-line: #f1c27d; --danger: #c62839;
  --ring: color-mix(in srgb, var(--brand-2) 38%, transparent);
  --radius: 24px; --radius-md: 14px; --radius-sm: 12px;
  --shadow-sm: 0 1px 2px rgba(12, 26, 54, .05), 0 2px 8px rgba(12, 26, 54, .04);
  --shadow: 0 1px 2px rgba(12, 26, 54, .04), 0 12px 32px rgba(33, 58, 122, .09);
  --shadow-brand: 0 10px 24px rgba(45, 79, 156, .32);
  --glow: radial-gradient(60% 50% at 50% 0%, rgba(82, 120, 208, .16), transparent 70%);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080f20; --surface: #0f1a33; --ink: #e8eefc; --muted: #9aaccc; --line: #213056; --soft: #15244a;
    --brand: #3f66bf; --brand-2: #6d93e8; --brand-text: #8fb1f2;
    --ok: #4ade80; --ok-bg: #12291d; --warn: #ffc27a; --warn-bg: #3a2a10; --warn-line: #6b4a1a; --danger: #f87171;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .38);
    --shadow-brand: 0 10px 26px rgba(63, 102, 191, .38);
    --glow: radial-gradient(60% 50% at 50% 0%, rgba(109, 147, 232, .16), transparent 70%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080f20; --surface: #0f1a33; --ink: #e8eefc; --muted: #9aaccc; --line: #213056; --soft: #15244a;
  --brand: #3f66bf; --brand-2: #6d93e8; --brand-text: #8fb1f2;
  --ok: #4ade80; --ok-bg: #12291d; --warn: #ffc27a; --warn-bg: #3a2a10; --warn-line: #6b4a1a; --danger: #f87171;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .38);
  --shadow-brand: 0 10px 26px rgba(63, 102, 191, .38);
  --glow: radial-gradient(60% 50% at 50% 0%, rgba(109, 147, 232, .16), transparent 70%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
body {
  margin: 0; min-height: 100vh; overflow-x: hidden;
  background: var(--glow) no-repeat top center / 100% 520px, var(--bg);
  color: var(--ink);
  font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in srgb, var(--brand-2) 32%, transparent); }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 6px; }
a { color: var(--brand-text); text-underline-offset: 3px; }
.wrap { width: min(960px, 100% - 32px); margin-inline: auto; }
svg { flex: none; }

/* ===== header ===== */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
}
.nav { display: flex; align-items: center; gap: 14px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; color: var(--ink); text-decoration: none; letter-spacing: -.02em; }
.logo img { height: 34px; width: auto; display: block; }
.logo:hover span { text-decoration: underline; text-underline-offset: 4px; }
.tool-name { padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.switch {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 80px; height: 36px; padding: 0;
  border: 1px solid var(--line); border-radius: 999px; overflow: hidden; cursor: pointer;
  background: var(--surface); color: var(--muted); box-shadow: var(--shadow-sm);
  font: 600 12.5px/1 inherit; transition: border-color .18s;
}
.switch:hover { border-color: var(--brand-2); }
.switch span { position: relative; z-index: 1; display: grid; place-items: center; transition: color .2s; }
.switch i { position: absolute; z-index: 0; top: 3px; left: 3px; width: calc(50% - 3px); height: 28px; border-radius: 999px; background: var(--brand); transition: transform .22s; }
.switch[aria-checked="false"] span:first-of-type, .switch[aria-checked="true"] span:last-of-type { color: #fff; }
.switch[aria-checked="true"] i { transform: translateX(100%); }
.switch svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 560px) { .tool-name { display: none; } }

/* ===== hero ===== */
.hero { padding: 48px 0 28px; animation: rise .6s cubic-bezier(.2, .7, .2, 1) both; }
.badge {
  display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 999px;
  background: color-mix(in srgb, var(--soft) 85%, var(--surface)); color: var(--brand-text);
  border: 1px solid color-mix(in srgb, var(--brand-2) 22%, transparent); font-size: 13px; font-weight: 600;
}
h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.1; margin: 18px 0 14px; letter-spacing: -.03em; max-width: 16em; }
h1 em { font-style: normal; background: linear-gradient(110deg, var(--brand), var(--brand-2) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: 18px; color: var(--muted); max-width: 40em; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.chips span { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--muted); box-shadow: var(--shadow-sm); }
.credits {
  display: grid; gap: 8px; margin-top: 24px; padding: 14px 16px; border-radius: var(--radius-sm);
  background: var(--soft); border: 1px dashed color-mix(in srgb, var(--brand-2) 35%, transparent);
  color: var(--muted); font-size: 13.5px;
}
.credits p { display: flex; gap: 10px; align-items: flex-start; margin: 0; }
.credits svg { width: 16px; height: 16px; margin-top: 3px; stroke: var(--brand-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===== kartu & langkah ===== */
.card, .form-section {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 30px; margin-bottom: 22px; box-shadow: var(--shadow);
  animation: rise .55s cubic-bezier(.2, .7, .2, 1) both;
}
.form-section { counter-reset: s; position: relative; overflow: hidden; }
.form-section::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
.step { margin-bottom: 30px; counter-increment: s; }
.step:last-child { margin-bottom: 0; }
.step-title { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; font-weight: 700; font-size: 16.5px; letter-spacing: -.01em; }
.step-title::before {
  content: counter(s); flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(140deg, var(--brand), var(--brand-2)); color: #fff; font-size: 13px; font-weight: 800;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 18%, transparent);
}
.field-info { font-size: 13.5px; color: var(--muted); margin: 0 0 12px 40px; }
.field-info code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--soft); padding: 1px 6px; border-radius: 6px; color: var(--ink); }
.tip {
  display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px 40px; padding: 10px 14px;
  border-radius: var(--radius-sm); background: var(--soft); color: var(--muted); font-size: 13.5px;
  border: 1px dashed color-mix(in srgb, var(--brand-2) 35%, transparent);
}
.tip svg { width: 16px; height: 16px; margin-top: 3px; stroke: var(--brand-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tip b { color: var(--ink); }
textarea {
  display: block; width: 100%; min-height: 240px; resize: vertical; padding: 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); color: var(--ink);
  background: color-mix(in srgb, var(--soft) 45%, var(--surface));
  font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
textarea:hover { border-color: color-mix(in srgb, var(--brand-2) 55%, var(--line)); }
textarea:focus { outline: none; border-color: var(--brand-2); background: var(--surface); box-shadow: 0 0 0 4px var(--ring); }
textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.list-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; }
.src { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--ok); font-weight: 600; }
.note.err { color: var(--danger); }

/* ===== tombol ===== */
button { font: inherit; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-primary {
  flex: 1 1 220px; padding: 14px 20px; border: none; border-radius: var(--radius-md); cursor: pointer; color: #fff;
  font-weight: 700; font-size: 16px; letter-spacing: .01em;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: var(--shadow-brand), inset 0 1px 0 rgba(255, 255, 255, .22);
  transition: transform .15s, box-shadow .2s, filter .2s;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
.btn-primary:active:not(:disabled) { transform: translateY(0) scale(.99); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--shadow-sm);
  transition: border-color .18s, background .18s, transform .12s;
}
.icon-btn:hover:not(:disabled) { border-color: var(--brand-2); background: var(--soft); }
.icon-btn:active:not(:disabled) { transform: scale(.97); }
.icon-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===== progres ===== */
.progress { padding: 20px 24px; }
.progress-bar-bg { width: 100%; height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.progress-bar { position: relative; height: 100%; width: 0; border-radius: 999px; overflow: hidden; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .3s; }
.progress.running .progress-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); transform: translateX(-100%); animation: shimmer 1.4s infinite; }
.progress-text { margin-top: 10px; text-align: center; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ===== hasil ===== */
h2 { font-size: clamp(22px, 3vw, 28px); line-height: 1.15; margin: 0; letter-spacing: -.025em; }
.result-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 12px; margin-bottom: 22px; }
.summary-item {
  position: relative; padding: 16px 18px; overflow: hidden; border-radius: 18px;
  background: linear-gradient(160deg, var(--soft), color-mix(in srgb, var(--soft) 40%, var(--surface)));
  border: 1px solid color-mix(in srgb, var(--brand-2) 16%, var(--line));
}
.summary-item::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: linear-gradient(to bottom, var(--brand), var(--brand-2)); }
.summary-item.em { border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--ring); }
.summary-value { font-size: 26px; font-weight: 800; color: var(--brand-text); letter-spacing: -.03em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.summary-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.sec { margin-top: 22px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 10px; }
.sec-head h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.sec-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 700; }
.table-container { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: color-mix(in srgb, var(--soft) 60%, transparent); }
th { background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.col-num { width: 1%; white-space: nowrap; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-status { width: 1%; white-space: nowrap; }
td a { color: var(--brand-text); text-decoration: none; font-weight: 500; }
td a:hover { text-decoration: underline; }
.tag { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.tag-noimage { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.tag-error { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.tag-missing { color: var(--muted); background: var(--soft); border-color: var(--line); }
.allok { margin: 0; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--ok-bg); color: var(--ok); font-size: 14px; font-weight: 600; }
.waiting { margin: 0; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--soft); color: var(--muted); font-size: 14px; }

/* ===== footer ===== */
footer { padding: 36px 0 52px; margin-top: 16px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
footer .row { display: flex; flex-wrap: wrap; gap: 10px 28px; justify-content: space-between; }
footer a { color: var(--muted); }
footer a:hover { color: var(--brand-text); }

/* ===== animasi ===== */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { to { transform: translateX(100%); } }
@media (max-width: 560px) {
  .card, .form-section { padding: 22px 18px; }
  .field-info, .tip { margin-left: 0; }
  .hero { padding-top: 32px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="https://mdwiki.org/wiki/Main_Page" target="_blank" rel="noopener" aria-label="WikiProjectMed">
      <img src="logo.png" alt="" referrerpolicy="no-referrer"
           onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://mdwiki.org/logo.png'}else{this.hidden=true}">
      <span>WikiProjectMed</span>
    </a>
    <span class="tool-name" data-i18n="toolName"></span>
    <div class="tools">
      <button id="lang" class="switch" type="button" role="switch" aria-checked="false"><i></i><span>EN</span><span>ID</span></button>
      <button id="theme" class="switch" type="button" role="switch" aria-checked="false">
        <i></i>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="badge">● <span data-i18n="badge"></span></span>
    <h1><span data-i18n="heroTitle"></span> <em data-i18n="heroEm"></em></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="chips">
      <span data-i18n="chip1"></span>
      <span data-i18n="chip2"></span>
      <span data-i18n="chip3"></span>
    </div>
    <div class="credits">
      <p>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span data-i18n-html="credit"></span>
      </p>
      <p>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n-html="madeBy"></span>
      </p>
    </div>
  </section>

  <section class="form-section">
    <div class="step">
      <label class="step-title" for="input" data-i18n="step1"></label>
      <p class="field-info" data-i18n-html="hint"></p>
      <p class="tip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
        <span data-i18n-html="autoHint"></span>
      </p>
      <textarea id="input" spellcheck="false"></textarea>
      <div class="list-row">
        <button id="list" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span data-i18n="getList"></span>
        </button>
        <span class="src" data-i18n-html="listSource"></span>
        <span class="note" id="listnote" role="status"></span>
      </div>
    </div>
    <div class="step">
      <div class="step-title" data-i18n="step2"></div>
      <p class="field-info" data-i18n="step2info"></p>
      <div class="actions">
        <button id="run" class="btn-primary" type="button" data-i18n="run"></button>
        <button id="stop" class="icon-btn" type="button" disabled data-i18n="stop"></button>
        <button id="retry" class="icon-btn" type="button" disabled data-i18n="retry"></button>
      </div>
    </div>
  </section>

  <section class="card progress" id="status" hidden>
    <div class="progress-bar-bg"><div class="progress-bar" id="bar"></div></div>
    <div class="progress-text" id="ptext"></div>
  </section>

  <section class="card" id="results" hidden>
    <div class="result-head">
      <h2 data-i18n="resultsTitle"></h2>
      <div class="result-actions">
        <span class="note" id="note" role="status"></span>
        <button id="copy" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span data-i18n="copy"></span>
        </button>
        <button id="download" class="icon-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
          <span data-i18n="download"></span>
        </button>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <div id="sections"></div>
  </section>
</main>

<footer>
  <div class="wrap row">
    <div>© <span id="yr"></span> Affandy Murad · <span data-i18n="footerData"></span></div>
    <div>
      <a href="../">← Affandy Murad</a> ·
      <a href="https://mdwiki.org/wiki/Main_Page" target="_blank" rel="noopener">MDWiki</a> ·
      <a href="https://www.mediawiki.org/wiki/API:Main_page" target="_blank" rel="noopener">MediaWiki API</a> ·
      <a href="https://meta.wikimedia.org/wiki/User:Affandy_Murad/Wikimania_2025" target="_blank" rel="noopener">Wikimania 2025</a>
    </div>
  </div>
</footer>

<script>
const API = 'https://mdwiki.org/w/api.php';

// ---------- parsing ----------
function parse(text) {
  const wikitext = text.includes('[[');
  const out = [];
  let cur = { name: null, titles: [] };
  let skipRest = false;
  const push = () => { if (cur.titles.length) out.push(cur); };

  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    const h = line.match(/^(={2,3})\s*([^=]+?)\s*\1$/);
    if (h) { push(); cur = { name: h[2].trim(), titles: [] }; skipRest = false; continue; }

    let candidates = [];
    if (wikitext) candidates = [...line.matchAll(/\[\[([^\]]+)\]\]/g)].map((m) => m[1]);
    else if (line && !line.endsWith(':')) candidates = [line.replace(/^[#*:\s]+/, '')];

    for (const c of candidates) {
      const title = c.split('|')[0].trim().replace(/_/g, ' ');
      if (!title) continue;
      if (title === 'WikiProjectMed') { skipRest = true; continue; }
      if (skipRest) continue;
      if (/^(WikiProjectMed|Image|File|Category):/i.test(title) || /^\w{2}$/.test(title) || title.includes('[')) continue;
      if (!cur.titles.includes(title)) cur.titles.push(title);
    }
  }
  push();
  return out;
}

function hasImage(wikitext) {
  const infobox = /image\d*\s*=[ \t]*[^\s|}]/i.test(wikitext);
  const file = /\[\[(File|Image):/i.test(wikitext);
  return infobox || file;
}

// ---------- API ----------
async function fetchBatch(titles, signal) {
  const params = new URLSearchParams({
    action: 'query', prop: 'revisions', rvprop: 'content', rvslots: 'main',
    format: 'json', formatversion: '2', redirects: '1', origin: '*',
    titles: titles.join('|'),
  });
  const res = await fetch(`${API}?${params}`, { signal: AbortSignal.any([signal, AbortSignal.timeout(TIMEOUT)]) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error.info);

  const q = data.query || {};
  const alias = new Map();
  for (const r of [...(q.normalized || []), ...(q.redirects || [])]) alias.set(r.from, r.to);
  const pages = new Map((q.pages || []).map((p) => [p.title, p]));

  const result = {};
  for (const title of titles) {
    let k = title, n = 0;
    while (alias.has(k) && n++ < 10) k = alias.get(k);
    const p = pages.get(k);
    const content = p && !p.missing && !p.invalid ? p.revisions?.[0]?.slots?.main?.content : null;
    result[title] = content == null ? 'missing' : hasImage(content) ? 'image' : 'noimage';
  }
  return result;
}

// ---------- menjalankan ----------
async function run(onlyUnfinished) {
  if (running) return;
  if (!onlyUnfinished) {
    sections = parse($('input').value).map((s) => ({ name: s.name, items: new Map(s.titles.map((title) => [title, 'pending'])) }));
    try { localStorage.setItem('mwni-input', $('input').value); } catch {}
  }
  const todo = [];
  for (const s of sections) for (const [title, st] of s.items) if (st === 'pending' || st === 'error') todo.push({ s, title });
  if (!todo.length) { render(); return; }

  running = true;
  controller = new AbortController();
  $('status').hidden = false;
  $('results').hidden = false;
  setButtons();

  // satu judul bisa muncul di beberapa section; kelompokkan per judul unik
  const byTitle = new Map();
  for (const { s, title } of todo) { if (!byTitle.has(title)) byTitle.set(title, []); byTitle.get(title).push(s); }
  const titles = [...byTitle.keys()];
  const batches = [];
  for (let i = 0; i < titles.length; i += BATCH) batches.push(titles.slice(i, i + BATCH));

  let next = 0;
  const worker = async () => {
    while (next < batches.length && !controller.signal.aborted) {
      const batch = batches[next++];
      let res = null;
      try { res = await fetchBatch(batch, controller.signal); }
      catch (e) { if (controller.signal.aborted) return; }
      for (const title of batch) for (const s of byTitle.get(title)) s.items.set(title, res ? res[title] : 'error');
      render();
    }
  };
  await Promise.all(Array.from({ length: PARALLEL }, worker));

  running = false;
  controller = null;
  render();
}

// ---------- tampilan ----------
function count() {
  const c = { pending: 0, image: 0, noimage: 0, missing: 0, error: 0 };
  for (const s of sections) for (const st of s.items.values()) c[st]++;
  return c;
}

function setButtons() {
  const c = count();
  $('run').disabled = running;
  $('stop').disabled = !running;
  $('retry').disabled = running || c.error + c.pending === 0;
  $('status').classList.toggle('running', running);
}

function articleUrl(title) {
  return 'https://mdwiki.org/wiki/' + encodeURIComponent(title.replace(/ /g, '_')).replace(/%2F/g, '/').replace(/%3A/g, ':');
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function sectionEl(s) {
  const by = (st) => [...s.items].filter(([, v]) => v === st).map(([title]) => title);
  const noimage = by('noimage'), err = by('error'), missing = by('missing');
  const pending = by('pending').length, image = by('image').length;

  const box = el('div', 'sec');
  const head = el('div', 'sec-head');
  head.append(el('h3', '', s.name || t('noSection')));
  const chips = el('div', 'sec-chips');
  for (const [label, n] of [[t('noimage'), noimage.length], [t('image'), image], [t('missing'), missing.length], [t('error'), err.length], [t('pending'), pending]]) {
    if (!n) continue;
    const chip = el('span', 'chip');
    chip.append(el('b', '', n), ' ' + label);
    chips.append(chip);
  }
  head.append(chips);
  box.append(head);

  const rows = [...noimage.map((x) => [x, 'noimage']), ...err.map((x) => [x, 'error']), ...missing.map((x) => [x, 'missing'])];
  if (!rows.length) {
    box.append(pending ? el('p', 'waiting', t('sectionPending', pending)) : el('p', 'allok', '✓ ' + t('allHave', s.items.size)));
    return box;
  }

  const wrap = el('div', 'table-container');
  const table = el('table');
  const hr = el('tr');
  hr.append(el('th', 'col-num', '#'), el('th', '', t('colArticle')), el('th', 'col-status', t('colStatus')));
  const thead = el('thead'); thead.append(hr);
  const tbody = el('tbody');
  rows.forEach(([title, st], i) => {
    const tr = el('tr');
    const a = el('a', '', title);
    a.href = articleUrl(title); a.target = '_blank'; a.rel = 'noopener';
    const tdName = el('td'); tdName.append(a);
    const tdStatus = el('td', 'col-status'); tdStatus.append(el('span', 'tag tag-' + st, t(st)));
    tr.append(el('td', 'col-num', i + 1), tdName, tdStatus);
    tbody.append(tr);
  });
  table.append(thead, tbody);
  wrap.append(table);
  box.append(wrap);
  return box;
}

function render() {
  const c = count();
  const total = c.pending + c.image + c.noimage + c.missing + c.error;
  const done = total - c.pending;
  $('bar').style.width = (total ? (done / total) * 100 : 0) + '%';
  $('ptext').textContent = t('progress', done, total);

  const sum = $('summary');
  sum.textContent = '';
  for (const key of ['noimage', 'image', 'missing', 'error', 'pending']) {
    const item = el('div', 'summary-item' + (key === 'noimage' ? ' em' : ''));
    item.append(el('div', 'summary-value', c[key].toLocaleString(lang === 'id' ? 'id-ID' : 'en-US')), el('div', 'summary-label', t(key)));
    sum.append(item);
  }

  const root = $('sections');
  root.textContent = '';
  for (const s of sections) root.append(sectionEl(s));
  setButtons();
}

function toText() {
  let out = '';
  for (const s of sections) {
    const by = (st) => [...s.items].filter(([, v]) => v === st).map(([title]) => `# [[${title}]] ${articleUrl(title)}\n`).join('');
    out += `\n== ${s.name || ''} ==\n`;
    out += '\nArticles without infobox image or File Commons:\n' + by('noimage');
    out += '\nArticles with Request timed out:\n' + by('error') + by('pending');
    const missing = by('missing');
    if (missing) out += '\nArticles not found:\n' + missing;
  }
  return out.trim() + '\n';
}

let flashTimer;
function flash(msg, err = false, ms = 2000) {
  clearTimeout(flashTimer);
  $('note').className = 'note' + (err ? ' err' : '');
  $('note').textContent = msg;
  if (msg && ms) flashTimer = setTimeout(() => { $('note').textContent = ''; }, ms);
}

const PDF_COLORS = {
  brand: [45, 79, 156], ink: [12, 26, 54], muted: [82, 96, 128], line: [221, 228, 241],
  soft: [234, 239, 249], bg: [243, 246, 252], white: [255, 255, 255],
  danger: [198, 40, 57], warnInk: [146, 64, 14], okBg: [209, 231, 221], okInk: [25, 135, 84],
};
const PDF_LIBS = [
  ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk'],
  ['https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js', 'sha384-Zj5NAMJ45tB1L13yWiQlFjFjlyyeUBZTWQKktGXeW303njR3jSLmfN16iUgF8I8n'],
];
// Font yang sama dengan Wikirekap (disajikan dari situs ini); jika gagal dimuat dipakai font bawaan PDF
const PDF_FONTS = { normal: '../wikirekap/pdf-fonts/Roboto-Regular.ttf', bold: '../wikirekap/pdf-fonts/Roboto-Bold.ttf' };
let pdfLibsPromise = null;

function loadScript(src, integrity) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.integrity = integrity; s.crossOrigin = 'anonymous';
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.append(s);
  });
}

function loadPdfLibs() {
  if (!pdfLibsPromise) {
    pdfLibsPromise = (async () => { for (const [src, sri] of PDF_LIBS) await loadScript(src, sri); })()
      .catch((e) => { pdfLibsPromise = null; throw e; });
  }
  return pdfLibsPromise;
}

async function registerPdfFonts(doc) {
  try {
    const [normal, bold] = await Promise.all(Object.values(PDF_FONTS).map(async (url) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Font ${url}: ${res.status}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    }));
    doc.addFileToVFS('Roboto-Regular.ttf', normal);
    doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
    doc.addFileToVFS('Roboto-Bold.ttf', bold);
    doc.addFont('Roboto-Bold.ttf', 'Roboto', 'bold');
    return 'Roboto';
  } catch (e) {
    console.warn('PDF font not loaded, using the built-in font:', e);
    return 'helvetica';
  }
}

async function exportPDF() {
  if (!sections.length) return;
  const btn = $('download');
  btn.disabled = true;
  flash(t('pdfBusy'), false, 0);
  try {
    await loadPdfLibs();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const fontName = await registerPdfFonts(doc);

    const C = PDF_COLORS;
    const locale = lang === 'id' ? 'id-ID' : 'en-US';
    const nf = (n) => n.toLocaleString(locale);
    const M = 14;
    const pageW = doc.internal.pageSize.width;
    const pageH = doc.internal.pageSize.height;
    const contentW = pageW - M * 2;
    const TOP_NEXT = 22;            // awal konten di halaman lanjutan (di bawah header berjalan)
    const BOTTOM = pageH - 18;      // batas bawah konten (di atas footer)
    let y = 0;

    const color = (rgb) => doc.setTextColor(rgb[0], rgb[1], rgb[2]);
    const fill = (rgb) => doc.setFillColor(rgb[0], rgb[1], rgb[2]);
    const face = (style, size) => { doc.setFont(fontName, style); doc.setFontSize(size); };
    // font bawaan hanya Latin-1; karakter lain diganti agar tidak merusak teks (URL tetap utuh)
    const safe = (s) => (fontName === 'Roboto' ? String(s) : String(s).replace(/[^\x20-\xFF]/g, '?'));
    const ensure = (need) => { if (y + need > BOTTOM) { doc.addPage(); y = TOP_NEXT; } };

    const c = count();
    const total = c.pending + c.image + c.noimage + c.missing + c.error;
    const generated = new Date().toLocaleString(locale, { dateStyle: 'long', timeStyle: 'short' });

    // ---------- pita judul ----------
    fill(C.brand);
    doc.rect(0, 0, pageW, 30, 'F');
    face('bold', 20); color(C.white);
    doc.text('MedWiki No Image', M, 14);
    face('normal', 10.5);
    doc.text(t('pdfSubtitle'), M, 22.5);
    face('bold', 11);
    doc.text('WikiProjectMed', pageW - M, 13.5, { align: 'right' });
    face('normal', 9);
    doc.text(generated, pageW - M, 21.5, { align: 'right' });

    // ---------- rincian ----------
    const kv = (x, yy, label, value, w) => {
      face('bold', 7.5); color(C.muted);
      doc.text(label.toUpperCase(), x, yy);
      face('normal', 9.5); color(C.ink);
      const lines = doc.splitTextToSize(String(value), w);
      doc.text(lines, x, yy + 4.8);
      return yy + 4.8 + lines.length * 4.4 + 3.5;
    };
    const yl = kv(M, 40, t('pdfGenerated'), generated, 90);
    const yr = kv(M + 100, 40, t('pdfChecked'), t('pdfCheckedValue', nf(total - c.pending), sections.length), contentW - 100);
    y = Math.max(yl, yr) + 2;

    // ---------- kartu ringkasan ----------
    const gap = 4;
    const tileW = (contentW - gap * 4) / 5;
    ensure(26);
    ['noimage', 'image', 'missing', 'error', 'pending'].forEach((key, i) => {
      const x = M + i * (tileW + gap);
      fill(C.soft);
      doc.roundedRect(x, y, tileW, 20, 3, 3, 'F');
      face('bold', 16); color(key === 'noimage' ? C.danger : C.brand);
      doc.text(nf(c[key]), x + 4, y + 9.5);
      face('normal', 8); color(C.muted);
      doc.text(t(key), x + 4, y + 15.5);
    });
    y += 20 + 10;

    // ---------- per section ----------
    for (const s of sections) {
      const by = (st) => [...s.items].filter(([, v]) => v === st).map(([title]) => title);
      const noimage = by('noimage'), err = by('error'), missing = by('missing');
      const pending = by('pending').length, image = by('image').length;

      ensure(34); // judul + header tabel + minimal satu baris
      fill(C.brand);
      doc.roundedRect(M, y - 4.4, 1.6, 5.8, 0.8, 0.8, 'F');
      face('bold', 12.5); color(C.ink);
      doc.text(safe(s.name || t('noSection')), M + 4.5, y);
      const bits = [['noimage', noimage.length], ['image', image], ['missing', missing.length], ['error', err.length], ['pending', pending]]
        .filter(([, n]) => n).map(([k, n]) => `${nf(n)} ${t(k)}`).join('   |   ');
      face('normal', 8.5); color(C.muted);
      doc.text(bits, pageW - M, y, { align: 'right' });
      y += 6;

      const rows = [...noimage.map((x) => [x, 'noimage']), ...err.map((x) => [x, 'error']), ...missing.map((x) => [x, 'missing'])];
      if (!rows.length) {
        const msg = pending ? t('sectionPending', pending) : t('allHave', s.items.size);
        fill(pending ? C.soft : C.okBg);
        doc.roundedRect(M, y, contentW, 9, 2, 2, 'F');
        face('bold', 9); color(pending ? C.muted : C.okInk);
        doc.text(msg, M + 4, y + 5.9);
        y += 9 + 9;
        continue;
      }

      doc.autoTable({
        theme: 'grid',
        head: [['#', t('colArticle'), t('colStatus'), 'URL']],
        body: rows.map(([title, st], i) => [i + 1, safe(title), t(st), articleUrl(title)]),
        startY: y,
        styles: { font: fontName, fontSize: 8.5, cellPadding: 2.4, overflow: 'linebreak', halign: 'left', textColor: C.ink, lineColor: C.line, lineWidth: 0.2 },
        headStyles: { fillColor: C.brand, textColor: C.white, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: C.bg },
        margin: { top: TOP_NEXT, left: M, right: M, bottom: 18 },
        columnStyles: {
          0: { cellWidth: 11, halign: 'right', textColor: C.muted },
          2: { cellWidth: 26 },
          3: { cellWidth: 72, fontSize: 7, textColor: C.brand },
        },
        showHead: 'everyPage',
        rowPageBreak: 'avoid',
        didParseCell(data) {
          if (data.section === 'body' && data.column.index === 2) {
            const st = rows[data.row.index][1];
            data.cell.styles.fontStyle = 'bold';
            data.cell.styles.textColor = st === 'noimage' ? C.danger : st === 'error' ? C.warnInk : C.muted;
          }
        },
        didDrawCell(data) {
          // judul dan URL bisa diklik di PDF
          if (data.section === 'body' && (data.column.index === 1 || data.column.index === 3)) {
            doc.link(data.cell.x, data.cell.y, data.cell.width, data.cell.height, { url: articleUrl(rows[data.row.index][0]) });
          }
        },
      });
      y = doc.lastAutoTable.finalY + 9;
    }

    // ---------- penutup ----------
    ensure(22);
    doc.setDrawColor(C.line[0], C.line[1], C.line[2]);
    doc.setLineWidth(0.3);
    doc.line(M, y, pageW - M, y);
    y += 6;
    face('normal', 8.5); color(C.muted);
    doc.text(t('footerData'), M, y);
    y += 4.6;
    color(C.brand);
    doc.textWithLink(`${t('pdfCredit')} - https://meta.wikimedia.org/wiki/User:Affandy_Murad`, M, y, { url: 'https://meta.wikimedia.org/wiki/User:Affandy_Murad' });

    // ---------- header berjalan + footer di setiap halaman ----------
    const pages = doc.internal.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setDrawColor(C.line[0], C.line[1], C.line[2]);
      doc.setLineWidth(0.3);
      if (p > 1) {
        face('normal', 8); color(C.muted);
        doc.text(`MedWiki No Image  |  ${t('resultsTitle')}`, M, 11);
        doc.line(M, 14, pageW - M, 14);
      }
      doc.line(M, pageH - 13, pageW - M, pageH - 13);
      face('normal', 8); color(C.muted);
      doc.text(`MedWiki No Image  -  ${t('pdfBy')}`, M, pageH - 8);
      doc.text(t('pdfPage', p, pages), pageW - M, pageH - 8, { align: 'right' });
    }

    doc.save(`medwiki-no-image-${new Date().toISOString().slice(0, 10)}.pdf`);
    flash('');
  } catch (e) {
    console.error(e);
    flash(t('pdfFail'), true, 6000);
  }
  btn.disabled = false;
}

// ---------- event ----------
$('run').onclick = () => run(false);
$('retry').onclick = () => run(true);
$('stop').onclick = () => controller && controller.abort();
$('list').onclick = async () => {
  const note = $('listnote');
  if ($('input').value.trim() && !confirm(t('overwrite'))) return;
  $('list').disabled = true;
  note.className = 'note';
  note.textContent = t('loading');
  try {
    const params = new URLSearchParams({
      action: 'query', prop: 'revisions', rvprop: 'content', rvslots: 'main',
      format: 'json', formatversion: '2', redirects: '1', origin: '*', titles: LIST_PAGE,
    });
    const res = await fetch(`${API}?${params}`, { signal: AbortSignal.timeout(TIMEOUT) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const page = (await res.json()).query?.pages?.[0];
    const wikitext = page?.revisions?.[0]?.slots?.main?.content;
    if (!wikitext) throw new Error('empty');
    const parsed = parse(wikitext);
    $('input').value = parsed.map((s) => (s.name ? `== ${s.name} ==\n` : '') + s.titles.join('\n')).join('\n\n') + '\n';
    note.textContent = t('loaded', new Set(parsed.flatMap((s) => s.titles)).size, parsed.length);
  } catch {
    note.className = 'note err';
    note.textContent = t('loadFail');
  }
  $('list').disabled = false;
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(toText()); flash(t('copied')); }
  catch { flash(t('copyFail'), true); }
};
$('download').onclick = exportPDF;
$('lang').onclick = () => {
  lang = lang === 'en' ? 'id' : 'en';
  try { localStorage.setItem('mwni-lang', lang); } catch {}
  applyLang();
};
$('theme').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('mwni-theme', next); } catch {}
  applyTheme();
};
darkQuery.addEventListener('change', applyTheme);

try { $('input').value = localStorage.getItem('mwni-input') || ''; } catch {}
$('yr').textContent = new Date().getFullYear();
applyLang();
</script>
</body>
