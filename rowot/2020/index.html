<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalender Rowot Sasak 2020 — Interaktif</title>
  <!-- Google Fonts: Noto Serif, Amiri (Arabic), and Inter for crisp UI controls -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- jsPDF: direct A4 PDF download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       1. EXACT COLOR PALETTE & THEME VARIABLES (LIGHT & DARK MODE)
       ========================================================================== */
    :root,
    [data-theme="light"] {
      --bg-outer: #d7e2f1;
      --bg-page: #eef3fa;
      --bg-card: #f7fafe;
      --bg-header-dark: #3a6ba6;
      --bg-header-mid: #4679b4;
      --bg-header-light: #e3ecf8;
      --bg-cell-even: #f5f9ff;
      --bg-cell-odd: #e9f1fb;
      --bg-cell-overflow: #dce6f4;
      --bg-cell-hover: #d8e6f8;
      --border-page: #3a6ba6;
      --border-grid: #89aad3;
      --border-soft: #b8cde8;
      --text-primary: #132540;
      --text-secondary: #2e4b73;
      --text-muted: #5a7496;
      --text-on-dark: #ffffff;
      --red-accent: #c44a45;
      --red-soft-bg: #fdeaea;
      --red-soft-border: #e5a3a0;
      --adat-accent: #2c6e49;
      --adat-soft-bg: #e6f4ec;
      --adat-soft-border: #9ad1b3;
      --highlight-ring: #f59e0b;
      --highlight-bg: #fef3c7;
      --compass-bg: #eef3fa;
      --compass-line: #3a6ba6;
      --compass-text: #132540;
      --shadow-card: 0 8px 24px -4px rgba(19, 37, 64, 0.12), 0 2px 6px -1px rgba(19, 37, 64, 0.06);
      --shadow-modal: 0 20px 45px -10px rgba(19, 37, 64, 0.35);
    }

    [data-theme="dark"] {
      --bg-outer: #07101f;
      --bg-page: #0d1a2e;
      --bg-card: #12233d;
      --bg-header-dark: #0f2040;
      --bg-header-mid: #1e3a6e;
      --bg-header-light: #172c52;
      --bg-cell-even: #11213b;
      --bg-cell-odd: #152847;
      --bg-cell-overflow: #0b1628;
      --bg-cell-hover: #1d3661;
      --border-page: #2d528f;
      --border-grid: #294678;
      --border-soft: #213a66;
      --text-primary: #e6eefc;
      --text-secondary: #aec6eb;
      --text-muted: #7896c4;
      --text-on-dark: #f4f8ff;
      --red-accent: #f08a82;
      --red-soft-bg: #3b1c22;
      --red-soft-border: #7a343b;
      --adat-accent: #6ee7b7;
      --adat-soft-bg: #133629;
      --adat-soft-border: #25634b;
      --highlight-ring: #fbbf24;
      --highlight-bg: #3b2e13;
      --compass-bg: #0f2040;
      --compass-line: #4e80cc;
      --compass-text: #e6eefc;
      --shadow-card: 0 10px 28px -4px rgba(0, 0, 0, 0.45), 0 2px 8px -1px rgba(0, 0, 0, 0.3);
      --shadow-modal: 0 24px 54px -10px rgba(0, 0, 0, 0.75);
    }

    /* ==========================================================================
       2. RESET & BASE TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-outer);
      color: var(--text-primary);
      font-family: 'Noto Serif', Georgia, serif;
      line-height: 1.45;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    .ui-sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .arabic {
      font-family: 'Amiri', 'Traditional Arabic', serif;
      direction: rtl;
    }

    /* ==========================================================================
       3. STICKY TOP NAVIGATION & CONTROLS BAR
       ========================================================================== */
    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-header-dark);
      color: var(--text-on-dark);
      border-bottom: 2px solid var(--border-grid);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      padding: 0.65rem 1rem;
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .nav-row-primary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-emblem {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .brand-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.16);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-control {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.42rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.18s ease;
    }

    .btn-control:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .btn-control:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    .btn-control:active {
      transform: translateY(0);
    }

    .btn-control.active {
      background: #ffffff;
      color: var(--bg-header-dark);
      border-color: #ffffff;
    }

    .nav-row-secondary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding-top: 0.55rem;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Month Selector Pills */
    .month-nav-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .month-pills-scroll {
      display: flex;
      align-items: center;
      gap: 0.28rem;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .month-pills-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .month-pills-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.35);
      border-radius: 999px;
    }

    .month-pill {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 500;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .month-pill:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .month-pill.active {
      background: #ffffff;
      color: var(--bg-header-dark);
      font-weight: 700;
      border-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Search & Filter Inputs */
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input,
    .filter-select {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      padding: 0.35rem 0.65rem;
      border-radius: 7px;
      outline: none;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .search-input:focus,
    .filter-select:focus {
      background: rgba(255, 255, 255, 0.24);
      border-color: #ffffff;
    }

    .filter-select option {
      background: #132540;
      color: #ffffff;
    }

    .clear-filter-btn {
      background: var(--red-accent);
      color: #ffffff;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.35rem 0.6rem;
      border-radius: 7px;
      cursor: pointer;
    }

    /* Search Result Status Banner */
    .filter-status-bar {
      max-width: 1200px;
      margin: 0.75rem auto 0;
      padding: 0.55rem 1rem;
      background: var(--bg-card);
      border: 1.5px solid var(--border-page);
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.82rem;
      box-shadow: var(--shadow-card);
    }

    .filter-status-bar.visible {
      display: flex;
    }

    /* ==========================================================================
       4. MAIN CALENDAR SHEET CONTAINER (A4 INSPIRED MODERN SHEET)
       ========================================================================== */
    .main-wrapper {
      max-width: 1200px;
      margin: 1.1rem auto 2.5rem;
      padding: 0 0.85rem;
    }

    .calendar-sheet {
      background: var(--bg-page);
      border: 2.5px solid var(--border-page);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      padding: 1.15rem;
      margin-bottom: 1.75rem;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .calendar-sheet.animate-in {
      animation: fadeSlideUp 0.28s ease forwards;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       5. SHEET TOP HEADER (4-COLUMN TRADITIONAL BOXES)
       ========================================================================== */
    .sheet-header-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr 1.25fr 1.35fr;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }

    @media (max-width: 820px) {
      .sheet-header-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .sheet-header-grid {
        grid-template-columns: 1fr;
      }
    }

    .header-box {
      background: var(--bg-card);
      border: 1.5px solid var(--border-page);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-box-label {
      background: var(--bg-header-dark);
      color: var(--text-on-dark);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.28rem 0.65rem;
      text-align: center;
    }

    .header-box-value {
      padding: 0.5rem 0.75rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .header-box-value .main-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .header-box-value .sub-val {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-top: 2px;
    }

    .header-box.masehi-box .header-box-label {
      background: var(--bg-header-mid);
    }

    .header-box.masehi-box .main-val {
      font-size: 1.38rem;
      letter-spacing: 0.03em;
      color: var(--bg-header-dark);
    }

    [data-theme="dark"] .header-box.masehi-box .main-val {
      color: #8ab8ff;
    }

    /* ==========================================================================
       6. CALENDAR GRID (JELO + 6 WUKU COLUMNS)
       ========================================================================== */
    .calendar-table-scroll {
      width: 100%;
      overflow-x: auto;
      border: 1.5px solid var(--border-page);
      border-radius: 10px;
      background: var(--bg-card);
      margin-bottom: 0.9rem;
    }

    .rowot-table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .rowot-table th,
    .rowot-table td {
      border: 1px solid var(--border-grid);
      vertical-align: top;
    }

    /* Wuku Header Row */
    .wuku-th {
      background: var(--bg-header-dark);
      color: var(--text-on-dark);
      padding: 0.45rem 0.35rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .jelo-corner-th {
      width: 13.5%;
      background: var(--bg-header-dark);
      color: var(--text-on-dark);
      padding: 0.45rem 0.4rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Engkal Sub-Header Row */
    .engkal-th {
      background: var(--bg-header-mid);
      color: var(--text-on-dark);
      padding: 0.26rem 0.3rem;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .engkal-label-th {
      background: var(--bg-header-mid);
      color: var(--text-on-dark);
      padding: 0.26rem 0.35rem;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      font-style: italic;
    }

    /* Jelo (Day of Week) Left Column */
    .jelo-cell {
      background: var(--bg-header-light);
      padding: 0.45rem 0.5rem;
      vertical-align: middle !important;
      text-align: center;
      font-weight: 700;
    }

    .jelo-name {
      display: block;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .jelo-arabic {
      display: block;
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .row-ahad .jelo-cell {
      background: var(--red-soft-bg);
    }

    .row-ahad .jelo-name,
    .row-ahad .jelo-arabic {
      color: var(--red-accent);
    }

    /* Date Cells */
    .date-cell {
      position: relative;
      height: 82px;
      padding: 0.35rem 0.45rem;
      background: var(--bg-cell-even);
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
      user-select: none;
    }

    .rowot-table tbody tr:nth-child(odd) .date-cell {
      background: var(--bg-cell-odd);
    }

    .date-cell:hover {
      background: var(--bg-cell-hover) !important;
      box-shadow: inset 0 0 0 2px var(--bg-header-dark);
      z-index: 2;
    }

    .date-cell.overflow-cell {
      background: var(--bg-cell-overflow) !important;
      opacity: 0.76;
    }

    .date-cell.overflow-cell:hover {
      opacity: 1;
    }

    /* Holiday / Adat / Search Highlight Styling */
    .date-cell.is-holiday-nasional {
      background: var(--red-soft-bg) !important;
    }

    .date-cell.is-holiday-adat {
      background: var(--adat-soft-bg) !important;
    }

    .date-cell.search-match {
      background: var(--highlight-bg) !important;
      box-shadow: inset 0 0 0 2.5px var(--highlight-ring) !important;
      z-index: 3;
    }

    .date-cell.search-dimmed {
      opacity: 0.38;
    }

    .date-cell.nage-highlight {
      box-shadow: inset 0 0 0 2.5px #10b981 !important;
      background: rgba(16, 185, 129, 0.14) !important;
    }

    /* Cell Inner Layout */
    .cell-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.25rem;
    }

    .cell-element {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.15;
      max-width: 68%;
    }

    .cell-hijri {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
      line-height: 1;
    }

    .cell-center-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.15rem 0;
    }

    .cell-masehi {
      font-size: 1.48rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-primary);
    }

    .cell-masehi.overflow-num {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .row-ahad .cell-masehi:not(.overflow-num),
    .cell-masehi.red-date {
      color: var(--red-accent);
    }

    .cell-masehi.adat-date {
      color: var(--adat-accent);
    }

    .cell-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
    }

    .cell-pasaran {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .cell-event-dot {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .dot-nasional {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-accent);
      display: inline-block;
    }

    .dot-adat {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--adat-accent);
      display: inline-block;
    }

    /* ==========================================================================
       7. BOTTOM CULTURAL & ASTRONOMICAL INFO GRID
       ========================================================================== */
    .bottom-info-grid {
      display: grid;
      grid-template-columns: 1.15fr 1.15fr 0.95fr;
      gap: 0.85rem;
      align-items: stretch;
    }

    @media (max-width: 960px) {
      .bottom-info-grid {
        grid-template-columns: 1fr 1fr;
      }
      .nage-column {
        grid-column: span 2;
      }
    }

    @media (max-width: 640px) {
      .bottom-info-grid {
        grid-template-columns: 1fr;
      }
      .nage-column {
        grid-column: span 1;
      }
    }

    .info-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .info-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-page);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .info-card-header {
      background: var(--bg-header-dark);
      color: var(--text-on-dark);
      padding: 0.38rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .info-card-body {
      padding: 0.6rem 0.75rem;
      font-size: 0.79rem;
      color: var(--text-primary);
      flex: 1;
    }

    .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .event-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      line-height: 1.35;
      padding: 0.2rem 0.3rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .event-list li:hover {
      background: var(--bg-header-light);
    }

    .event-date-tag {
      font-weight: 700;
      white-space: nowrap;
      color: var(--red-accent);
      min-width: 58px;
    }

    .event-date-tag.adat-tag {
      color: var(--adat-accent);
    }

    /* Jelo Solah Table */
    .jelo-solah-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
    }

    .jelo-solah-table th,
    .jelo-solah-table td {
      border: 1px solid var(--border-soft);
      padding: 0.32rem 0.45rem;
      text-align: left;
      vertical-align: top;
    }

    .jelo-solah-table th {
      background: var(--bg-header-light);
      color: var(--text-primary);
      font-weight: 700;
      width: 30%;
    }

    /* Legend & Mangse */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.45rem 0.7rem;
      background: var(--bg-header-light);
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

      padding: 0.32rem 0;
      border-bottom: 1px dashed var(--border-soft);
    }

      border-bottom: none;
      padding-bottom: 0;
    }

      font-weight: 700;
      color: var(--bg-header-dark);
    }

    [data-theme="dark"] .mangse-title {
      color: #8ab8ff;
    }

       8. INTERACTIVE NAGE COMPASS SVG

      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      gap: 0.45rem;
    }

    .nage-svg {
      width: 100%;
      max-width: 270px;
      height: auto;
      display: block;
    }

    .nage-sector-group {
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .nage-sector-group:hover .nage-dir-badge {
      fill: var(--red-accent);
    }

    .nage-hint {
      font-size: 0.71rem;
      color: var(--text-muted);
      text-align: center;
      font-style: italic;
    }

      margin-top: 0.85rem;
      padding-top: 0.55rem;
      border-top: 1.5px solid var(--border-soft);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;

      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }

    .detail-modal {
      background: var(--bg-page);
      border: 2px solid var(--border-page);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-modal);
      animation: popScale 0.22s ease;
    }

    @keyframes popScale {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      background: var(--bg-header-dark);
      color: #ffffff;
      padding: 0.9rem 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .modal-header-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-header-sub {
      font-size: 0.78rem;
      opacity: 0.88;
      margin-top: 2px;
    }

    .modal-close-btn {
      appearance: none;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .modal-body {
      padding: 1.1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .modal-kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .modal-kpi {
      background: var(--bg-card);
      border: 1px solid var(--border-grid);
      border-radius: 10px;
      padding: 0.55rem 0.75rem;
    }

    .modal-kpi-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .modal-kpi-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .modal-section-box {
      background: var(--bg-card);
      border: 1px solid var(--border-grid);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      font-size: 0.84rem;
    }

    .modal-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--bg-header-dark);
      margin-bottom: 0.35rem;
    }

    [data-theme="dark"] .modal-section-title {
      color: #8ab8ff;
    }

    .modal-badge-event {
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .modal-badge-event.nasional {
      background: var(--red-soft-bg);
      border: 1px solid var(--red-soft-border);
      color: var(--red-accent);
    }

    .modal-badge-event.adat {
      background: var(--adat-soft-bg);
      border: 1px solid var(--adat-soft-border);
      color: var(--adat-accent);
    }

    /* ==========================================================================
       10. PRINT STYLES (A4 OPTIMIZED)
       ========================================================================== */
    /* Keep the day column visible while the grid scrolls sideways */
    .jelo-corner-th,
    .engkal-label-th,
    .jelo-cell {
      position: sticky;
      left: 0;
      z-index: 2;
      box-shadow: 1px 0 0 var(--border-grid);
    }

    /* Small screens: the tall control bar would cover a third of the viewport, so let it scroll away */
    @media (max-width: 640px), (max-height: 520px) {
      .top-navbar {
        position: static;
      }
      .btn-control,
      .month-pill {
        min-height: 36px;
      }
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .top-navbar,
      .filter-status-bar,
      .modal-backdrop,
      .nage-hint {
        display: none !important;
      }
      .main-wrapper {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }
      .calendar-sheet {
        box-shadow: none !important;
        border-radius: 0 !important;
        page-break-after: always;
        break-after: page;
        margin-bottom: 0;
      }
      .calendar-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }

    /* ========================================================================
       THEME MANAGEMENT (LIGHT / DARK MODE WITH LOCALSTORAGE)
       ======================================================================== */
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      if (theme === "dark") {
        themeIcon.innerHTML = "&#9728;";
        themeLabel.textContent = "Terang";
      } else {
        themeIcon.innerHTML = "&#9790;";
        themeLabel.textContent = "Gelap";
      }
      try {
        localStorage.setItem("rowot_sasak_theme", theme);
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    (function initTheme() {
      let saved = "light";
      try {
        saved = localStorage.getItem("rowot_sasak_theme") || "light";
      } catch (e) {}
      applyTheme(saved);
    })();

    btnDarkMode.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    /* ========================================================================
       POPULATE MONTH PILLS & WUKU DROPDOWN
       ======================================================================== */
    function scrollToMonthSheet(idx) {
      const targetSheet = document.getElementById(`sheet-month-${idx}`);
      if (!targetSheet) return;

      // Temporarily lock scroll-spy updates so active chip does not flicker during smooth scroll
      state.isProgrammaticScroll = true;
      clearTimeout(state.scrollLockTimer);

      const navbar = document.querySelector(".top-navbar");
      const offset = (navbar ? navbar.offsetHeight : 96) + 12;
      const targetTop = targetSheet.getBoundingClientRect().top + window.scrollY - offset;

      window.scrollTo({
        top: Math.max(0, targetTop),
        behavior: "smooth"
      });

      state.scrollLockTimer = setTimeout(() => {
        state.isProgrammaticScroll = false;
      }, 750);
    }

    function initControls() {
      // Month pills
      MONTHS_DATA.forEach((m, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "month-pill" + (idx === state.currentMonthIdx ? " active" : "");
        btn.textContent = m.shortName;
        btn.title = `${m.name} 2020`;
        btn.dataset.monthIdx = idx;
        btn.addEventListener("click", () => {
          state.currentMonthIdx = idx;
          state.activeNageSector = null;
          updateNavState();
          if (state.viewMode === "single") {
            renderCalendars(true);
          } else {
            scrollToMonthSheet(idx);
          }
        });
        monthPillsContainer.appendChild(btn);
      });

      // Unique sorted Wukus across all 12 months
      const wukuSet = new Set();
      MONTHS_DATA.forEach(m => m.wukus.forEach(w => wukuSet.add(w)));
      Array.from(wukuSet).sort().forEach(w => {
        const opt = document.createElement("option");
        opt.value = w;
        opt.textContent = `Wuku: ${w}`;
        wukuFilter.appendChild(opt);
      });
    }

    function updateNavState() {
      const pills = monthPillsContainer.querySelectorAll(".month-pill");
      pills.forEach((pill, i) => {
        pill.classList.toggle("active", i === state.currentMonthIdx);
        if (i === state.currentMonthIdx) {
          pill.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        }
      });

      btnViewSingle.classList.toggle("active", state.viewMode === "single");
      btnViewAll.classList.toggle("active", state.viewMode === "all");
    }

    /* ========================================================================
       SEARCH & FILTER MATCHING HELPERS
       ======================================================================== */
    function isFilterActive() {
      return Boolean(state.searchQuery.trim() || state.pasaranFilter || state.wukuFilter);
    }

    function cellMatchesFilter(monthObj, cell) {
      if (!isFilterActive()) return false;

      if (state.pasaranFilter && cell.pasaran !== state.pasaranFilter) {
        return false;
      }

      if (state.wukuFilter && cell.wuku !== state.wukuFilter) {
        return false;
      }

      const q = state.searchQuery.trim().toLowerCase();
      if (q) {
        const relatedEvents = [
          ...monthObj.hariPentingSasak.filter(e => !cell.overflow && e.dayNum === cell.masehi).map(e => e.text),
          ...monthObj.hariPentingNasional.filter(e => !cell.overflow && e.dayNum === cell.masehi).map(e => e.text)
        ].join(" ").toLowerCase();

        const haystack = [
          String(cell.masehi),
          monthObj.name.toLowerCase(),
          cell.pasaran.toLowerCase(),
          cell.wuku.toLowerCase(),
          cell.engkal.toLowerCase(),
          cell.element.toLowerCase(),
          cell.jeloName.toLowerCase(),
          relatedEvents
        ].join(" ");

        if (!haystack.includes(q)) {
          return false;
        }
      }

      return true;
    }

    function updateFilterStatus() {
      const active = isFilterActive();
      btnClearFilters.style.display = active ? "inline-block" : "none";

      if (!active) {
        filterStatusBar.classList.remove("visible");
        firstMatchedMonthIdx = null;
        return;
      }

      let matchCount = 0;
      firstMatchedMonthIdx = null;

      MONTHS_DATA.forEach((m, mIdx) => {
        m.cells.forEach(row => {
          row.forEach(cell => {
            if (!cell.overflow && cellMatchesFilter(m, cell)) {
              matchCount++;
              if (firstMatchedMonthIdx === null) {
                firstMatchedMonthIdx = mIdx;
              }
            }
          });
        });
      });

      filterStatusBar.classList.add("visible");
      if (matchCount > 0) {
        filterStatusText.innerHTML = `Ditemukan <strong>${matchCount}</strong> tanggal yang cocok di tahun 2020 (pertama pada <strong>${MONTHS_DATA[firstMatchedMonthIdx].name} 2020</strong>).`;
        btnJumpFirstMatch.style.display = "inline-flex";
      } else {
        filterStatusText.innerHTML = `Tidak ditemukan tanggal yang cocok dengan kriteria pencarian.`;
        btnJumpFirstMatch.style.display = "none";
      }
    }

    /* ========================================================================
       SVG NAGE HARI COMPASS GENERATOR
       ======================================================================== */
    function renderNageCompassSVG(monthObj) {
      const nage = monthObj.nage;
      // 8 compass sectors: angle in degrees (0 = Top / Utara, clockwise)
      const sectors = [
        { key: "U",  angle: 0,   label: "U",  nums: nage.U },
        { key: "TL", angle: 45,  label: "TL", nums: nage.TL },
        { key: "T",  angle: 90,  label: "T",  nums: nage.T },
        { key: "TD", angle: 135, label: "TD", nums: nage.TD },
        { key: "S",  angle: 180, label: "S",  nums: nage.S },
        { key: "BD", angle: 225, label: "BD", nums: nage.BD },
        { key: "B",  angle: 270, label: "B",  nums: nage.B },
        { key: "BL", angle: 315, label: "BL", nums: nage.BL }
      ];

      const cx = 140;
      const cy = 140;
      const outerR = 124;
      const midR = 88;
      const innerR = 40;

      let spokesAndLabels = "";

      sectors.forEach(sec => {
        const rad = ((sec.angle - 90) * Math.PI) / 180;
        const dividerRad = ((sec.angle - 90 - 22.5) * Math.PI) / 180;

        // Divider spoke line
        const x1 = cx + innerR * Math.cos(dividerRad);
        const y1 = cy + innerR * Math.sin(dividerRad);
        const x2 = cx + outerR * Math.cos(dividerRad);
        const y2 = cy + outerR * Math.sin(dividerRad);

        spokesAndLabels += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--compass-line)" stroke-width="1.2" opacity="0.65" />`;

        // Direction badge position (inner ring)
        const dirR = 60;
        const dx = cx + dirR * Math.cos(rad);
        const dy = cy + dirR * Math.sin(rad);

        // Date numbers position (outer ring)
        const numR = 104;
        const nx = cx + numR * Math.cos(rad);
        const ny = cy + numR * Math.sin(rad);

        const isSelected =
          state.activeNageSector &&
          state.activeNageSector.monthIdx === monthObj.index &&
          state.activeNageSector.dirKey === sec.key;

        const badgeFill = isSelected ? "#10b981" : (sec.key === "U" ? "var(--red-accent)" : "var(--bg-header-dark)");

        // Format numbers into 2 compact lines if 4 items
        const numsText = sec.nums.join(", ");
        let tspanMarkup = "";
        if (sec.nums.length >= 4) {
          const firstTwo = sec.nums.slice(0, 2).join(",");
          const rest = sec.nums.slice(2).join(",");
          tspanMarkup = `
            <tspan x="${nx.toFixed(1)}" dy="-4">${firstTwo}</tspan>
            <tspan x="${nx.toFixed(1)}" dy="11">${rest}</tspan>
          `;
        } else {
          tspanMarkup = `<tspan x="${nx.toFixed(1)}" dy="3">${numsText}</tspan>`;
        }

        spokesAndLabels += `
          <g class="nage-sector-group" data-month="${monthObj.index}" data-dir="${sec.key}">
            <circle class="nage-dir-badge" cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="13" fill="${badgeFill}" />
            <text x="${dx.toFixed(1)}" y="${(dy + 3.5).toFixed(1)}" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9.5" font-weight="700">${sec.label}</text>
            <text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" fill="var(--compass-text)" font-family="Noto Serif, serif" font-size="9.5" font-weight="700">
              ${tspanMarkup}
            </text>
          </g>
        `;
      });

      return `
        <svg class="nage-svg" viewBox="0 0 280 280" role="img" aria-label="Kompas Nage Hari Bulan ${monthObj.name} 2020">
          <!-- Outer & Inner Concentric Circles -->
          <circle cx="${cx}" cy="${cy}" r="${outerR}" fill="var(--compass-bg)" stroke="var(--compass-line)" stroke-width="2.2" />
          <circle cx="${cx}" cy="${cy}" r="${midR}" fill="none" stroke="var(--compass-line)" stroke-width="1.2" stroke-dasharray="3 2" />
          <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="var(--bg-header-dark)" stroke="var(--compass-line)" stroke-width="2" />

          ${spokesAndLabels}

          <!-- Center Emblem -->
          <text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.06em">NAGE</text>
          <text x="${cx}" y="${cy + 9}" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" opacity="0.9">HARI</text>
        </svg>
      `;
    }

    /* ========================================================================
       RENDER SINGLE MONTH SHEET
       ======================================================================== */
    function renderMonthSheet(monthObj, animate = false) {
      const filterOn = isFilterActive();

      // Build Wuku Header Columns
      const wukuHeadersHTML = monthObj.wukus
        .map(w => `<th class="wuku-th" scope="col">${w}</th>`)
        .join("");

      // Build Engkal Subheader Columns
      const engkalHeadersHTML = ENGKAL_HEADERS
        .map(e => `<th class="engkal-th" scope="col">${e}</th>`)
        .join("");

      // Build 7 Rows (Ahad .. Saptu)
      const bodyRowsHTML = JELO_LIST.map((jelo, jeloIdx) => {
        const rowCells = monthObj.cells[jeloIdx]
          .map((cell, wukuIdx) => {
            const classes = ["date-cell"];
            if (cell.overflow) classes.push("overflow-cell");
            if (cell.isNasional && !cell.overflow) classes.push("is-holiday-nasional");
            if (cell.isAdat && !cell.overflow) classes.push("is-holiday-adat");

            if (filterOn) {
              if (!cell.overflow && cellMatchesFilter(monthObj, cell)) {
                classes.push("search-match");
              } else {
                classes.push("search-dimmed");
              }
            }

            // Nage sector highlight check
            if (
              state.activeNageSector &&
              state.activeNageSector.monthIdx === monthObj.index &&
              !cell.overflow
            ) {
              const targetNums = monthObj.nage[state.activeNageSector.dirKey] || [];
              if (targetNums.includes(cell.masehi)) {
                classes.push("nage-highlight");
              }
            }

            const numClasses = ["cell-masehi"];
            if (cell.overflow) {
              numClasses.push("overflow-num");
            } else if (cell.isNasional || jelo.isSunday) {
              numClasses.push("red-date");
            } else if (cell.isAdat) {
              numClasses.push("adat-date");
            }

            const dotsHTML = !cell.overflow
              ? `<span class="cell-event-dot">
                  ${cell.isNasional ? '<span class="dot-nasional" title="Hari Libur Nasional"></span>' : ""}
                  ${cell.isAdat ? '<span class="dot-adat" title="Hari Penting Adat / Islam Sasak"></span>' : ""}
                </span>`
              : "";

            return `
              <td
                class="${classes.join(" ")}"
                data-month="${monthObj.index}"
                data-jelo="${jeloIdx}"
                data-wuku="${wukuIdx}"
                tabindex="0"
                role="button"
                aria-label="${jelo.name} ${cell.pasaran}, ${cell.masehi} ${monthObj.name} 2020, Wuku ${cell.wuku}"
              >
                <div class="cell-top-row">
                  <span class="cell-element">${cell.element}</span>
                  <span class="cell-hijri arabic">${cell.hijri}</span>
                </div>
                <div class="cell-center-row">
                  <span class="${numClasses.join(" ")}">${cell.masehi}</span>
                </div>
                <div class="cell-bottom-row">
                  <span class="cell-pasaran">${cell.pasaran}</span>
                  ${dotsHTML}
                </div>
              </td>
            `;
          })
          .join("");

        return `
          <tr class="${jelo.isSunday ? "row-ahad" : ""}">
            <th class="jelo-cell" scope="row">
              <span class="jelo-name">${jelo.name}</span>
              <span class="jelo-arabic arabic">${jelo.arabic}</span>
            </th>
            ${rowCells}
          </tr>
        `;
      }).join("");

      // Hari Penting Sasak/Islam List
      const sasakEventsHTML = monthObj.hariPentingSasak
        .map(
          ev => `
          <li data-month="${monthObj.index}" data-day="${ev.dayNum}">
            <span class="event-date-tag ${ev.type === "adat" ? "adat-tag" : ""}">${ev.dateStr}</span>
            <span>${ev.text}</span>
          </li>
        `
        )
        .join("");

      // Hari Penting Nasional List
      const nasionalEventsHTML = monthObj.hariPentingNasional
        .map(
          ev => `
          <li data-month="${monthObj.index}" data-day="${ev.dayNum}">
            <span class="event-date-tag">${ev.dateStr}</span>
            <span>${ev.text}</span>
          </li>
        `
        )
        .join("");

      // Jelo Solah Rows
      const jeloSolahRowsHTML = JELO_SOLAH_SHARED.map(
        row => `
        <tr>
          <th>${row.wuku}</th>
          <td>${row.desc}</td>
        </tr>
      `
      ).join("");

      // Mangse Items
      const mangseHTML = monthObj.mangse
        .map(
          mg => `
          <div class="mangse-item">
            <div class="mangse-title">${mg.title}</div>
            <div>${mg.desc}</div>
          </div>
        `
        )
        .join("");

      return `
        <article class="calendar-sheet ${animate ? "animate-in" : ""}" id="sheet-month-${monthObj.index}">
          <!-- Top 4-Box Header -->
          <div class="sheet-header-grid">
            <div class="header-box">
              <div class="header-box-label">Tahun / Windu</div>
              <div class="header-box-value">
                <div class="main-val">${monthObj.tahunWindu.main}</div>
                <div class="sub-val">${monthObj.tahunWindu.sub}</div>
              </div>
            </div>

            <div class="header-box">
              <div class="header-box-label">Kale / Bulan Sasak</div>
              <div class="header-box-value">
                <div class="main-val">${monthObj.kaleSasak.main}</div>
                <div class="sub-val">${monthObj.kaleSasak.sub}</div>
              </div>
            </div>

            <div class="header-box">
              <div class="header-box-label">Tahun / Bulan Hijriyah</div>
              <div class="header-box-value">
                <div class="main-val">${monthObj.hijriyah.main}</div>
                <div class="sub-val">${monthObj.hijriyah.sub}</div>
              </div>
            </div>

            <div class="header-box masehi-box">
              <div class="header-box-label">Bulan / Tahun Masehi</div>
              <div class="header-box-value">
                <div class="main-val">${monthObj.name} ${monthObj.yearMasehi}</div>
                <div class="sub-val">Kalender Rowot Sasak</div>
              </div>
            </div>
          </div>

          <!-- Main Wuku & Jelo Calendar Table -->
          <div class="calendar-table-scroll">
            <table class="rowot-table">
              <thead>
                <tr>
                  <th class="jelo-corner-th" scope="col">Jelo / Wuku</th>
                  ${wukuHeadersHTML}
                </tr>
                <tr>
                  <th class="engkal-label-th" scope="col">Engkal &rarr;</th>
                  ${engkalHeadersHTML}
                </tr>
              </thead>
              <tbody>
                ${bodyRowsHTML}
              </tbody>
            </table>
          </div>

          <!-- Legend Bar -->
          <div class="legend-bar" style="margin-bottom: 0.85rem;">
            <span class="legend-item"><span class="legend-swatch" style="background: var(--red-accent);"></span> Ahad &amp; Libur Nasional</span>
            <span class="legend-item"><span class="legend-swatch" style="background: var(--adat-accent);"></span> Hari Penting Adat / Islam Sasak</span>
            <span class="legend-item"><span class="legend-swatch" style="background: var(--bg-cell-overflow); border: 1px solid var(--border-grid);"></span> Tanggal Lintas Bulan</span>
            <span class="legend-item" style="margin-left:auto; color: var(--text-muted); font-weight:500;">Klik kotak tanggal untuk detail lengkap</span>
          </div>

          <!-- Bottom 3-Column Cultural & Astronomical Information -->
          <div class="bottom-info-grid">
            <!-- Column 1: Hari Penting Sasak/Islam & Kale Bulan -->
            <div class="info-stack">
              <div class="info-card">
                <div class="info-card-header">
                  <span>Hari Penting Sasak &amp; Islam</span>
                </div>
                <div class="info-card-body">
                  <ul class="event-list">
                    ${sasakEventsHTML}
                  </ul>
                </div>
              </div>

              <div class="info-card">
                <div class="info-card-header">
                  <span>Keterangan Kale Bulan</span>
                </div>
                <div class="info-card-body">
                  ${monthObj.kaleBulan}
                </div>
              </div>

              <div class="info-card">
                <div class="info-card-header">
                  <span>Hari Penting Nasional</span>
                </div>
                <div class="info-card-body">
                  <ul class="event-list">
                    ${nasionalEventsHTML}
                  </ul>
                </div>
              </div>
            </div>

            <!-- Column 2: Jelo Solah & Mangse -->
            <div class="info-stack">
              <div class="info-card">
                <div class="info-card-header">
                  <span>Jelo Solah (Hari Baik Berdasarkan Wuku)</span>
                </div>
                <div class="info-card-body" style="padding: 0;">
                  <table class="jelo-solah-table">
                    <tbody>
                      ${jeloSolahRowsHTML}
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="info-card">
                <div class="info-card-header">
                  <span>Mangse (Pranata Musim Sasak)</span>
                </div>
                <div class="info-card-body">
                  ${mangseHTML}
                </div>

            </div>

            <!-- Column 3: Nage Hari Compass -->
            <div class="nage-column">
              <div class="info-card nage-card">
                <div class="info-card-header">
                  <span>Nage Hari (${monthObj.name})</span>
                </div>
                <div class="info-card-body nage-container">
                  ${renderNageCompassSVG(monthObj)}
                  <div class="nage-hint">
                    Klik arah mata angin (U, TL, T, TD, S, BD, B, BL) untuk menyoroti tanggal terkait pada tabel.
                  </div>

            </div>

          <!-- Traditional Attribution Footer -->
          <footer class="sheet-footer">

            </div>

            </div>

      `;

    /* ========================================================================
       MAIN RENDER ORCHESTRATOR
       ======================================================================== */
    function setupMonthScrollObserver() {
      if (monthObserver) {
        monthObserver.disconnect();
        monthObserver = null;
      }

      if (state.viewMode !== "all") return;

      const navbar = document.querySelector(".top-navbar");
      const topOffset = (navbar ? navbar.offsetHeight : 96) + 24;

      monthObserver = new IntersectionObserver(
        entries => {
          if (state.isProgrammaticScroll || state.viewMode !== "all") return;

          // Pick the intersecting month sheet closest to the top reading band
          let bestCandidate = null;
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const dist = Math.abs(entry.boundingClientRect.top - topOffset);
              if (!bestCandidate || dist < bestCandidate.dist) {
                bestCandidate = {
                  idx: Number(entry.target.dataset.monthIndex),
                  dist
                };
              }
            }
          });

          if (bestCandidate && bestCandidate.idx !== state.currentMonthIdx) {
            state.currentMonthIdx = bestCandidate.idx;
            updateNavState();
          }
        },
        {
          root: null,
          rootMargin: `-${topOffset}px 0px -55% 0px`,
          threshold: [0, 0.15, 0.35]
        }
      );

      calendarContainer.querySelectorAll(".calendar-sheet").forEach((sheetEl, idx) => {
        sheetEl.dataset.monthIndex = idx;
        monthObserver.observe(sheetEl);
      });
    }

    function renderCalendars(animate = false) {
      updateFilterStatus();

      if (state.viewMode === "single") {
        const monthObj = MONTHS_DATA[state.currentMonthIdx];
        calendarContainer.innerHTML = renderMonthSheet(monthObj, animate);
      } else {
        calendarContainer.innerHTML = MONTHS_DATA.map(m => renderMonthSheet(m, false)).join("");
      }

      attachSheetEventListeners();
      setupMonthScrollObserver();
    }

    /* ========================================================================
       ATTACH INTERACTIVE EVENTS TO CELLS, NAGE COMPASS, AND EVENT LISTS
       ======================================================================== */
    function attachSheetEventListeners() {
      // 1. Date cells click / Enter key
      calendarContainer.querySelectorAll(".date-cell").forEach(td => {
        const openHandler = () => {
          const mIdx = Number(td.dataset.month);
          const jIdx = Number(td.dataset.jelo);
          const wIdx = Number(td.dataset.wuku);
          openCellDetailModal(mIdx, jIdx, wIdx);
        };
        td.addEventListener("click", openHandler);
        td.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openHandler();
          }
        });
      });

      // 2. Nage Compass sector click
      calendarContainer.querySelectorAll(".nage-sector-group").forEach(g => {
        g.addEventListener("click", () => {
          const mIdx = Number(g.dataset.month);
          const dirKey = g.dataset.dir;
          if (
            state.activeNageSector &&
            state.activeNageSector.monthIdx === mIdx &&
            state.activeNageSector.dirKey === dirKey
          ) {
            state.activeNageSector = null;
          } else {
            state.activeNageSector = { monthIdx: mIdx, dirKey };
          }
          renderCalendars(false);
        });
      });

      // 3. Event list items click -> opens corresponding date modal
      calendarContainer.querySelectorAll(".event-list li[data-day]").forEach(li => {
        li.addEventListener("click", () => {
          const mIdx = Number(li.dataset.month);
          const dayNum = Number(li.dataset.day);
          const monthObj = MONTHS_DATA[mIdx];
          for (let j = 0; j < 7; j++) {
            for (let w = 0; w < 6; w++) {
              const c = monthObj.cells[j][w];
              if (!c.overflow && c.masehi === dayNum) {
                openCellDetailModal(mIdx, j, w);
                return;
              }
            }
          }
        });
      });
    }

    /* ========================================================================
       INTERACTIVE CELL DETAIL MODAL
       ======================================================================== */
    function findNageDirectionForDate(monthObj, dayNum) {
      for (const [dirKey, nums] of Object.entries(monthObj.nage)) {
        if (nums.includes(dayNum)) {
          return NAGE_DIRECTIONS[dirKey];
        }
      }
      return null;
    }

    function findJeloSolahForWuku(wukuName) {
      const found = JELO_SOLAH_SHARED.find(item =>
        item.wuku.toLowerCase().includes(wukuName.toLowerCase())
      );
      return found ? found.desc : JELO_SOLAH_SHARED[0].desc;
    }

    function openCellDetailModal(monthIdx, jeloIdx, wukuIdx) {
      const monthObj = MONTHS_DATA[monthIdx];
      const cell = monthObj.cells[jeloIdx][wukuIdx];

      const monthDisplayName = cell.overflow
        ? `${monthObj.name} 2020 (Lintas Bulan)`
        : `${monthObj.name} 2020`;

      modalTitle.textContent = `${cell.jeloName} ${cell.pasaran}, ${cell.masehi} ${monthDisplayName}`;
      modalSubtitle.innerHTML = `Tahun ${monthObj.tahunWindu.main} (${monthObj.tahunWindu.sub}) &bull; Kale ${monthObj.kaleSasak.main}`;

      // Matching events on this date
      const matchingEvents = [];
      if (!cell.overflow) {
        monthObj.hariPentingSasak.forEach(ev => {
          if (ev.dayNum === cell.masehi) matchingEvents.push(ev);
        });
        monthObj.hariPentingNasional.forEach(ev => {
          if (ev.dayNum === cell.masehi && ev.dateStr !== "—") matchingEvents.push(ev);
        });
      }

      const eventsMarkup = matchingEvents.length
        ? matchingEvents
            .map(
              ev => `
              <div class="modal-badge-event ${ev.type === "nasional" ? "nasional" : "adat"}">
                ${ev.text}
              </div>
            `
            )
            .join("")
        : "";

      const nageInfo = !cell.overflow ? findNageDirectionForDate(monthObj, cell.masehi) : null;
      const jeloSolahDesc = findJeloSolahForWuku(cell.wuku);

      modalBody.innerHTML = `
        ${eventsMarkup}

        <div class="modal-kpi-grid">
          <div class="modal-kpi">
            <div class="modal-kpi-label">Tanggal Masehi</div>
            <div class="modal-kpi-val">${cell.jeloName}, ${cell.masehi} ${monthObj.name} 2020</div>
          </div>

          <div class="modal-kpi">
            <div class="modal-kpi-label">Tanggal Hijriyah</div>
            <div class="modal-kpi-val"><span class="arabic" style="font-size:1.1rem;">${cell.hijri}</span> (${monthObj.hijriyah.sub})</div>
          </div>

          <div class="modal-kpi">
            <div class="modal-kpi-label">Pasaran &amp; Jelo</div>
            <div class="modal-kpi-val">${cell.jeloName} (${cell.jeloArabic}) &bull; ${cell.pasaran}</div>
          </div>

          <div class="modal-kpi">
            <div class="modal-kpi-label">Wuku &amp; Engkal</div>
            <div class="modal-kpi-val">Wuku ${cell.wuku} &bull; ${cell.engkal}</div>
          </div>

          <div class="modal-kpi">
            <div class="modal-kpi-label">Pepaesan / Unsur</div>
            <div class="modal-kpi-val">${cell.element}</div>
          </div>

          <div class="modal-kpi">
            <div class="modal-kpi-label">Nage Hari</div>
            <div class="modal-kpi-val">${nageInfo ? nageInfo.label : "Lintas Bulan"}</div>
          </div>
        </div>

        <div class="modal-section-box">
          <div class="modal-section-title">Watak Jelo Solah (Wuku ${cell.wuku})</div>
          <div>${jeloSolahDesc}</div>
        </div>

        ${
          nageInfo
            ? `<div class="modal-section-box">
                <div class="modal-section-title">Petunjuk Nage Hari — ${nageInfo.label}</div>
                <div>${nageInfo.meaning}</div>
              </div>`
            : ""
        }

        <div class="modal-section-box">
          <div class="modal-section-title">Mangse Bulan ${monthObj.name}</div>
          ${monthObj.mangse.map(m => `<div style="margin-bottom:4px;"><strong>${m.title}:</strong> ${m.desc}</div>`).join("")}
        </div>
      `;

      dateModalBackdrop.classList.add("open");
      btnCloseModal.focus();
    }

    function closeCellDetailModal() {
      dateModalBackdrop.classList.remove("open");
    }

    /* ========================================================================
       NAVIGATION, KEYBOARD SHORTCUTS & FILTER LISTENERS
       ======================================================================== */
    btnPrevMonth.addEventListener("click", () => {
      state.currentMonthIdx = (state.currentMonthIdx - 1 + 12) % 12;

    btnNextMonth.addEventListener("click", () => {

      state.activeNageSector = null;
      updateNavState();
      if (state.viewMode === "single") {
        renderCalendars(true);
      } else {
        scrollToMonthSheet(state.currentMonthIdx);
      }
    });

    btnViewSingle.addEventListener("click", () => {
      state.viewMode = "single";
      updateNavState();
      renderCalendars(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    btnViewAll.addEventListener("click", () => {
      state.viewMode = "all";
      updateNavState();
      renderCalendars(false);
      if (state.currentMonthIdx > 0) {
        scrollToMonthSheet(state.currentMonthIdx);
      }
    });

    btnPrint.addEventListener("click", () => {
      window.print();
    });

    searchInput.addEventListener("input", e => {
      state.searchQuery = e.target.value;
      renderCalendars(false);
    });

    pasaranFilter.addEventListener("change", e => {
      state.pasaranFilter = e.target.value;
      renderCalendars(false);
    });

    wukuFilter.addEventListener("change", e => {
      state.wukuFilter = e.target.value;
      renderCalendars(false);
    });

    btnClearFilters.addEventListener("click", () => {
      state.searchQuery = "";
      state.pasaranFilter = "";
      state.wukuFilter = "";
      state.activeNageSector = null;
      searchInput.value = "";
      pasaranFilter.value = "";
      wukuFilter.value = "";
      renderCalendars(false);
    });

    btnJumpFirstMatch.addEventListener("click", () => {
      if (firstMatchedMonthIdx !== null) {
        state.currentMonthIdx = firstMatchedMonthIdx;
        updateNavState();
        if (state.viewMode === "single") {
          renderCalendars(true);
        } else {
          scrollToMonthSheet(firstMatchedMonthIdx);
        }
      }
    });

    // Modal closing
    btnCloseModal.addEventListener("click", closeCellDetailModal);
    dateModalBackdrop.addEventListener("click", e => {
      if (e.target === dateModalBackdrop) {
        closeCellDetailModal();
      }
    });

    // Keyboard shortcuts (Escape closes modal, Left/Right arrows switch month in single view)
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && dateModalBackdrop.classList.contains("open")) {
        closeCellDetailModal();
        return;
      }

      if (
        dateModalBackdrop.classList.contains("open") ||
        document.activeElement === searchInput ||
        document.activeElement === pasaranFilter ||
        document.activeElement === wukuFilter
      ) {
        return;
      }

      if (state.viewMode === "single") {
        if (e.key === "ArrowLeft") {
          btnPrevMonth.click();
        } else if (e.key === "ArrowRight") {
          btnNextMonth.click();
        }
      }
    });

    // Bootstrap Application
    initControls();
    renderCalendars(true);

    /* ========================================================================
       DIRECT PDF DOWNLOAD (jsPDF, vector A4 portrait, one page per month)
       ======================================================================== */
    async function exportRowotPDF() {
      const btn = document.getElementById("btnPdf");
      const label = btn ? btn.querySelector(".pdf-label") : null;
      if (!window.jspdf) {
        if (label) { label.textContent = "Pustaka PDF belum siap"; setTimeout(() => { label.textContent = "PDF"; }, 2200); }
        return;
      }
      if (btn) btn.disabled = true;
      if (label) label.textContent = "Menyusun…";
      await new Promise(r => setTimeout(r, 30)); // let the label repaint
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });
        const W = 210, H = 297, M = 10, CW = W - 2 * M;
        const AR = "٠١٢٣٤٥٦٧٨٩";
        const lat = s => String(s == null ? "" : s)
          .replace(/[٠-٩]/g, d => AR.indexOf(d))
          .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
          .replace(/[^\x20-\x7E -ÿ–—•…]/g, "");
        const C = {
          dark: [58, 107, 166], mid: [70, 121, 180], light: [227, 236, 248],
          even: [245, 249, 255], odd: [233, 241, 251], over: [220, 230, 244],
          grid: [137, 170, 211], soft: [184, 205, 232],
          ink: [19, 37, 64], sec: [46, 75, 115], muted: [90, 116, 150],
          red: [196, 74, 69], redBg: [253, 234, 234], green: [44, 110, 73], greenBg: [230, 244, 236],
          white: [255, 255, 255], faint: [160, 178, 204]
        };
        const fill = c => doc.setFillColor(c[0], c[1], c[2]);
        const draw = c => doc.setDrawColor(c[0], c[1], c[2]);
        const ink = c => doc.setTextColor(c[0], c[1], c[2]);
        const font = (st, sz) => { doc.setFont("helvetica", st); doc.setFontSize(sz); };
        const year = MONTHS_DATA[0].yearMasehi;

        const wrapBlock = (x, y, w, lines, size, color, lead, limit) => {
          font("normal", size); ink(color);
          for (const ln of lines) {
            const parts = doc.splitTextToSize(lat(ln), w);
            for (const p of parts) {
              if (y + lead > limit) return y;
              doc.text(p, x, y);
              y += lead;
            }
          }
          return y;
        };
        const heading = (txt, x, y, w) => {
          font("bold", 7.2); ink(C.white);
          fill(C.dark); doc.roundedRect(x, y, w, 5.2, 1, 1, "F");
          doc.text(lat(txt).toUpperCase(), x + 2, y + 3.7);
          return y + 8;
        };

        MONTHS_DATA.forEach((m, mi) => {
          if (mi > 0) doc.addPage();
          const wuk = m.wukus;
          const eng = m.engkals || ENGKAL_HEADERS;

          /* --- title bar --- */
          fill(C.dark); doc.rect(0, 0, W, 24, "F");
          font("normal", 8); ink([214, 230, 250]);
          doc.text("KALENDER ROWOT SASAK  •  ALMANAK TRADISIONAL SASAK, LOMBOK", M, 8);
          font("bold", 22); ink(C.white);
          doc.text(lat(m.name) + " " + m.yearMasehi, M, 19);

          /* --- four info boxes --- */
          const boxes = [
            ["TAHUN / WINDU", m.tahunWindu.main, m.tahunWindu.sub],
            ["KALE / BULAN SASAK", m.kaleSasak.main, m.kaleSasak.sub],
            ["TAHUN / BULAN HIJRIYAH", m.hijriyah.main, m.hijriyah.sub],
            ["BULAN / TAHUN MASEHI", m.name + " " + m.yearMasehi, "Kalender Rowot Sasak"]
          ];
          const gap = 2.5, bw = (CW - gap * 3) / 4;
          boxes.forEach((b, i) => {
            const x = M + i * (bw + gap), y = 28;
            fill(C.even); draw(C.dark); doc.setLineWidth(0.4); doc.roundedRect(x, y, bw, 19, 1.6, 1.6, "FD");
            fill(C.dark); doc.roundedRect(x, y, bw, 5, 1.6, 1.6, "F"); doc.rect(x, y + 2.5, bw, 2.5, "F");
            font("bold", 5.6); ink(C.white); doc.text(b[0], x + bw / 2, y + 3.5, { align: "center" });
            font("bold", 9); ink(C.ink);
            const main = doc.splitTextToSize(lat(b[1]), bw - 3)[0];
            doc.text(main, x + bw / 2, y + 11, { align: "center" });
            font("normal", 6.2); ink(C.muted);
            doc.text(doc.splitTextToSize(lat(b[2]), bw - 3)[0], x + bw / 2, y + 16, { align: "center" });
          });

          /* --- calendar grid --- */
          const gx = M, gy = 51, jw = 22, cw = (CW - jw) / 6, hh = 8, eh = 5.4, rh = 21.5;
          doc.setLineWidth(0.2); draw(C.grid);
          fill(C.dark); doc.rect(gx, gy, jw, hh + eh, "F");
          font("bold", 7); ink(C.white);
          doc.text("Jelo / Wuku", gx + jw / 2, gy + 6.2, { align: "center" });
          wuk.forEach((w, c) => {
            const x = gx + jw + c * cw;
            fill(C.dark); doc.rect(x, gy, cw, hh, "FD");
            font("bold", 7.2); ink(C.white);
            doc.text(doc.splitTextToSize(lat(w), cw - 2)[0], x + cw / 2, gy + 5.4, { align: "center" });
            fill(C.mid); doc.rect(x, gy + hh, cw, eh, "FD");
            font("normal", 6); ink(C.white); doc.text(lat(eng[c]), x + cw / 2, gy + hh + 3.8, { align: "center" });
          });
          font("italic", 5.6); ink(C.white); doc.text("Engkal", gx + jw / 2, gy + hh + 3.8, { align: "center" });
          const by = gy + hh + eh;
          m.cells.forEach((row, r) => {
            const y = by + r * rh, sun = r === 0;
            fill(sun ? C.redBg : C.light); draw(C.grid); doc.rect(gx, y, jw, rh, "FD");
            font("bold", 9); ink(sun ? C.red : C.ink);
            doc.text(lat(JELO_LIST[r].name), gx + jw / 2, y + rh / 2 + 1.2, { align: "center" });
            row.forEach((cell, c) => {
              const x = gx + jw + c * cw;
              const bg = cell.overflow ? C.over : (cell.isNasional ? C.redBg : ((r + c) % 2 ? C.odd : C.even));
              fill(bg); draw(C.grid); doc.rect(x, y, cw, rh, "FD");
              const red = !cell.overflow && (sun || cell.isNasional);
              font("bold", 16.5); ink(cell.overflow ? C.faint : (red ? C.red : C.ink));
              doc.text(String(cell.masehi), x + 2.4, y + 9.2);
              font("normal", 7.2); ink(cell.overflow ? C.faint : C.muted);
              doc.text(lat(cell.hijri), x + cw - 2, y + 5, { align: "right" });
              font("italic", 6.4); ink(cell.overflow ? C.faint : C.sec);
              doc.text(lat(cell.element), x + 2.4, y + 14.4);
              font("bold", 7.6); ink(cell.overflow ? C.faint : C.ink);
              doc.text(lat(cell.pasaran), x + 2.4, y + 19.0);
              if (!cell.overflow && cell.isAdat) { fill(C.green); doc.circle(x + cw - 3.4, y + rh - 3.6, 1.2, "F"); }
            });
          });
          const gridEnd = by + 7 * rh;
          // outer frame
          draw(C.dark); doc.setLineWidth(0.5); doc.rect(gx, gy, CW, gridEnd - gy);

          /* --- bottom: three columns --- */
          const colW = (CW - 2 * 4) / 3, top = gridEnd + 5, limit = H - 12;
          const x1 = M, x2 = M + colW + 4, x3 = M + 2 * (colW + 4);

          let y = heading("Hari Penting Sasak / Islam", x1, top, colW);
          const sas = m.hariPentingSasak.length ? m.hariPentingSasak.map(e => e.dateStr + " - " + e.text) : ["-"];
          y = wrapBlock(x1 + 1, y, colW - 2, sas, 7.0, C.ink, 3.3, limit);
          y = heading("Kale Bulan", x1, y + 1.5, colW);
          wrapBlock(x1 + 1, y, colW - 2, [m.kaleBulan], 6.9, C.sec, 3.2, limit);

          y = heading("Hari Penting Nasional", x2, top, colW);
          const nas = m.hariPentingNasional.length ? m.hariPentingNasional.map(e => e.dateStr + " - " + e.text) : ["-"];
          y = wrapBlock(x2 + 1, y, colW - 2, nas, 7.0, C.ink, 3.3, limit);
          y = heading("Mangse (Musim)", x2, y + 1.5, colW);
          m.mangse.forEach(s => {
            y = wrapBlock(x2 + 1, y, colW - 2, [s.title], 7.0, C.ink, 3.3, limit);
            y = wrapBlock(x2 + 1, y, colW - 2, [s.desc], 6.4, C.muted, 3.0, limit) + 1;
          });

          /* --- nage compass --- */
          y = heading("Nage Hari", x3, top, colW);
          const cx = x3 + colW / 2, cy = y + 21.5, R = 16.5;
          draw(C.dark); doc.setLineWidth(0.4); fill(C.even); doc.circle(cx, cy, R + 4.5, "FD");
          fill(C.white); doc.circle(cx, cy, R, "FD");
          draw(C.soft); doc.setLineWidth(0.2); doc.circle(cx, cy, R * 0.55, "S");
          const dirs = [["U", 0], ["TL", 45], ["T", 90], ["TD", 135], ["S", 180], ["BD", 225], ["B", 270], ["BL", 315]];
          dirs.forEach(([k, deg]) => {
            const a = deg * Math.PI / 180, sx = Math.sin(a), sy = -Math.cos(a);
            draw(C.soft); doc.line(cx, cy, cx + sx * R, cy + sy * R);
            font("bold", 7); ink(C.dark);
            doc.text(k, cx + sx * (R + 2.7), cy + sy * (R + 2.7) + 1, { align: "center" });
            const ds = (m.nage[k] || []).join(",");
            font("bold", 5.6); ink(C.ink);
            doc.text(ds, cx + sx * (R * 0.76), cy + sy * (R * 0.76) + 0.8, { align: "center" });
          });
          fill(C.dark); doc.circle(cx, cy, 1.6, "F");
          // legend
          let ly = cy + R + 8.2;
          fill(C.redBg); draw(C.red); doc.setLineWidth(0.2); doc.rect(x3 + 2, ly - 2.4, 4, 3, "FD");
          font("normal", 6.4); ink(C.ink); doc.text("Libur Nasional", x3 + 8, ly); ly += 4.4;
          fill(C.green); doc.circle(x3 + 4, ly - 0.9, 1.15, "F");
          doc.text("Hari Penting Adat / Islam Sasak", x3 + 8, ly); ly += 4.4;
          fill(C.over); draw(C.grid); doc.rect(x3 + 2, ly - 2.4, 4, 3, "FD");
          doc.text("Tanggal lintas bulan", x3 + 8, ly);

          /* --- footer --- */
          font("normal", 6.4); ink(C.muted);
          doc.text("Kalender Rowot Sasak " + year + "  •  Warisan Kearifan Astronomi Tradisional Lombok  •  affandymurad.github.io/rowot/" + year, M, H - 6);
          doc.text((mi + 1) + " / " + MONTHS_DATA.length, W - M, H - 6, { align: "right" });
        });

        doc.setProperties({ title: "Kalender Rowot Sasak " + year, author: "Affandy Murad", subject: "Kalender tradisional Sasak" });
        doc.save("kalender-rowot-sasak-" + year + ".pdf");
      } catch (err) {
        console.error(err);
        if (label) label.textContent = "Gagal, coba lagi";
        setTimeout(() => { if (label) label.textContent = "PDF"; }, 2200);
        if (btn) btn.disabled = false;
        return;
      }
      if (label) label.textContent = "PDF";
      if (btn) btn.disabled = false;
    }
    document.getElementById("btnPdf")?.addEventListener("click", exportRowotPDF);
  </script>
