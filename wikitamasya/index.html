<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikitamasya — Trip Planner · Wikidata, Wikipedia &amp; Wikivoyage</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#f3f6fc; --surface:#fff; --ink:#0c1a36; --muted:#526080; --line:#dde4f1; --brand:#2d4f9c; --brand-2:#5278d0; --soft:#eaeff9;
  --zebra:#f6f8fd; --ok:#198754; --danger:#c62f3d; --warn-bg:#fff3e0; --warn-ink:#92400e; --accent:#ff7a1a;
  --radius:18px; --shadow:0 1px 2px rgba(12,26,54,.04),0 10px 28px rgba(33,58,122,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080f20; --surface:#0f1a33; --ink:#e8eefc; --muted:#9aaccc; --line:#213056; --brand:#7c9cf0; --brand-2:#5278d0; --soft:#15244a;
  --zebra:#12203f; --ok:#4ac26b; --danger:#ff7b72; --warn-bg:#33270f; --warn-ink:#f6c27a; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff}
.brand h1{margin:0;font-size:19px;line-height:1.1}.brand small{color:var(--muted);display:block;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
label.f{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
@media (prefers-color-scheme:dark){.btn.pri{color:#0b1530}}
.btn.sm{padding:5px 10px;font-size:13px}
.wlk{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:12px;flex-wrap:wrap}.wlk img{border-radius:12px;flex:none}.wlk .wlx{flex:1 1 220px;min-width:0}.wlk h3{margin:2px 0 4px;font-size:15px}.wlk p{margin:0;font-size:13px;color:var(--muted,#666);line-height:1.5}.wlk .wlb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#666)}.wlk .btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px;font-size:13.5px}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 0}
.err{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13.5px}

/* tombol penulis: portofolio + Meta-Wiki, satu kelompok */
/* tombol penulis: gaya "ghost" (tanpa kotak), supaya header tidak ramai */
.me{display:inline-flex;align-items:center;gap:2px}
.me a{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap}
.me a+a{color:var(--muted);padding-inline:9px}
.me a+a::before{content:"";width:1px;height:14px;background:var(--line);margin-inline-end:6px}
.me a:hover{background:var(--soft);color:var(--brand)}
.me a:focus-visible{outline:2px solid var(--brand-2);outline-offset:-2px}
.me svg{flex:none}
@media (max-width:520px){.me a{padding:7px 10px;font-size:13.5px}}

/* language slide switch */
.lang{display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.lang input{position:absolute;opacity:0;width:0;height:0}
.lang .track{position:relative;display:grid;grid-template-columns:1fr 1fr;width:80px;height:30px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:12px;text-align:center;line-height:28px}
.lang .track span{position:relative;z-index:1;transition:color .2s}
.lang .knob{position:absolute;top:2px;left:2px;width:38px;height:24px;border-radius:999px;background:var(--brand);transition:transform .22s ease;z-index:0}
.lang input:checked ~ .track .knob{transform:translateX(36px)}
.lang .track .a{color:#fff}.lang .track .b{color:var(--muted)}
.lang input:checked ~ .track .a{color:var(--muted)}.lang input:checked ~ .track .b{color:#fff}
@media (prefers-color-scheme:dark){.lang .track .a{color:#0b1530}.lang input:checked ~ .track .b{color:#0b1530}}
.lang input:focus-visible ~ .track{outline:2px solid var(--brand-2);outline-offset:2px}

/* toggle switch (road) */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.sw input{position:absolute;opacity:0}
.sw i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked + i{background:var(--brand)}.sw input:checked + i::after{transform:translateX(16px)}
.sw input:focus-visible + i{outline:2px solid var(--brand-2);outline-offset:2px}

/* guide */
/* panduan singkat: kartu ringan (bukan blok gradien penuh) */
.guide{padding:12px 16px;border-inline-start:4px solid var(--brand)}
.guide h2{margin:0;font-size:15px}
.gl{list-style:none;margin:8px 0 2px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px}
.gl li{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--muted)}
.gl .n{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
@media (prefers-color-scheme:dark){.gl .n{color:#0b1530}}
.guide p.gn{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
/* Quick start: satu baris yang bisa digeser, bukan tiga baris chip */
.qs{flex-wrap:nowrap}
.qs .hint{flex:none}
#chips{flex:1;min-width:0;flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
#chips .chip{flex:none;white-space:nowrap}
@media (max-width:900px){.gl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.gl{grid-template-columns:1fr}}

/* search */
.sbox{position:relative}
.add{display:flex;gap:8px}.add input{flex:1;padding:11px 14px;font-size:16px;border-radius:12px}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:50;max-height:430px;overflow:auto}
.rs{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.rs:last-child{border-bottom:0}
.rs b{display:block;overflow-wrap:anywhere}.rs small{display:block;color:var(--muted);font-size:12.5px}
.rs .btn[disabled]{cursor:default}
/* thumbnail + lencana (daftar hasil, daftar tunggu, saran) */
.th{position:relative;width:48px;height:48px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bdg{display:inline-flex;align-items:center;gap:4px;margin:4px 5px 0 0;padding:1px 9px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .flag{vertical-align:-3px;margin-inline-end:6px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.bdg.bc{display:inline-flex;flex-wrap:wrap;gap:0 5px;white-space:normal;text-overflow:clip;border-radius:14px}
.bdg.bc i{font-style:normal;opacity:.55}
.bdg.k-region{color:var(--brand);background:color-mix(in srgb,var(--brand-2) 12%,var(--surface));border-color:color-mix(in srgb,var(--brand-2) 35%,transparent)}
.bdg.k-place{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip:hover{background:var(--surface);border-color:var(--brand-2)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0b1530}}.chip[disabled]{opacity:.5}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:60;min-width:210px}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}.menu p{margin:4px 12px 6px;color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:4px}.stepper .btn{padding:4px 10px}.stepper output{min-width:26px;text-align:center;font-weight:700}

/* layout */
/* Daftar tunggu | Tempat menarik: dua kolom di layar lebar (Tempat menarik hanya muncul bila dipakai) */
.rowA{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px;align-items:start}
@media (min-width:900px){.rowA:has(#nb:not([hidden])){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* peta selebar halaman; daftar Day X di bawahnya, berkolom-kolom bila lebar */
#map{height:420px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
@media (min-width:640px){#map{height:500px}}
@media (min-width:1100px){#map{height:560px}}
#days-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px;align-items:start}
#days-box .day{margin-bottom:0}
/* layar sempit: peta di atas, daftar Day X di bawahnya. Layar lebar (≥960px): Day X di KIRI, peta menempel di KANAN sambil menggulir */
.mapdays{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px;align-items:start}
.mapdays #map{order:-1}
@media (min-width:960px){
  .mapdays{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mapdays #map{order:0;position:sticky;top:12px;height:min(82vh,760px);margin-bottom:0}
  .mapdays #days-box{grid-template-columns:minmax(0,1fr)}
}
.lbtn{font:700 12px/29px Arial,sans-serif;color:#333}.lbtn.on{background:#2d4f9c!important;color:#fff}.lbtn+.lbtn{border-top:1px solid #ddd}
.empty{text-align:center;padding:48px 20px 52px}.empty .big{font-size:44px;line-height:1;margin-bottom:12px}.empty h3{margin:0 0 8px;font-size:18px}.empty p{margin:0 auto;max-width:44ch;color:var(--muted);line-height:1.6}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.day>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 14px;border-inline-start:5px solid var(--c,#8a93a3);background:var(--soft);cursor:pointer}
.day h2{margin:0;font-size:15px}.day header span{color:var(--muted);font-size:13px}
ol.lst{list-style:none;margin:0;padding:6px;min-height:46px}
ol.lst:empty::before{content:attr(data-empty);display:block;color:var(--muted);font-size:13px;padding:12px 10px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
ol.lst.over{background:color-mix(in srgb,var(--brand-2) 10%,transparent)}
li.it{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto;gap:2px 10px;padding:9px 8px;border-radius:12px;align-items:start;cursor:grab}
li.it .th{cursor:grab}
li.it:nth-child(even){background:var(--zebra)}
li.it.drag{opacity:.4}li.it.hl{outline:2px solid var(--brand-2)}
.no{width:26px;height:26px;border-radius:50%;background:var(--c,#8a93a3);color:#fff;font-weight:700;font-size:12.5px;display:grid;place-items:center;margin-top:1px;cursor:grab}
.no.reg{background:var(--brand)}
@media (prefers-color-scheme:dark){.no.reg{color:#0b1530}}
.ti{font-weight:650;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}.ti:hover{text-decoration:underline}
.sub{display:block;color:var(--muted);font-size:12.5px}
.nt{font-size:13.5px;white-space:pre-wrap;margin-top:3px;background:color-mix(in srgb,var(--brand-2) 8%,transparent);border-radius:8px;padding:4px 8px}
li.it textarea{width:100%;margin-top:4px;min-height:60px;resize:vertical}
body[data-step="1"] .day.wlsec select[data-mv]{display:none}
li.it textarea.ntin::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li.it textarea.ntin{min-height:36px;height:36px;box-sizing:border-box;display:block;margin-top:6px;padding:6px 10px;font-size:13.5px;line-height:1.4;resize:none;overflow:hidden;background:color-mix(in srgb,var(--brand-2) 6%,transparent)}
.collect{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.collect>#nb{margin:0}
#nbPick,#nbCat{margin-bottom:12px}.nbq{position:relative;margin-bottom:10px}.nbq[hidden]{display:none}.nbq svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.nbq input{width:100%;padding-inline-start:36px}#nbCat .dd{position:relative}
#nbCat .ddb{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:start}
#nbCat .ddb svg{flex:none;color:var(--brand)}#nbCat .ddb span{flex:1;min-width:0}#nbCat .ddb .chev{color:var(--muted)}
#nbCat .ddl{margin:6px 0 0;padding:6px;list-style:none;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
#nbCat .ddl[hidden]{display:none}
#nbCat .ddl li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
#nbCat .ddl li svg{flex:none;color:var(--brand)}#nbCat .ddl li:hover{background:var(--soft)}
#nbCat .ddl li[aria-selected="true"]{background:color-mix(in srgb,var(--brand) 12%,transparent)}#nbPick:empty{display:none}
#nb{display:flex;flex-direction:column}#nb>.bd{flex:1;display:flex;flex-direction:column}#nbList{flex:1;display:flex;flex-direction:column}#nbList>.nbph{margin:auto 0;width:100%}
.collect{align-items:stretch}#wl-box{flex:1}#wl-box>.day.wlsec{flex:1;margin:0;display:flex;flex-direction:column}#wl-box>.day.wlsec>ol.lst{flex:1}
#slot1,#wl-box{display:flex;flex-direction:column}#wl-box>.card.empty{flex:1;display:flex;flex-direction:column;justify-content:center;margin:0}
.collect .card.empty{padding:36px 20px}.nbph{display:grid;justify-items:center;gap:8px;padding:10px 8px;text-align:center;color:var(--muted)}.nbph p{margin:0}#nbPick .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}@media (prefers-color-scheme:dark){#nbPick .chip.on{color:#0b1530}}
@media (min-width:960px){.collect:has(#nb:not([hidden])){grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.collect>#slot1{grid-column:1;grid-row:1}.collect>#nb{grid-column:2;grid-row:1;position:sticky;top:84px}}
.dist{grid-column:3/-1;color:var(--muted);font-size:12.5px;padding-top:2px}
/* nomor langkah + strip tombol 2–3–4 */
.stp{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none}
@media (prefers-color-scheme:dark){.stp{color:#0b1530}}
.day>header .stp{color:#fff;font-size:13px}
@media (prefers-color-scheme:dark){.day>header .stp{color:#0b1530}}
.day.wlsec>header{cursor:default;align-items:center}
.day.wlsec ol.lst{overscroll-behavior:contain;scrollbar-width:thin}
.day.wlsec>header .stp{align-self:center}
.day.wlsec>header .cap{flex-basis:100%;margin-inline-start:36px}
.planbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:10px 12px;align-items:start;padding:12px 14px}
.pb2{display:inline-flex;align-items:center;gap:8px;padding-inline:10px}
.pb2 .stp{width:22px;height:22px;font-size:12px}
.pstep small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;line-height:1.35}
.pb{display:flex;align-items:center;gap:8px;width:100%;text-align:start;white-space:normal;padding:7px 10px}
.pb .stp{width:24px;height:24px;font-size:12.5px}
.pstep.rd{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:6px}
.pstep.rd .hint{margin:0}
/* strip kini selebar halaman: empat kolom (②③④ + ceklis rute mobil) sampai layar ±700px; ceklis baru turun ke baris sendiri di bawah itu, dan satu kolom hanya di layar smartphone */
@media (max-width:700px){.planbar{grid-template-columns:repeat(2,minmax(0,1fr))}.pstep.rd{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;padding-top:2px}}
@media (max-width:480px){.planbar{grid-template-columns:1fr}}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acts select{padding:4px 6px;font-size:12.5px;max-width:112px}
@media (max-width:560px){li.it{grid-template-columns:28px 48px minmax(0,1fr)}li.it .acts{grid-column:2/-1;justify-content:flex-start;margin-top:6px}li.it .acts select{max-width:none;flex:1 1 130px}}   /* ponsel: tombol aksi turun ke baris sendiri, judul tidak tergencet */
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1}
.ib:hover{background:var(--soft)}.ib.x:hover{color:var(--danger)}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 12px/22px Arial;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:12px;font-size:14px;display:none;z-index:2000;max-width:92vw;align-items:center;gap:12px}
#msg.on{display:flex}#msg button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
.sg{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}.sg>div{flex:1;min-width:0}.sg b{display:block;overflow-wrap:anywhere}.sg small{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px}
footer.credit{margin-top:6px;padding-bottom:6px;font-weight:600}footer.credit a{color:var(--brand);text-decoration:none}footer.credit a:hover{text-decoration:underline}
.maplibregl-map{font:inherit}
[hidden]{display:none!important}

/* stepper: bulatan angka + label + garis penghubung (tanpa kotak). Tahap hanya bisa dibuka berurutan: tahap di depan terkunci (disabled) */
.sn{position:sticky;top:0;z-index:50;display:flex;align-items:center;padding:6px 4px;margin:0 0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sn .st{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-height:48px;padding:0;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.sn .st:not(:last-child){flex:1 1 0;min-width:0}

/* Bahasa antarmuka: ?lang=id|en menimpa pilihan tersimpan; tanpa keduanya, bawaannya en */
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'id' || q === 'en') return q;
  try { const s = localStorage.getItem(LS_LANG); if (s === 'id' || s === 'en') return s; } catch {}
  return 'en';
})();
function setQuery(mut, hash = location.hash) {   // ubah satu-dua parameter URL tanpa menghapus yang lain (lang, lat, lon, zoom)
  try { const p = new URLSearchParams(location.search); mut(p); history.replaceState(null, '', '?' + p.toString() + hash); } catch {}
}
const tr = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'string' ? v.replace(/\{(\d)\}/g, (_, i) => a[i] ?? '') : v; };
const loc = () => lang === 'id' ? 'id-ID' : 'en-US';
const nf = n => n.toLocaleString(loc(), { maximumFractionDigits:1 });
function applyI18n() {
  document.documentElement.lang = lang; $('#lang').checked = lang === 'en';
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = tr(e.dataset.i); });
  document.querySelectorAll('[data-ip]').forEach(e => { e.placeholder = tr(e.dataset.ip); });
  document.querySelectorAll('[data-it]').forEach(e => { e.title = tr(e.dataset.it); });
  document.querySelectorAll('[data-ia]').forEach(e => e.setAttribute('aria-label', tr(e.dataset.ia)));
  setQuery(p => p.set('lang', lang));
}

/* ---------- data ---------- */
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const newTrip = name => ({ id:uid(), name, start:todayISO(), days:1, items:[] });
let db;
try { db = JSON.parse(localStorage.getItem(LS)); } catch { db = null; }
if (!db || !Array.isArray(db.trips) || !db.trips.length) { const t = newTrip(tr('defTrip')); db = { cur:t.id, trips:[t] }; }
const cur = () => db.trips.find(t => t.id === db.cur) || db.trips[0];
const save = () => { try { localStorage.setItem(LS, JSON.stringify(db)); } catch {} };
let step = 1, reached = 1, seen = 1, routeDone = false, nbSeq = 0;   // reached = tahap terjauh yang sudah ditempuh   // tahap aktif + penanda tahap yang sudah ditempuh
const undoStack = [];
function mutate(fn) { routeDone = false; undoStack.push(JSON.stringify(db)); if (undoStack.length > 30) undoStack.shift(); fn(); save(); render(); }
function undo() { if (!undoStack.length) return; db = JSON.parse(undoStack.pop()); save(); render(); toast(tr('toastUndone')); }
let toastT;
function toast(msg, actionLabel, action) {
  const m = $('#msg'); m.textContent = msg;
  if (actionLabel) { const b = document.createElement('button'); b.textContent = actionLabel; b.onclick = () => { action(); m.classList.remove('on'); }; m.append(b); }
  m.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => m.classList.remove('on'), actionLabel ? 6000 : 2800);
}

/* ---------- tanggal & jarak ---------- */
function dayDate(t, d) { const [y, m, dd] = t.start.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + d - 1)); }
const fmtDate = (dt, long) => dt.toLocaleDateString(loc(), { weekday:long ? 'long' : 'short', day:'numeric', month:long ? 'long' : 'short', year:long ? 'numeric' : undefined, timeZone:'UTC' });
function km(a, b) {

    if (!todo.length) { if (redo) { db.kindV = 4; save(); } return; }
    const info = new Map();
    for (const c of chunk([...new Set(todo.map(i => i.q))], 40)) (await fetchEntities(c)).forEach(x => info.set(x.q, x));
    let n = 0;
    todo.forEach(i => {
      const x = info.get(i.q); if (!x) return;
      if (i.kind !== x.kind) n++;
      i.kind = x.kind; if (!i.thumb) i.thumb = x.thumb || ''; if (x.kind === 'region' || !i.badge) i.badge = x.badge || '';   // wilayah: badge selalu diperbarui jadi breadcrumb
      if (i.kind === 'region') i.day = 0;   // wilayah tidak dijadwalkan
    });
    if (redo) db.kindV = 4;
    save(); if (n || redo) render();
  } catch (e) { console.warn('enrich:', e && e.message); }
})();
})();
</script>
</body>
</html>
