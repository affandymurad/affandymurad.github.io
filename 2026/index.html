        /* ==========================================================================
           Searchable Combobox — progressive enhancement over a native <select>
           ========================================================================== */
        function makeCombo(sel, iconFn) {
            const wrap = sel.closest('.mac-select-wrap');
            const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            sel.classList.add('combo-native');
            sel.tabIndex = -1;
            sel.setAttribute('aria-hidden', 'true');

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mac-select combo-btn';
            btn.setAttribute('aria-haspopup', 'listbox');
            btn.setAttribute('aria-expanded', 'false');
            const label = document.createElement('span');
            label.className = 'combo-label';
            btn.appendChild(label);
            sel.after(btn);

            const panel = document.createElement('div');
            panel.className = 'combo-panel';
            panel.hidden = true;
            panel.innerHTML = `<div class="combo-search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg><input type="search" class="combo-input" placeholder="Search…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true"></div><ul class="combo-list" role="listbox"></ul>`;
            wrap.appendChild(panel);
            const input = panel.querySelector('.combo-input');
            const list = panel.querySelector('.combo-list');
            let items = [], active = -1;

            const readOptions = () => {
                const out = [];
                [...sel.children].forEach(ch => {
                    if (ch.tagName === 'OPTGROUP') [...ch.children].forEach(o => out.push({ o, group: ch.label }));
                    else out.push({ o: ch, group: '' });
                });
                return out.map(({ o, group }) => ({ value: o.value, text: o.textContent, group, hay: norm(o.textContent + ' ' + (o.dataset.alias || '') + ' ' + o.value) }));
            };

            const setActive = i => {
                const lis = [...list.querySelectorAll('.combo-item')];
                if (!lis.length) { active = -1; return; }
                active = (i + lis.length) % lis.length;
                lis.forEach((li, k) => li.classList.toggle('active', k === active));
                lis[active].scrollIntoView({ block: 'nearest' });
            };

            const render = q => {
                const nq = norm(q.trim());
                items = readOptions().filter(it => !nq || it.hay.includes(nq));
                let html = '', lastGroup = null;
                items.forEach((it, i) => {
                    if (it.group && it.group !== lastGroup) html += `<li class="combo-group" role="presentation">${esc(it.group)}</li>`;
                    lastGroup = it.group;
                    html += `<li class="combo-item${it.value === sel.value ? ' selected' : ''}" role="option" data-i="${i}" aria-selected="${it.value === sel.value}">${iconFn ? `<span class="combo-ico">${iconFn(it.value) || ''}</span>` : ''}<span>${esc(it.text)}</span></li>`;
                });
                list.innerHTML = html || '<li class="combo-empty" role="presentation">No match found</li>';
                const lis = [...list.querySelectorAll('.combo-item')];
                const selIdx = nq ? 0 : Math.max(0, items.findIndex(it => it.value === sel.value));
                setActive(Math.min(selIdx, lis.length - 1));
            };

            const open = seed => {
                if (!panel.hidden) return;
                panel.hidden = false;
                wrap.classList.add('open');
                btn.setAttribute('aria-expanded', 'true');
                input.value = seed || '';
                render(input.value);
                input.focus();
            };
            const close = refocus => {
                if (panel.hidden) return;
                panel.hidden = true;
                wrap.classList.remove('open');
                btn.setAttribute('aria-expanded', 'false');
                if (refocus) btn.focus();
            };
            const choose = i => {
                const it = items[i];
                if (!it) return;
                const changed = sel.value !== it.value;
                sel.value = it.value;
                refresh();
                close(true);
                if (changed) sel.dispatchEvent(new Event('change', { bubbles: true }));
            };
            const refresh = () => {
                const o = sel.options[sel.selectedIndex];
                label.textContent = o ? o.textContent : '';
                const a = sel.getAttribute('aria-label');
                if (a) btn.setAttribute('aria-label', a);
            };

            btn.addEventListener('click', () => (panel.hidden ? open() : close(true)));
            btn.addEventListener('keydown', e => {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(); }
                else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== ' ') { e.preventDefault(); open(e.key); }
            });
            input.addEventListener('input', () => render(input.value));
            input.addEventListener('keydown', e => {
                if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
                else if (e.key === 'Enter') { e.preventDefault(); if (active >= 0) choose(Number(list.querySelectorAll('.combo-item')[active].dataset.i)); }
                else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(true); }
                else if (e.key === 'Tab') close(false);
            });
            list.addEventListener('mousemove', e => {
                const li = e.target.closest('.combo-item');
                if (li) setActive([...list.querySelectorAll('.combo-item')].indexOf(li));
            });
            list.addEventListener('click', e => {
                const li = e.target.closest('.combo-item');
                if (li) choose(Number(li.dataset.i));
            });
            document.addEventListener('pointerdown', e => { if (!wrap.contains(e.target)) close(false); });

            sel._combo = { refresh };
            refresh();
            return sel._combo;
        }

/* Year switcher: every year is its own page (../2027/), so carry the current selection over */
        const AVAILABLE_YEARS = [2026, 2027];

        function goToYear(y) {
            if (y === YEAR || !AVAILABLE_YEARS.includes(y)) return;
            store.set(`cal${y}-country`, country);
            store.set(`cal${y}-my-state`, myState);
            store.set(`cal${y}-cn-region`, cnRegion);
            store.set(`cal${y}-view`, view);
            const t = store.get(`cal${YEAR}-theme`);
            if (t) store.set(`cal${y}-theme`, t);
            const p = new URLSearchParams({ country });
            if (country === 'MY') p.set('region', myState);
            else if (country === 'CN') p.set('region', cnRegion);
            location.href = `../${y}/?${p}`;
        }

        (() => {
            const sel = $('#yearSel');
            sel.innerHTML = AVAILABLE_YEARS.map(y => `<option value="${y}"${y === YEAR ? ' selected' : ''}>${y}</option>`).join('');
            sel.addEventListener('change', () => goToYear(Number(sel.value)));
            const i = AVAILABLE_YEARS.indexOf(YEAR);
            const prev = AVAILABLE_YEARS[i - 1], next = AVAILABLE_YEARS[i + 1];
            const wire = (btn, y, word) => {
                btn.disabled = !y;
                btn.setAttribute('aria-label', y ? `${word} year (${y})` : `${word} year (none available)`);
                btn.title = y ? `${y} calendar` : `No ${word.toLowerCase()} calendar yet`;
                if (y) btn.addEventListener('click', () => goToYear(y));
            };
            wire($('#yearPrev'), prev, 'Previous');
            wire($('#yearNext'), next, 'Next');
        })();

        makeCombo($('#countrySel'), v => FLAG_SVGS[v]);
        makeCombo($('#stateSel'));

        $('#countrySel').addEventListener('change', e => {
            country = e.target.value;
            store.set('cal2026-country', country);
            if (dlg.open) dlg.close();
            renderAll();
        });

        $('#stateSel').addEventListener('change', e => {
            if (country === 'CN') {
                cnRegion = e.target.value;
                store.set('cal2026-cn-region', cnRegion);
            } else {
                myState = e.target.value;
                store.set('cal2026-my-state', myState);
            }
            if (dlg.open) dlg.close();
            renderAll();
        });

        document.addEventListener('click', e => {
            const t = e.target;
            const dayBtn = t.closest('[data-k]');
            if (dayBtn) {
                if (dayBtn.dataset.go) {
                    const m = parse(dayBtn.dataset.k).getMonth();
                    if (dlg.open) dlg.close();
                    cur = m;
                    if (view === 'month') renderCal();
                    $('#cal').scrollIntoView({ block: 'start' });
                    if (view === 'year') $('#bln-' + m)?.scrollIntoView({ block: 'start' });
                }
                return openDay(dayBtn.dataset.k);
            }
            const chip = t.closest('.chip');
            if (chip) return go(Number(chip.dataset.m), true);
            const nav = t.closest('[data-nav]');
            if (nav) return go(cur + Number(nav.dataset.nav), false);
        });

        $('#vYear').onclick = () => setView('year');
        $('#vMonth').onclick = () => setView('month');
        $('#pdfBtn').onclick = exportPDF;
        $('#themeBtn').onclick = () => {
            theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
            store.set('cal2026-theme', theme);
            applyTheme();
        };

        if (inYear) {
            const tb = $('#todayBtn');
            tb.hidden = false;
            tb.onclick = () => {
                go(todayMonth, true);
                openDay(todayKey);
            };
        }

        // Keyboard arrow navigation in single-month view
        document.addEventListener('keydown', e => {
            if (dlg.open || view !== 'month' || e.target.closest('input,select,textarea')) return;
            if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1, false);
            if (e.key === 'ArrowRight' && cur < 11) go(cur + 1, false);
        });

        // Touch swipe support in single-month view
        let sx = 0, sy = 0;
        $('#cal').addEventListener('touchstart', e => {
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
        }, { passive: true });

        $('#cal').addEventListener('touchend', e => {
            if (view !== 'month') return;
            const dx = e.changedTouches[0].clientX - sx;
            const dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                go(cur + (dx < 0 ? 1 : -1), false);
            }
        }, { passive: true });

        // Highlight visible month pill during Year View scroll
        const io = new IntersectionObserver(entries => {
            if (view !== 'year') return;
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const idx = Number(entry.target.id.slice(4));
                    document.querySelectorAll('.chip').forEach(c => {
                        if (Number(c.dataset.m) === idx) c.setAttribute('aria-current', 'true');
                        else c.removeAttribute('aria-current');
                    });
                }
            });
        }, { rootMargin: '-35% 0px -55% 0px' });

        new MutationObserver(() => {
            document.querySelectorAll('.month').forEach(el => io.observe(el));
        }).observe($('#cal'), { childList: true });

        // Initialize application
        applyTheme();
        renderChips();
        renderAll();
        if (view === 'year' && todayMonth >= 0) {
            setTimeout(() => $('#bln-' + todayMonth)?.scrollIntoView({ block: 'start' }), 60);
        }
    </script>
</body>

</html>
